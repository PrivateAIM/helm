name: Sync Kong MinIO Gateway Plugin

on:
  # Manual trigger
  workflow_dispatch:
  # Triggered by repository_dispatch from kong-plugin-minio-gateway repo
  repository_dispatch:
    types: [sync-kong-plugin]
  # TODO: Remove this trigger after testing - only for branch testing
  push:
    branches:
      - kong-minio-plugin
    paths:
      - '.github/workflows/sync-kong-plugin.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-plugin:
    name: Sync Plugin from Source Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helm repository
        uses: actions/checkout@v4

      - name: Fetch plugin source files
        id: fetch-plugin
        run: |
          # Clone the plugin repository
          git clone --depth 1 https://github.com/PrivateAIM/kong-plugin-minio-gateway.git /tmp/kong-plugin
          
          # Get the commit SHA for traceability
          cd /tmp/kong-plugin
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "Plugin source commit: $COMMIT_SHA"

      - name: Generate ConfigMap template
        run: |
          PLUGIN_DIR="/tmp/kong-plugin/kong/plugins/minio-gateway"
          OUTPUT_FILE="charts/flame-node/templates/kong/minio-gateway-plugin-configmap.yaml"
          COMMIT_SHA="${{ steps.fetch-plugin.outputs.commit_sha }}"
          
          # Create output directory if it doesn't exist
          mkdir -p "$(dirname "$OUTPUT_FILE")"
          
          # Helper function to indent content
          indent_content() {
            sed 's/^/    /'
          }
          
          # Generate the ConfigMap template header
          cat > "$OUTPUT_FILE" << EOF
          # This ConfigMap is auto-generated by the sync-kong-plugin workflow.
          # Do not edit manually - changes will be overwritten.
          # Source: https://github.com/PrivateAIM/kong-plugin-minio-gateway
          # Source Commit: $COMMIT_SHA
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kong-plugin-minio-gateway
            namespace: {{ .Release.Namespace }}
            labels:
              app.kubernetes.io/name: kong-plugin-minio-gateway
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/managed-by: {{ .Release.Service }}
          data:
          EOF
          
          # Remove leading whitespace from heredoc (dedent)
          sed -i 's/^          //' "$OUTPUT_FILE"
          
          # Add handler.lua
          echo "  handler.lua: |" >> "$OUTPUT_FILE"
          cat "$PLUGIN_DIR/handler.lua" | indent_content >> "$OUTPUT_FILE"
          
          # Add schema.lua
          echo "  schema.lua: |" >> "$OUTPUT_FILE"
          cat "$PLUGIN_DIR/schema.lua" | indent_content >> "$OUTPUT_FILE"
          
          # Add aws_v4.lua
          echo "  aws_v4.lua: |" >> "$OUTPUT_FILE"
          cat "$PLUGIN_DIR/aws_v4.lua" | indent_content >> "$OUTPUT_FILE"
          
          echo "ConfigMap template generated successfully"

      - name: Check for changes
        id: check-changes
        run: |
          # Add all files to staging to detect new files
          git add charts/flame-node/templates/kong/minio-gateway-plugin-configmap.yaml
          
          if git diff --cached --quiet charts/flame-node/templates/kong/minio-gateway-plugin-configmap.yaml; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in plugin files"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in plugin files"
            git diff --cached charts/flame-node/templates/kong/minio-gateway-plugin-configmap.yaml
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(flame-node): sync kong minio-gateway plugin (${{ steps.fetch-plugin.outputs.commit_short }})"
          title: "chore(flame-node): sync kong minio-gateway plugin"
          body: |
            This PR syncs the Kong MinIO Gateway plugin from the source repository.
            
            **Source Repository:** [PrivateAIM/kong-plugin-minio-gateway](https://github.com/PrivateAIM/kong-plugin-minio-gateway)
            **Source Commit:** [`${{ steps.fetch-plugin.outputs.commit_short }}`](https://github.com/PrivateAIM/kong-plugin-minio-gateway/commit/${{ steps.fetch-plugin.outputs.commit_sha }})
            
            ---
            
            This PR was automatically generated by the `sync-kong-plugin` workflow.
          branch: sync-kong-plugin
          delete-branch: true
          labels: |
            automated
            dependencies
