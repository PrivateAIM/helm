name: Release

on:
  push:
    branches:
      - master
  # Re-push an already released version to the OCI registry, e.g. after a
  # failed push step. Re-running the release job does not work for that:
  # release-please reports no new release, so every later step is skipped.
  workflow_dispatch:
    inputs:
      version:
        description: 'Released chart version to push, e.g. 1.4.1'
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  packages: write
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      -   uses: googleapis/release-please-action@v4
          id: release
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        if: steps.release.outputs.releases_created == 'true'
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: tada5hi/hevi@v2.0.2
        if: steps.release.outputs.releases_created == 'true'
        with:
          directory: charts
          versionize: true
          version: ${{ steps.release.outputs['major'] }}.${{ steps.release.outputs['minor'] }}.${{ steps.release.outputs['patch'] }}
          package: true
          release: true
          push: true
          push-host: ghcr.io/privateaim/charts
          push-username: ${{ github.actor }}
          push-password: ${{ secrets.GITHUB_TOKEN }}
          push-skip-existing: true

  push:
    name: Push
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: flame-hub-${{ inputs.version }}
          fetch-depth: 0

      - uses: tada5hi/hevi@v2.0.2
        with:
          directory: charts
          versionize: true
          version: ${{ inputs.version }}
          package: true
          push: true
          push-host: ghcr.io/privateaim/charts
          push-username: ${{ github.actor }}
          push-password: ${{ secrets.GITHUB_TOKEN }}
          push-skip-existing: true
