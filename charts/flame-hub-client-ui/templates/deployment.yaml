apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-flame-hub-client-ui"
  labels:
    app: "{{ .Release.Name }}-flame-hub-client-ui"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-flame-hub-client-ui"
  template:
    metadata:
      name: "{{ .Release.Name }}-flame-hub-client-ui"
      labels:
        app: "{{ .Release.Name }}-flame-hub-client-ui"
        appGroup: "{{ .Release.Name }}-flame-hub"
    spec:
      restartPolicy: Always
      containers:
        - name: "{{ .Release.Name }}-flame-hub-client-ui"
          image: "ghcr.io/privateaim/hub:{{ .Chart.AppVersion }}"
          args: ["ui", "start"]
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            {{- with .Values.cookieDomain }}
              -   name: NUXT_PUBLIC_COOKIE_DOMAIN
                  value: "{{- toString . | trim }}"
            {{- end }}
              -   name: NUXT_STORAGE_URL
                  value: "http://{{ .Release.Name }}-flame-hub-server-storage:3000/"
              -   name: NUXT_PUBLIC_STORAGE_URL
                  value: {{ include "storage.publicURL" . | trim | quote }}
              -   name: NUXT_CORE_URL
                  value: "http://{{ .Release.Name }}-flame-hub-server-core:3000/"
              -   name: NUXT_PUBLIC_CORE_URL
                  value: {{ include "core.publicURL" . | trim | quote }}
              -   name: NUXT_AUTHUP_URL
                  value: "http://{{ .Release.Name }}-authup-server-core:3000/"
              -   name: NUXT_PUBLIC_AUTHUP_URL
                  value: {{ include "authup.publicURL" . | trim | quote }}
          resources:
              requests:
                  memory: "512Mi"
              limits:
                  memory: "2048Mi"
          readinessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              initialDelaySeconds: 60
              periodSeconds: 5
              timeoutSeconds: 10
          livenessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 10
              timeoutSeconds: 10


