apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasources
type: Opaque
stringData:
  datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus-server:9090
        jsonData:
          httpMethod: POST
          manageAlerts: true
          prometheusType: Prometheus
          prometheusVersion: 2.44.0
          cacheLevel: 'High'
          disableRecordingRules: false
          incrementalQueryOverlapWindow: 10m
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ .Release.Name }}-loki-query-frontend:3100
        jsonData:
          timeout: 60
          maxLines: 1000
