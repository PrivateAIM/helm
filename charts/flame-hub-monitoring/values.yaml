# Default values for flame-hub-monitoring.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

ingress:
  enabled: true
  hostname: "foo.bar"
  path: "/"
  pathType: "Prefix"

grafana:
  nameOverride: "grafana"
  image:
    pullPolicy: "Always"
  admin:
    password: "start123"
  dashboardsProvider:
    enabled: true
  datasources:
    secretName: grafana-datasources

grafana-loki:
  nameOverride: "loki"
  image:
    pullPolicy: "Always"

prometheus:
  nameOverride: "prometheus"
  image:
    pullPolicy: "Always"



