# Global values
global:
  node:
    ingress:
      ## @param global.node.ingress.enabled Toggle whether ingress should be enabled
      enabled: false
      ## @param global.node.ingress.enabled Host name to be assigned to the Node UI (/) and Hub Adapter API (/api)
      hostname:

## @param offline Forces the UI and hub adapter to use the internal service endpoint for authentication
## Overrides hubAdapter.idp.jwks
offline: false

userIdp:
  ## @param userIdp.hostname Hostname for a separate IDP to manage users who can access the FLAME Node UI.
  ## Leave this blank unless you want to use your own IDP
  ## If this is set, clients for the UI and hubAdapter must be created in the IDP and the clientId and clientSecret
  ## provided below (see .Values.ui.idp and .Values.hubAdapter.idp)
  hostname:

## For defining ingress specific metadata
ingress:
  ## @param ingress.enabled Enable ingress record generation for the Node UI
  ##
  enabled: false
  ## @param ingress.hostname Default host for the ingress record (evaluated as template)
  ##
  hostname: ""
  ## @param ingress.pathType Ingress path type
  ##
  pathType: ImplementationSpecific
  ## @param ingress.path Default file path for the ingress hostname
  ##
  path: /

  annotations: {}
  className: ""
  # Specify a tls secret to enable TLS for the given hostname
  tlsSecretName: ""

## Hub services and data
hub:
  endpoints:
    ## @param hub.endpoints.core Hub core API endpoint
    core: https://core.privateaim.dev
    ## @param hub.endpoints.auth Hub auth API endpoint
    auth: https://auth.privateaim.dev
    ## @param hub.endpoints.messenger Hub messenger API endpoint. Overrides broker.HUB_BASE_URL if provided
    messenger: https://messenger.privateaim.dev
    ## @param hub.endpoints.storage Hub storage API endpoint
    storage: https://storage.privateaim.dev
  ## Credentials used for retrieving a valid token from the hub using a robot account
  auth:
    robotUser:
    robotSecret:
    ## @param hub.auth.existingSecret Existing k8s secret containing secret for given hub robot user UUID
    ## The secret must have a key named "robotSecret"
    existingSecret: ""
  ## Values required by the result service for encrypting intermediate results sent to the Hub
  crypto:
    ## @param hub.crypto.privateKey Content of the private key to be added to the secret. Need to use the "|" scalar:
    ## https://yaml.org/spec/1.2.2/#812-literal-style
    ##
    privateKey:
    ## @param hub.crypto.existingSecret Existing secret containing the private key for the node
    ## Create this secret following the steps below:
    ## 1) Generate your public and private key pair using the "Crypto" tab in the Hub
    ## 2) Save the private key as 'private_key.pem' (it must use this name)
    ## 3) Run the command below where SECRET_NAME is the name of the secret you want to create:
    ##       kubectl create secret generic SECRET_NAME --from-file=./private_key.pem
    existingSecret:

# kong values
kong:
  image:
    repository: kong
    tag: "3.6"

  env:
    prefix: /kong_prefix/
    database: postgres
    # The default values for admin_listen include both ipv4 and ipv6 - if cluster does not support ipv6, it should be defined (minikube does not support ipv6)
    # admin_listen: "127.0.0.1:8001"

  admin:
    enabled: true
    type: ClusterIP
    http:
      enabled: true
      servicePort: 80
    tls:
      enabled: false

  manager:
    enabled: false

  portal:
    enabled: false

  portalapi:
    enabled: false

  proxy:
    enabled: true
    type: ClusterIP
    http:
      enabled: true
      servicePort: 80
    tls:
      enabled: false

  ingressController:
    enabled: false

  # Sub-chart
  postgresql:
    enabled: true
    nameOverride: kong-postgresql
    auth:
      database: kong
      username: kong
      password: kong
      postgresPassword: supersecretpassword

resultService:
  env:
    MINIO_USE_SSL: false
    MINIO_BUCKET: flame
    OIDC_CERTS_URL:
    OIDC_CLIENT_ID_CLAIM_NAME: azp

  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/privateaim/node-result-service
    # Overrides the image tag whose default is the chart appVersion.
    tag: sha-68e442f
    # This sets the pull policy for images.
    pullPolicy: Always

  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: [ ]

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: { }
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: { }

  podSecurityContext: { }
  # fsGroup: 2000

  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ ALL ]

  resources: { }
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
