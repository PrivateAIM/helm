  startupProbe:
    httpGet:
      path: /healthz
      port: healthcp
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 3
  livenessProbe:
    httpGet:
      path: /healthz
      port: healthcp
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 3
  readinessProbe:
    httpGet:
      path: /healthz
      port: healthcp
    failureThreshold: 3
    periodSeconds: 5
    timeoutSeconds: 3

  # Additional environment variables on the output Deployment definition.
  extraEnv: []
  # - name: FOO
  #   value: bar

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
