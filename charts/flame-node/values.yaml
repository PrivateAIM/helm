  env: production

  ## @param nuxtAuthSecret Used for encrypting JWTs. Auto-generated on first install and preserved across upgrades.
  ## Set this to a fixed value to pin the secret (e.g. `openssl rand -base64 32`).
  nuxtAuthSecret: ""
  ## @param nuxtAuthExistingSecret Name of an existing Secret containing the nuxtAuthSecret under the key "nuxtAuthSecret".
  ## When set, the chart does not create or manage the nuxtAuthSecret and nuxtAuthSecret above is ignored.
  nuxtAuthExistingSecret: ""

  ## IDP related information
  idp:
    ## @param idp.debug If true, the clientId and clientSecret will use pre-defined values
    ## The clientSecret will be defined using the "static" k8s secret key
    debug: false
    ## @param idp.clientId IDP's client ID for this service
    clientId: node-ui
    ## @param idp.clientSecret IDP client secret. Ignored if `idp.existingSecret` is provided
    ## If not defined and no existingSecret provided, a random string is generated
    clientSecret: ""
    ## @param idp.existingSecret Existing k8s secret containing IDP secret for this client
    ## idp.existingSecretKey should also be defined for custom k8s secret. Defaults to nodeUiClientSecret
    existingSecret: ""
    ## @param idp.existingSecretKey Key where the client secret is being stored inside the existing k8s secret
    existingSecretKey: ""

  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/privateaim/node-ui
    # Overrides the image tag whose default is the chart appVersion.
    tag: 0.8.1
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent

  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext:
    runAsNonRoot: true
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  startupProbe:
    httpGet:
      path: /healthz
      port: ui
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 3
  livenessProbe:
    httpGet:
      path: /healthz
      port: ui
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 3
  readinessProbe:
    httpGet:
      path: /healthz
      port: ui
    failureThreshold: 3
    periodSeconds: 5
    timeoutSeconds: 3

  # Additional environment variables on the output Deployment definition.
  extraEnv: []
  # - name: FOO
  #   value: bar

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

## node-data-store deploys dummy blaze (FHIR) and seaweedfs (S3) data stores for testing the Flame Node
dataStore:
  enabled: false

  # blaze values
  blaze:
    service:
      type: ClusterIP
      port: 80

    persistence:
      enabled: true
      size: 5Gi

    # ⚠️ Note:
    # The dataPopulatorJob is intended for initial population of FHIR resources with dummy data from Synthea.
    # If enabled (`enabled: true`), it will add resources to the Blaze data store which may lead to unintended data being present.
    # By default, this job is disabled. Only enable it if you want to populate the Blaze data store with initial data.
    # ⚠️ Recommended: Keep `dataPopulatorJob.enabled: false` after initial setup to avoid data contamination.
    dataPopulatorJob:
      enabled: false
      env:
        SYNTHEA_N_PATIENTS: 10
        SYNTHEA_SEED: 3256262546
        SYNTHEA_CLINICIAN_SEED: 3726451
        TIMEOUT: 2

  seaweedfs:
    ## Run everything (master, volume, filer, S3) in a single pod.
    master: { enabled: false }
    volume:
      enabled: false
      dataDirs:
        - name: data1
          type: "custom"
          maxVolumes: 1000
    filer: { enabled: false }

    s3:
      ## The standalone S3 deployment stays off; the S3 gateway runs inside the all-in-one pod below.
      enabled: false

    allInOne:
      enabled: true
      extraEnvironmentVars:
        WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
      s3:
        enabled: true
        enableAuth: false

      data:
        type: persistentVolumeClaim
        size: 5Gi
      
      podSecurityContext:
        enabled: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        enabled: true
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

    ## Admin UI dashboard for browsing/creating buckets and cluster management
    admin:
      enabled: true
      podSecurityContext:
        enabled: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        enabled: true
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

      ## Expose the admin panel in the browser via the node Ingress API
      ingress:
       enabled: false
       ## @param dataStore.seaweedfs.admin.ingress.host Hostname for the admin panel. Must be set even if the same
       ## as .expose.hostname
       host:
       ## @param dataStore.seaweedfs.admin.ingress.path Base path the admin process serves from.
       path: "/seaweedfs"
       annotations:
         nginx.ingress.kubernetes.io/proxy-body-size: 500m

      ## Expose the admin panel in the browser via the node Gateway (only applies when expose.type=gateway).
      ## seaweedfs itself only ships an Ingress, so this chart creates a Gateway API HTTPRoute attached to
      ## the node Gateway instead. Under expose.type=ingress use admin.ingress.
      gateway:
        ## @param dataStore.seaweedfs.admin.gateway.enabled Opt-in: create an HTTPRoute for the admin panel on the node Gateway.
        enabled: false
        ## @param dataStore.seaweedfs.admin.gateway.hostname Optional dedicated hostname for the admin panel.
        ## Leave blank (or equal to expose.hostname) to serve the panel at the admin.urlPrefix path on the shared
        ## node hostname (urlPrefix is then required). Set a different hostname to serve it at that host's root
        ## instead; when the node Gateway is chart-managed an extra HTTP listener for this hostname is added
        ## to the Gateway automatically.
        hostname: ""

      ## @param dataStore.seaweedfs.admin.urlPrefix Base path the admin process serves from (seaweedfs `-urlPrefix`).
      ## REQUIRED when exposing the admin panel on the shared node hostname (gateway.hostname blank): set it to the
      ## sub-path you want, e.g. "/seaweedfs". Leave blank when using a dedicated gateway.hostname (served at root) or
      ## when reaching the admin only by port-forward / admin.ingress.
      urlPrefix: ""

      ## Admin UI login. Provide an explicit password: the seaweedfs subchart renders the admin
      ## Secret directly from these values. Leaving adminPassword blank disables admin auth.
      ## To bring your own Secret instead, set secret.existingSecret (plus userKey/pwKey).
      ## @param dataStore.seaweedfs.admin.secret.adminUser Admin UI username.
      ## @param dataStore.seaweedfs.admin.secret.adminPassword Admin UI password (required for auth).
      secret:
        adminUser: "admin"
        adminPassword: ""
        # Name of an existing secret containing admin credentials. If set, adminUser and adminPassword below are ignored.
        existingSecret: ""
        # Key in the existing secret for the admin username. Required if existingSecret is set.
        userKey: ""
        # Key in the existing secret for the admin password. Required if existingSecret is set.
        pwKey: ""

## Used by the node components for storing information on the analysis pods and logging events
postgresql:
  nameOverride:
  fullnameOverride:

  resources: {}

  service:
    type: ClusterIP
    port: 5432

  ## Credentials for the main PostgreSQL instance.
  ## Passwords are auto-generated on first install and preserved across upgrades via lookup.
  ## To use an external secret instead, change settings.existingSecret and userDatabase.existingSecret
  ## to its name, the chart will skip creating its own secret when those are changed.
  auth:
    ## @param postgresql.auth.superPassword Superuser password. Auto-generated on first install if blank.
    superPassword: ""
    ## @param postgresql.auth.user Application database username. Changing after initial install requires manual database migration.
    user: ""
    ## @param postgresql.auth.password Application database password. Auto-generated on first install if blank.
    password: ""
    ## @param postgresql.auth.database Application database name.
    database: "postgres_db"

  ## Database configuration
  settings:
    ## Optional existing secret for the Postgres superuser
    existingSecret: postgres-credentials-secret

    ## @param postgresql.settings.keepCredentialSecret Retain the generated credential secret on `helm uninstall`
    ## so the auto-generated password stays in sync with the retained PostgreSQL data PVC on reinstall.
    ## Set to false to let Helm delete the secret with the release (e.g. when you also wipe the data PVC).
    keepCredentialSecret: true

    ## The default postgres superuser (default when nothing is set: "postgres")
    superuser:
    #  secretKey:
    #  value:

    ## The superuser password
    superuserPassword:
      secretKey: superPassword

  ## Optional user database which is created during first startup with user and password
  userDatabase:
    ## Optional existing secret with database name, user and password
    existingSecret: postgres-credentials-secret
    ## Name of the user database
    name:
      ##  Use secretKey when existingSecret was specified otherwise value
      secretKey: DB_DATABASE
      # value:
    ## Database user with full access rights
    ##  Use secretKey when existingSecret was specified otherwise value
    user:
      secretKey: DB_USER
      # value:
    ## Password of the database user
    ##  Use secretKey when existingSecret was specified otherwise value
    password:
      secretKey: DB_PASSWORD
      # value:

  ## Storage parameters
  storage:
    ## Internal volume name and prefix of a created PVC
    volumeName: "postgres-data"

    ## Alternative set requestedSize to define a size for a dynmaically created PVC
    requestedSize: 8Gi

    ## the storage class name
    className:

kong-postgresql:
