  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

## node-data-store deploys dummy blaze (FHIR) and minio (S3) data stores for testing the Flame Node
flame-node-data-store:
  enabled: false

  # blaze values
  blaze:
    service:
      type: ClusterIP
      port: 80

    persistence:
      enabled: true
      size: 5Gi

    # ⚠️ Note:
    # The dataPopulatorJob is intended for initial population of FHIR resources with dummy data from Synthea.
    # If enabled (`enabled: true`), it will add resources to the Blaze data store which may lead to unintended data being present.
    # By default, this job is disabled. Only enable it if you want to populate the Blaze data store with initial data.
    # ⚠️ Recommended: Keep `dataPopulatorJob.enabled: false` after initial setup to avoid data contamination.
    dataPopulatorJob:
      enabled: false
      env:
        SYNTHEA_N_PATIENTS: 10
        SYNTHEA_SEED: 3256262546
        SYNTHEA_CLINICIAN_SEED: 3726451
        TIMEOUT: 2

  # minio values
  minio:
    rootUser: admin
    rootPassword: admin123

    mode: standalone
    replicas: 1
    resources:
      requests:
        memory: 1Gi

    persistence:
      enabled: true
      size: 5Gi
      annotations:
        helm.sh/resource-policy: keep

## Used by the node components for storing information on the analysis pods and logging events
postgresql:
  nameOverride:
  fullnameOverride:

  resources: {}

  service:
    type: ClusterIP
    port: 5432

  ## Database configuration
  settings:
    ## Optional existing secret for the Postgres superuser
    existingSecret: postgres-credentials-secret

