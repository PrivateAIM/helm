## @param expose.type Routing mode. One of 'ingress' (Kubernetes Ingress API), 'gateway' (Kubernetes Gateway API), or 'none' (no external routing)
expose:
  type: none
  ## @param expose.hostname Hostname for all node components (UI, Hub Adapter, Keycloak). Include scheme if desired (e.g. https://node.example.com)
  hostname: ""
  tls:
    ## @param expose.tls.secretName Name of the TLS secret (applies when expose.type is 'ingress' or 'gateway')
    secretName: ""
  ingress:
    ## @param expose.ingress.className IngressClass name (only applies when expose.type is 'ingress')
    className: ""
    ## @param expose.ingress.annotations Additional annotations for Ingress resources
    annotations: {}
    ## @param expose.ingress.pathType Ingress path type
    pathType: ImplementationSpecific
  gateway:
    ## @param expose.gateway.gatewayClassName GatewayClass name (only applies when expose.type is 'gateway' and external is false)
    gatewayClassName: nginx
    ## @param expose.gateway.external When true, the chart does not create a Gateway resource and instead attaches HTTPRoutes to an existing external Gateway
    external: false
    ## @param expose.gateway.parentRef Reference to the external Gateway for HTTPRoutes (only used when external is true)
    parentRef:
      ## @param expose.gateway.parentRef.name Name of the external Gateway resource (required when external is true)
      name: ""
      ## @param expose.gateway.parentRef.namespace Namespace of the external Gateway (omit for same-namespace)
      namespace: ""
      ## @param expose.gateway.parentRef.sectionName Listener name on the external Gateway to attach to (optional)
      sectionName: ""
    nginxGatewayFabric:
      ## @param expose.gateway.nginxGatewayFabric.enabled Set to true when the node Gateway's GatewayClass is NGINX Gateway Fabric, to attach a ClientSettingsPolicy 
      ## to the node Gateway. NGINX Gateway Fabric defaults to nginx's client_max_body_size of 1m, which is too small for data store uploads. The policy raises it 
      ## for every HTTPRoute attached to the Gateway. No effect on other GatewayClasses.
      enabled: false
      ## @param expose.gateway.nginxGatewayFabric.maxBodySize Value for the ClientSettingsPolicy's body.maxSize
      maxBodySize: 500m

## Secrets for the Keycloak realm clients (hub-adapter, node-ui, service1/pod-orchestrator).
## Under Argo CD, `helm template` cannot look up the previously generated value, so for GitOps/production set explicit values here (ideally via sealed-secrets / external-secrets).
keycloakClientSecrets:
  ## @param keycloakClientSecrets.create Whether the chart generates/manages the "<release>-keycloak-client-secrets" Secret.
  ## Set to false to supply your own Secret with that exact name (e.g. via sealed-secrets / external-secrets) instead of
  ## putting values in this file. It must contain the keys: hubAdapterClientSecret, nodeUiClientSecret, podOrcClientSecret.
  ## When false, the hubAdapter/nodeUi/podOrc values below are ignored.
  create: true
  ## @param keycloakClientSecrets.hubAdapter Secret for the "hub-adapter" Keycloak client. Generated if empty.
  hubAdapter: ""
  ## @param keycloakClientSecrets.nodeUi Secret for the "node-ui" Keycloak client. Generated if empty.
  ## Ignored when ui.idp.clientSecret is set (that value is used for both the UI and Keycloak).
  nodeUi: ""
  ## @param keycloakClientSecrets.podOrc Secret for the "service1"/pod-orchestrator Keycloak client. Generated if empty.
  podOrc: ""

## @param offline Forces the UI and hub adapter to use the internal service endpoint for authentication
## this is useful for when you are using a locally resolveable domain i.e. localhost or similar as defined in /etc/hosts
## Overrides hubAdapter.idp.jwks and enables NUXT_PUBLIC_INTERNAL_KEYCLOAK_URL for the UI
offline: false

## @param timezone Set the timezone for all components in the FLAME Node, use "TZ identifier" from https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: Europe/Berlin

## @param rbac Role Based Access Control settings for authenticated users. Controls feature access in the node UI
rbac:
  ## @param rbac.roleClaimName A period "." separated list of keys leading to the claim in the OIDC token that contains the user's roles
  ## If left blank, RBAC will be disabled and all authenticated users will have full access.
  ## The default value is for the bundled Keycloak instance
  roleClaimName: "global_access.roles"
  ## @param rbac.adminRole Role name for users who have full access and control as defined in the IDP
  adminRole: "admin"
  ## @param rbac.stewardRole Role name for users who can only modify data stores as defined in the IDP
  stewardRole: "steward"
  ## @param rbac.researcherRole Role name for users who can only modify analyses as defined in the IDP
  researcherRole: "researcher"

## @param proxy Proxy URLs pertaining to `HTTP_PROXY`, `HTTPS_PROXY` and `NO_PROXY` environment variables
proxy:
  ## @param proxy.httpProxy Full proxy URL, e.g. http://user:pass@proxy.example.de:3128. Ignored when existingSecret is set.
  httpProxy:
  ## @param proxy.httpsProxy Full proxy URL. Ignored when existingSecret is set.
  httpsProxy:
  ## @param proxy.noProxy List of domains to exclude from proxying.
  noProxy:
  ## @param proxy.existingSecret Name of an existing K8s Secret containing proxy credentials.
  ## When set, all proxy env vars (HTTP_PROXY, HTTPS_PROXY, PROXY_URL) are sourced from this
  ## secret via secretKeyRef instead of from proxy.httpProxy / proxy.httpsProxy above.
  ## The secret must contain:
  ##   httpProxy  - full proxy URL with credentials, e.g. http://user:pass@proxy.example.de:3128
  ##   httpsProxy - full proxy URL with credentials (may equal httpProxy)
  ## Create the secret with:
  ##   kubectl create secret generic my-proxy-secret \
  ##     --from-literal=httpProxy='http://user:pass@proxy.example.de:3128' \
  ##     --from-literal=httpsProxy='http://user:pass@proxy.example.de:3128'
  existingSecret: ""

# Autostart service configuration
autostart:
  ## @param autostart.enabled Enable autostart service for the Hub Adapter
  enabled: false
  ## @param autostart.interval How often (in seconds) the Hub Adapter will probe the Hub for new analyses
  interval: 60

## Add Custom CA certificate(s)
## @param certificateConfigMap Name of an existing ConfigMap that contains additional CA certificates
## The ConfigMap should contain a value called "certs.pem" which is a single PEM file with all the certificates concatenated
## You can create a configmap using the command below (file MUST be named certs.pem):
##       kubectl create configmap CONFIGMAP_NAME --from-file=./certs.pem
## Alternatively, you can provide your own CA bundle in the "./certs/" directory of this helm chart and it will be included in the chart, preferably in one concatenated PEM file
## Certificates must be in proper order, where the top certificate is the leaf and the bottom certificate is the top-most intermediate CA.
certificateConfigMap: ""

## Hub services and data
hub:
  endpoints:
    ## @param hub.endpoints.core Hub core API endpoint
    core: https://core.staging.privateaim.net
    ## @param hub.endpoints.auth Hub auth API endpoint
    auth: https://auth.staging.privateaim.net
    ## @param hub.endpoints.messenger Hub messenger API endpoint. Overrides broker.HUB_BASE_URL if provided
    messenger: https://messenger.staging.privateaim.net
    ## @param hub.endpoints.storage Hub storage API endpoint
    storage: https://storage.staging.privateaim.net
  ## Credentials used for retrieving a valid token from the hub using a robot account
  auth:
    ## @param hub.auth.userRealm Realm in which the users for this node are registered
    userRealm: "master"
    ## @param hub.auth.clientId Client ID for the node hub client
    clientId:
    ## @param hub.auth.clientSecret Client secret for the node hub client
    clientSecret:
    ## @param hub.auth.existingSecret Existing k8s secret containing secret for given hub client ID
    ## The secret must have a key named "clientSecret"
    existingSecret:
  ## Values required by the storage service for encrypting intermediate results sent to the Hub
  crypto:
    ## @param hub.crypto.privateKey Content of the private key to be added to the secret. Need to use the "|" scalar:
    ## https://yaml.org/spec/1.2.2/#812-literal-style
    ##
    privateKey:
    ## @param hub.crypto.existingSecret Existing secret containing the private key for the node
    ## Create this secret following the steps below:
    ## 1) Generate your public and private key pair using the "Crypto" tab in the Hub
    ## 2) Save the private key as 'private_key.pem' (it must use this name)
    ## 3) Run the command below where SECRET_NAME is the name of the secret you want to create:
    ##       kubectl create secret generic SECRET_NAME --from-file=./private_key.pem
    existingSecret:

# kong values
kong:
  image:
    repository: kong
    tag: "3.6"

  env:
    prefix: /kong_prefix/
    database: postgres
    # The default values for admin_listen include both ipv4 and ipv6 - if cluster does not support ipv6, it should be defined (minikube does not support ipv6)
    # admin_listen: "127.0.0.1:8001"
    pg_host: flame-node-kong-postgresql
    pg_database:
      valueFrom:
        secretKeyRef:
          name: postgres-kong-credentials-secret
          key: kongDbName
    pg_user:
      valueFrom:
        secretKeyRef:
          name: postgres-kong-credentials-secret
          key: kongDbUser
    pg_password:
      valueFrom:
        secretKeyRef:
          name: postgres-kong-credentials-secret
          key: kongDbPassword

# Kong chart only waits for db if its own postgres is enabled.
# The FLAME Node uses a separate postgres, so we need a wait-for-postgres init container to ensure the database is ready before starting Kong.
# Otherwise Kong migrations will fail and the pod will crashloop.
  deployment:
    initContainers:
      - name: wait-for-kong-postgresql
        image: busybox:1.38
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -ec
          - |
            until nc -z -w 2 flame-node-kong-postgresql 5432; do
              echo "Waiting for Kong PostgreSQL..."
              sleep 2
            done

  admin:
    enabled: true
    type: ClusterIP
    http:
      enabled: true
      servicePort: 80
    tls:
      enabled: false

  manager:
    enabled: false

  portal:
    enabled: false

  portalapi:
    enabled: false

  proxy:
    enabled: true
    type: ClusterIP
    http:
      enabled: true
      servicePort: 80
    tls:
      enabled: false

  ingressController:
    enabled: false

  # Sub-chart
  postgresql:
    enabled: false

  # Custom plugins loaded via ConfigMap
  plugins:
    configMaps:
      - name: kong-plugin-minio-gateway
        pluginName: minio-gateway

storageService:
  env:
    MINIO_USE_SSL: false
    MINIO_BUCKET: flame
    OIDC_CERTS_URL:
    OIDC_CLIENT_ID_CLAIM_NAME: azp

  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/privateaim/node-storage-service
    # Overrides the image tag whose default is the chart appVersion.
    tag: 0.2.1
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent

  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
  #   cpu: 100m
  #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe: {}
    # httpGet:
    #   path: /healthz
    #   port: api
  # failureThreshold: 3
  # periodSeconds: 10
  readinessProbe: {}
    # httpGet:
    #   path: /healthz
    #   port: api
  # failureThreshold: 5
  # periodSeconds: 5

  # Additional environment variables on the output Deployment definition.
  extraEnv: []
  # - name: FOO
  #   value: bar

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

# keycloakx values
keycloakx:
  auth:
    ## @param keycloakx.auth.adminUsername Bootstrap admin username for Keycloak. Ignored when existingSecret is set.
    adminUsername: ""
    ## @param keycloakx.auth.adminPassword Bootstrap admin password for Keycloak. Ignored when existingSecret is set.
    adminPassword: ""
    ## @param keycloakx.auth.existingSecret Name of an existing Secret containing Keycloak bootstrap credentials.
    ## When set, the chart does not create the credentials Secret and keycloakx.auth.adminUsername/adminPassword are ignored.
    ## The Secret must contain the keys KC_BOOTSTRAP_ADMIN_USERNAME and KC_BOOTSTRAP_ADMIN_PASSWORD.
    existingSecret: ""

  nameOverride: keycloak # Otherwise uses "keycloakx", this keeps it backwards compatible

  http:
    relativePath: /keycloak

  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--import-realm"

  cache:
    stack: "custom" # Current default (kubernetes) is deprecated, setting to 'custom' leaves it unset and will go to 'jdbc-ping'

  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: flame-node-keycloak-postgresql
    port: 5432

  # Additional environment variables for Keycloak
  extraEnv: |
    - name: JAVA_OPTS_APPEND
      value: >-
        -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
        -Dkeycloak.migration.replacePlaceholders=true
    - name: KC_DB_URL_DATABASE
      valueFrom:
        secretKeyRef:
          name: postgres-keycloak-credentials-secret
          key: keycloakDbName
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: postgres-keycloak-credentials-secret
          key: keycloakDbUser
    - name: KC_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-keycloak-credentials-secret
          key: keycloakDbPassword

  extraVolumes: |
    - name: flame-realm-json
      configMap:
        name: flame-default-realm

  extraVolumeMounts: |
    - name: flame-realm-json
      mountPath: "/opt/keycloak/data/import"
      readOnly: true

  extraEnvFrom: |
    - secretRef:
        name: {{ if .Values.auth.existingSecret }}{{ .Values.auth.existingSecret }}{{ else }}flame-keycloak-credentials-secret{{ end }}
    - configMapRef:
        name: {{ .Release.Name }}-keycloak-env
    - secretRef:
        name: {{ .Release.Name }}-keycloak-client-secrets

  ingress:
    enabled: false
    console:
      enabled: false

# hub-api-adapter Values
hubAdapter:
  ## For defining ingress specific metadata
  ingress:
    ## @param ingress.enabled Enable ingress record generation for the Hub Adapter
    ##
    enabled: false
