global:
  node:
    ingress:
      ## @param global.node.ingress.enabled Toggle whether ingress should be enabled
      ## This overrides ingress.enabled
      enabled: false
      ## @param global.node.ingress.enabled Host name to be assigned to the Node UI (/) and Hub Adapter API (/api)
      ## This overrides ingress.hostname and is also supplied to the bundled keycloak helm chart
      hostname:

## @param offline Forces the UI and hub adapter to use the internal service endpoint for authentication
## this is useful for when you are using a locally resolveable domain i.e. localhost or similar as defined in /etc/hosts
## Overrides hubAdapter.idp.jwks and enables NUXT_PUBLIC_INTERNAL_KEYCLOAK_URL for the UI
offline: false

eventLogging:
  ## @param eventLogging.enabled Enable event logging
  enabled: true

## @param timezone Set the timezone for all components in the FLAME Node, use "TZ identifier" from https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: Europe/Berlin

## @param userIdp The following settings are used to configure a separate IDP for the Node UI other than the default keycloak instance
userIdp:
  ## @param userIdp.hostname Hostname for a separate IDP to manage users who can access the FLAME Node UI.
  ## Leave this blank unless you want to use your own IDP
  hostname:
  ## @param userIdp.provider User auth provider. Can be 'keycloak', 'auth0', 'authentik', 'onelogin', 'okta', or 'zitadel'
  provider: keycloak

## @param rbac Role Based Access Control settings for authenticated users. Controls feature access in the node UI
rbac:
  ## @param rbac.roleClaimName A period "." separated list of keys leading to the claim in the OIDC token that contains the user's roles
  ## If left blank, RBAC will be disabled and all authenticated users will have full access.
  ## The default value is for the bundled Keycloak instance
  roleClaimName: "resource_access.node-ui.roles"
  ## @param rbac.adminRole Role name for users who have full access and control as defined in the IDP
  adminRole: "admin"
  ## @param rbac.stewardRole Role name for users who can only modify data stores as defined in the IDP
  stewardRole: "steward"
  ## @param rbac.researcherRole Role name for users who can only modify analyses as defined in the IDP
  researcherRole: "researcher"

## @param proxy Proxy URLs pertaining to `HTTP_PROXY`, `HTTPS_PROXY` and `NO_PROXY` environment variables
proxy:
  httpProxy:
  httpsProxy:
  noProxy:

# Autostart service configuration
autostart:
  ## @param autostart.enabled Enable autostart service for the Hub Adapter
  enabled: false
  ## @param autostart.interval How often (in seconds) the Hub Adapter will probe the Hub for new analyses
  interval: 60

## For defining ingress specific metadata
ingress:
  ## @param ingress.enabled Enable ingress record generation for the Node UI
  ## You should generally use global.node.ingress.enabled instead
  enabled: false
  ## @param ingress.hostname Default host for the ingress record (evaluated as template)
  ## You should generally use global.node.ingress.hostname instead
  hostname: ""
  ## @param ingress.pathType Ingress path type
  pathType: ImplementationSpecific
  ## @param ingress.path Default file path for the ingress hostname
  path: /
  ## @param ingress.annotations Additional annotations for the Ingress resource
  annotations: {}
  ## @param ingress.className IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  className: ""
  # @param ingress.tlsSecretName Specify a tls secret to enable TLS for the given hostname
  tlsSecretName: ""

## Add Custom CA certificate(s)
## @param certificateConfigMap Name of an existing ConfigMap that contains additional CA certificates
## The ConfigMap should contain a value called "certs.pem" which is a single PEM file with all the certificates concatenated
## You can create a configmap using the command below (file MUST be named certs.pem):
##       kubectl create configmap CONFIGMAP_NAME --from-file=./certs.pem
## Alternatively, you can provide your own CA bundle in the "./certs/" directory of this helm chart and it will be included in the chart, preferably in one concatenated PEM file
## Certificates must be in proper order, where the top certificate is the leaf and the bottom certificate is the top-most intermediate CA.
certificateConfigMap: ""

## Hub services and data
hub:
  endpoints:
    ## @param hub.endpoints.core Hub core API endpoint
    core: https://core.privateaim.dev
    ## @param hub.endpoints.auth Hub auth API endpoint
    auth: https://auth.privateaim.dev
    ## @param hub.endpoints.messenger Hub messenger API endpoint. Overrides broker.HUB_BASE_URL if provided
    messenger: https://messenger.privateaim.dev
    ## @param hub.endpoints.storage Hub storage API endpoint
    storage: https://storage.privateaim.dev
  ## Credentials used for retrieving a valid token from the hub using a robot account
  auth:
    robotUser:
    robotSecret:
    ## @param hub.auth.existingSecret Existing k8s secret containing secret for given hub robot user UUID
    ## The secret must have a key named "robotSecret"
    existingSecret: ""
  ## Values required by the storage service for encrypting intermediate results sent to the Hub
  crypto:
    ## @param hub.crypto.privateKey Content of the private key to be added to the secret. Need to use the "|" scalar:
    ## https://yaml.org/spec/1.2.2/#812-literal-style
    ##
    privateKey:
    ## @param hub.crypto.existingSecret Existing secret containing the private key for the node
    ## Create this secret following the steps below:
    ## 1) Generate your public and private key pair using the "Crypto" tab in the Hub
    ## 2) Save the private key as 'private_key.pem' (it must use this name)
    ## 3) Run the command below where SECRET_NAME is the name of the secret you want to create:
    ##       kubectl create secret generic SECRET_NAME --from-file=./private_key.pem
    existingSecret:

# kong values
kong:
  image:
    repository: kong
    tag: "3.6"

  env:
    prefix: /kong_prefix/
    database: postgres
    # The default values for admin_listen include both ipv4 and ipv6 - if cluster does not support ipv6, it should be defined (minikube does not support ipv6)
    # admin_listen: "127.0.0.1:8001"
    pg_host: flame-node-kong-postgresql
    pg_database:
      valueFrom:
        secretKeyRef:
          name: postgres-kong-credentials-secret
          key: kongDbName
    pg_user:
      valueFrom:
        secretKeyRef:
          name: postgres-kong-credentials-secret
          key: kongDbUser
    pg_password:
      valueFrom:
        secretKeyRef:
          name: postgres-kong-credentials-secret
          key: kongDbPassword

  admin:
    enabled: true
    type: ClusterIP
    http:
      enabled: true
      servicePort: 80
    tls:
      enabled: false

  manager:
    enabled: false

  portal:
    enabled: false

  portalapi:
    enabled: false

  proxy:
    enabled: true
    type: ClusterIP
    http:
      enabled: true
      servicePort: 80
    tls:
      enabled: false

  ingressController:
    enabled: false

  # Sub-chart
  postgresql:
    enabled: false

  # Custom plugins loaded via ConfigMap
  plugins:
    configMaps:
      - name: kong-plugin-minio-gateway
        pluginName: minio-gateway

storageService:
  env:
    MINIO_USE_SSL: false
    MINIO_BUCKET: flame
    OIDC_CERTS_URL:
    OIDC_CLIENT_ID_CLAIM_NAME: azp

  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/privateaim/node-storage-service
    # Overrides the image tag whose default is the chart appVersion.
    tag: 0.1.4
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent

  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
  #   cpu: 100m
  #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe: {}
    # httpGet:
    #   path: /healthz
    #   port: http-storage-srv
  # failureThreshold: 3
  # periodSeconds: 10
  readinessProbe: {}
    # httpGet:
    #   path: /healthz
    #   port: http-storage-srv
  # failureThreshold: 5
  # periodSeconds: 5

  # Additional environment variables on the output Deployment definition.
  extraEnv: []
  # - name: FOO
  #   value: bar

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

# keycloakx values
keycloakx:
  nameOverride: keycloak # Otherwise uses "keycloakx", this keeps it backwards compatible

  http:
    relativePath: /keycloak

  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start-dev"
    - "--import-realm"

  cache:
    stack: "custom" # Current default (kubernetes) is deprecated, setting to 'custom' leaves it unset and will go to 'jdbc-ping'

  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: flame-node-keycloak-postgresql
    port: 5432

  # Additional environment variables for Keycloak
  extraEnv: |
    {{- if or .Values.global.node.ingress.hostname .Values.ingress.hostname }}
    - name: KC_HOSTNAME
      value: '{{ printf "%s%s" (tpl (coalesce .Values.global.node.ingress.hostname .Values.ingress.hostname) $ | trimSuffix "/") .Values.http.relativePath }}'
    {{- end }}
    - name: JAVA_OPTS_APPEND
      value: >-
        -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
    - name: KC_DB_URL_DATABASE
      valueFrom:
        secretKeyRef:
          name: postgres-keycloak-credentials-secret
          key: keycloakDbName
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: postgres-keycloak-credentials-secret
          key: keycloakDbUser
    - name: KC_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-keycloak-credentials-secret
          key: keycloakDbPassword

  extraVolumes: |
    - name: flame-realm-json
      configMap:
        name: flame-default-realm

  extraVolumeMounts: |
    - name: flame-realm-json
      mountPath: "/opt/keycloak/data/import"
      readOnly: true

  extraEnvFrom: |
    - secretRef:
        name: flame-keycloak-credentials-secret

  ingress:
    enabled: true
    rules:
      - # Ingress host
        host: '{{ regexReplaceAll "^https?://(.*)" (tpl (coalesce .Values.global.node.ingress.hostname .Values.ingress.hostname "localhost") $) "${1}" | trimSuffix "/" }}'
        paths:
          - path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/'
            pathType: ImplementationSpecific

    # TLS configuration
    tls: [] # Must be set to empty if no TLS present otherwise will initialize with default example host

    console:
      # If `true`, an Ingress is created for console path only
      enabled: true
      rules:
        - # Ingress host
          host: '{{ regexReplaceAll "^https?://(.*)" (tpl (coalesce .Values.global.node.ingress.hostname .Values.ingress.hostname "localhost") $) "${1}" | trimSuffix "/" }}'
          paths:
            - path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/admin'
              pathType: ImplementationSpecific

      # Console TLS configuration KlpndHhf8K0Aj2R7JmNlSE2a7XJcSKPV
      tls: []

# hub-api-adapter Values
hubAdapter:
  ## For defining ingress specific metadata
  ingress:
    ## @param ingress.enabled Enable ingress record generation for the Hub Adapter
    ##
    enabled: false
    ## @param ingress.pathType Ingress path type
    ##
    pathType: Prefix
    ## @param ingress.hostname Default host for the ingress record (evaluated as template)
    ##
    hostname:

  ## Keycloak related information
  idp:
    ## @param idp.debug If true, the clientId and clientSecret will use pre-defined values
    ## The clientSecret will be defined using the "static" k8s secret key
    debug: false
    ## @param idp.clientId Keycloak client ID for this service
    clientId: hub-adapter
    ## @param idp.clientSecret Keycloak client secret. Ignored if `idp.existingSecret` is provided
    ## If not defined and no existingSecret provided, a random string is generated
    clientSecret: ""
    ## @param idp.existingSecret Existing k8s secret containing Keycloak secret for this client
    ## idp.existingSecretKey should also be defined for custom k8s secret. Defaults to hub-adapter-kc-secret
    existingSecret: ""
    ## @param idp.existingSecretKey Key where the Keycloak secret is being stored inside the existing k8s secret
    existingSecretKey: ""
    ## @param idp.jwks JWKS URI to override the endpoints fetched from the IDP issuer
    ## Meant for local testing where either no FQDN provided or using localhost and port-forwarding
    jwks: ""

  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/privateaim/node-hub-api-adapter
    # Overrides the image tag whose default is the chart appVersion.
    tag: 0.4.1
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent

  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext:
    runAsNonRoot: true
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to set up the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe: &probe
    httpGet:
      path: /healthz
      port: healthcp
    failureThreshold: 3
    periodSeconds: 60
    initialDelaySeconds: 60
  readinessProbe: *probe

  # Additional environment variables on the output Deployment definition.
  env: []
  # - name: FOO
  #   value: bar

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

