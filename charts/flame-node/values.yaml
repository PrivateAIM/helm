## seaweedfs is the S3 object store used by the storage service.
## All possible values can be found at https://github.com/seaweedfs/seaweedfs/blob/master/k8s/charts/seaweedfs/values.yaml
## It runs in all-in-one mode (master, volume, filer and S3 gateway in a single pod) and autogenerates its S3 admin credentials
seaweedfs:
  ## Run everything in a single pod and disable the standalone components.
  master: { enabled: false }
  volume:
    enabled: false
    dataDirs:
      - name: data1
        type: "custom"
        maxVolumes: 7000
  filer: { enabled: false }

  s3:
    ## Use the all-in-one S3 gateway rather than a standalone S3 deployment.
    enabled: false
    ## Required so the chart generates the "<release>-seaweedfs-s3-secret" credential Secret.
    enableAuth: true

  allInOne:
    enabled: true
    ## Disable the chart's default hard pod anti-affinity (requiredDuringScheduling, keyed on
    ## hostname). It blocks scheduling on single-node clusters and prevents this instance from
    ## co-locating with the data-store SeaweedFS pod. Set to a podAntiAffinity block if you run a
    ## multi-node cluster and want the pods spread across nodes.
    affinity: ""
    s3:
      enabled: true
      enableAuth: true
      ## Default bucket the storage service reads from / writes to.
      createBuckets:
        - name: flame
    data:
      type: persistentVolumeClaim
      size: 10Gi
    podSecurityContext:
      enabled: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

mongodb:
  ## Pull secrets and name override options
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  ## Optional service account
  serviceAccount:
    # Specifies whether a service account should be created
    create: false

  ## Resource limits and requests
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi

  ## Use Kubernetes Deployment instead of StatefulSet when in Non-HA mode
  useDeploymentWhenNonHA: false

  settings:
    ## The root username
    rootUsername:
    ## The root user password
    rootPassword:

  ## Optional user database which is created during first startup with user and password
  userDatabase:
    ## Name of the user database
    name: messagebroker

  storage:
    ## Internal volume name and prefix of a created PVC
    volumeName: "mongodb-volume"

    ## Alternative set requestedSize to define a size for a dynamically created PVC
    requestedSize: 500Mi

    className:

victorialogs:
  ## @param victorialogs.enabled Enable Victoria Logs for log collection and analysis in the Flame Node. 
  ## This will deploy a Victoria Logs instance and a Vector agent configured to send logs to it.
  ## If disabled, the event viewer in the UI will also no longer function, as it relies on Victoria Logs for log storage and querying.
  enabled: true
  ## @param victorialogs.ingress.enabled Enable ingress for Victoria Logs. Only relevant if victorialogs.enabled is true.
  ## WARNING: Enabling this will expose Victoria Logs to the network, which may have security implications as auth is not required to access the UI. 
  ## Make sure to secure it properly if you enable this.
  ingress:
    enabled: false
  server:
    ## Data retention period. Possible units character: h(ours), d(ays), w(eeks), y(ears), if no unit character specified - month. 
    ## The minimum retention period is 24h. See these [docs](https://docs.victoriametrics.com/victorialogs/#retention)
    retentionPeriod: 1y
    persistentVolume:
      enabled: true
      size: 20Gi
      storageClassName: ""

  vector:
    enabled: true
    ## @param victoria-logs.vector.logLevelFilter Minimum log level to ingest. Logs below this level are dropped by Vector.
    ## Valid values: DEBUG, INFO, WARNING, ERROR, CRITICAL (case-insensitive). Empty string disables filtering. 
    logLevelFilter: "INFO"
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: false
        address: 0.0.0.0:8686
        playground: true
      sources:
        k8s:
          type: kubernetes_logs
          # Only parse logs from the current namespace to avoid unnecessary overhead and potential security issues
          extra_field_selector: "metadata.namespace={{ .Release.Namespace }}"
        internal_metrics:
          type: internal_metrics
      transforms:
        pod_filter:
          type: filter
          inputs: [k8s]
          condition: .kubernetes.pod_labels."app.kubernetes.io/name" != "mongodb"
        parser:
          type: remap
          inputs: [pod_filter]
          # "log.level" for Spring (message broker) and "parsed.level" for Python components
          source: |
            parsed, err = parse_json(.message)
            if err == null {
              .log = parsed
              .level = upcase(string(parsed."log.level") ?? string(parsed.level) ?? "UNKNOWN")
            } else {
              .log = .message
              .level = "UNKNOWN"
            }
            if .level == "WARN" { .level = "WARNING" }
            del(.message)
        level_filter:
          type: filter
          inputs: [parser]
          # Vector is **very** particular about the syntax of the condition, hence the somewhat convoluted way of implementing log level filtering
          condition: '
            event_level = upcase(string(.level) ?? "UNKNOWN");
            min_level = upcase("{{ .Values.logLevelFilter | default "" }}");
            level_num = if event_level == "DEBUG" { 0 } else if event_level == "INFO" { 1 } else if event_level == "WARNING" { 2 } else if event_level == "ERROR" { 3 } else if event_level == "CRITICAL" { 4 } else { -1 };
            min_num = if min_level == "DEBUG" { 0 } else if min_level == "INFO" { 1 } else if min_level == "WARNING" { 2 } else if min_level == "ERROR" { 3 } else if min_level == "CRITICAL" { 4 } else { 0 };
            min_level == "" || level_num >= min_num
            '
      sinks:
        exporter:
          type: prometheus_exporter
          address: 0.0.0.0:9090
          inputs: [internal_metrics]
        vlogs:
          type: elasticsearch
          inputs: [level_filter]
          mode: bulk
          api_version: v8
          compression: gzip
          healthcheck:
            enabled: false
          request:
            headers:
              VL-Time-Field: timestamp,@timestamp
              VL-Stream-Fields: level,kubernetes.pod_name,kubernetes.pod_labels.component,kubernetes.container_name
              VL-Msg-Field: message,msg,_msg,log.msg,log.message,log
              AccountID: "0"
              ProjectID: "0"
