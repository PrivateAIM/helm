# Routing — choose 'ingress', 'gateway', or 'none'
expose:
  type: ingress
  hostname: "https://my.domain.de"
  ingress:
    className: "nginx"

## Hub services and data
hub:
  ## Credentials used for retrieving a valid token from the hub using a robot account
  auth:
    userRealm: master  # change this to the realm in which the users for this node are registered
    clientId:
    clientSecret:
  ## Values required by the storage service for encrypting intermediate results sent to the Hub
  crypto:
    ## @param hub.crypto.privateKey Content of the private key to be added to the secret. Need to use the "|" scalar:
    ## https://yaml.org/spec/1.2.2/#812-literal-style
    ##
    privateKey:
    ## @param hub.crypto.existingSecret Existing secret containing the private key for the node
    ## Create this secret following the steps below:
    ## 1) Generate your public and private key pair using the "Crypto" tab in the Hub
    ## 2) Save the private key as 'private_key.pem' (it must use this name)
    ## 3) Run the command below where SECRET_NAME is the name of the secret you want to create:
    ##       kubectl create secret generic SECRET_NAME --from-file=./private_key.pem
    existingSecret:

# Settings for the bundled keycloak instance. If you are using an external IDP, you can disable the keycloak deployment and set up the appropriate values in the "userIdp" and "ui" sections of the values file.
keycloakx:
  ## @param keycloakx.defaultUserEnabled Enable the creation of the default "flameuser" in keycloak
  defaultUserEnabled: false
  auth:
    adminUsername: ""
    adminPassword: ""
    # existingSecret: ""

# proxy:
#   httpProxy:
#   httpsProxy:
#   noProxy:
#   existingSecret:

## If enabled, this will deploy a FHIR and SeaweedFS (S3) server that can be used for testing
dataStore:
  enabled: false
  seaweedfs:
    admin:
      secret:
        adminUser: "admin"
        adminPassword: ""
        # existingSecret: ""