apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "blaze.fullname" . }}-test-connection"
  labels:
    {{- include "blaze.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command: ['wget']
      args: ['{{ include "blaze.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
