{{- /*
Generate the SeaweedFS Admin UI login Secret from plaintext credentials.

- Plaintext path : seaweedfs.admin.auth.username/password are baked into the Secret on install.
- Auto-gen path  : password left blank -> random, preserved across upgrades via lookup.
- Existing-secret: set seaweedfs.admin.secret.existingSecret to your own Secret name (!= the
                   default below) and this template is skipped, so the subchart uses your Secret.

The subchart reads this Secret via admin.secret.existingSecret + userKey/pwKey (set in values.yaml).
Only rendered when the Admin UI is enabled.
*/ -}}
{{- $name := "node-datastore-seaweedfs-admin-secret" -}}
{{- if and .Values.seaweedfs.admin.enabled (eq .Values.seaweedfs.admin.secret.existingSecret $name) -}}
{{- $data := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $user := .Values.seaweedfs.admin.auth.username | default ((index $data "admin_username" | default "") | b64dec) | default "admin" -}}
{{- $pass := .Values.seaweedfs.admin.auth.password | default ((index $data "admin_password" | default "") | b64dec) | default (randAlphaNum 24) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    ## Keep the generated password stable across upgrades.
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: node-datastore-seaweedfs
    app.kubernetes.io/component: admin
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  admin_username: {{ $user | b64enc }}
  admin_password: {{ $pass | b64enc }}
{{- end -}}
