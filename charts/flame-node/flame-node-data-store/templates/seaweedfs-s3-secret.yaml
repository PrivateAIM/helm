{{- /*
Generate the SeaweedFS S3 config Secret for the data store from plaintext credentials.

- Plaintext path : seaweedfs.auth.username/password are baked into the Secret on install.
- Auto-gen path  : left blank -> random credentials, preserved across upgrades via lookup.
- Existing-secret: set seaweedfs.s3.existingConfigSecret to your own Secret name (!= the default
                   below) and this template is skipped, so SeaweedFS mounts your Secret instead.

The Secret is consumed by the all-in-one deployment via allInOne.s3.existingConfigSecret, which
defaults to this same name in values.yaml.
*/ -}}
{{- $name := "node-datastore-seaweedfs-s3-secret" -}}
{{- if eq .Values.seaweedfs.s3.existingConfigSecret $name -}}
{{- $data := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $user := .Values.seaweedfs.auth.username | default ((index $data "admin_access_key_id" | default "") | b64dec) | default (randAlphaNum 20) -}}
{{- $pass := .Values.seaweedfs.auth.password | default ((index $data "admin_secret_access_key" | default "") | b64dec) | default (randAlphaNum 40) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    ## Keep the generated credentials in sync with the retained data PVC on reinstall.
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: node-datastore-seaweedfs
    app.kubernetes.io/component: s3
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  admin_access_key_id: {{ $user | b64enc }}
  admin_secret_access_key: {{ $pass | b64enc }}
  seaweedfs_s3_config: {{ printf `{"identities":[{"name":"%s","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write"]}]}` $user $user $pass | b64enc }}
{{- end -}}
