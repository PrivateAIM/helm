apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-node-message-broker-db
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-node-message-broker
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flame
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  serviceName: {{ .Release.Name }}-node-message-broker-db
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-node-message-broker
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: flame
      app.kubernetes.io/version: {{ .Chart.AppVersion }}
  replicas: {{ .Values.messageBroker.db.replicaCount }}
  template:
    metadata:
      {{- with .Values.messageBroker.db.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-node-message-broker
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: flame
        app.kubernetes.io/version: {{ .Chart.AppVersion }}
        {{- with .Values.messageBroker.db.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.messageBroker.db.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.messageBroker.db.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Release.Name }}-node-message-broker-db
          securityContext:
            {{- toYaml .Values.messageBroker.db.securityContext | nindent 12 }}
          image: "{{ .Values.messageBroker.db.image.repository }}:{{ .Values.messageBroker.db.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.messageBroker.db.image.pullPolicy }}
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: "message-broker"
            - name: TZ
              value: {{ .Values.messageBroker.common.timezone | default "Europe/Berlin" | quote }}
            {{- with .Values.messageBroker.db.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.messageBroker.db.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.messageBroker.db.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.messageBroker.db.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /data/db
            {{- with .Values.messageBroker.db.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- toYaml .Values.messageBroker.db.volumes | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.messageBroker.db.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.messageBroker.db.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.messageBroker.db.tolerations | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          {{- toYaml .Values.messageBroker.db.persistence.accessModes | nindent 10 }}
        {{- with .Values.messageBroker.db.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.messageBroker.db.persistence.size }}
