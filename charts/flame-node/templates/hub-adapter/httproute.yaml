{{- if or .Values.gateway.enabled .Values.global.node.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-hub-adapter-route
spec:
  parentRefs:
  - name: {{ .Release.Name }}-node-gateway
  rules:
  - backendRefs:
    - name: {{ .Release.Name }}-hub-adapter-service
      port: 5000
  - matches:
    - path:
        type: PathPrefix
        value: /api
{{- end }}