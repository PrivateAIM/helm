{{- if eq .Values.expose.type "gateway" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-hub-adapter-route
  labels:
    component: flame-hub-adapter
    app.kubernetes.io/name: flame-hub-adapter
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
  - name: {{ .Release.Name }}-node-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: {{ .Release.Name }}-hub-adapter-service
      port: 5000
{{- end }}