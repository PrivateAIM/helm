{{- $hasCerts := include "tls.hasCerts" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hub-adapter-deployment
  labels:
    component: flame-hub-adapter
    app.kubernetes.io/name: flame-hub-adapter
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      component: flame-hub-adapter
      app.kubernetes.io/name: flame-hub-adapter
      app.kubernetes.io/component: gateway
      app.kubernetes.io/part-of: flame-node
      app.kubernetes.io/instance: {{ .Release.Name }}
  replicas: {{ .Values.hubAdapter.replicaCount }}
  template:
    metadata:
      annotations:
        {{- with .Values.hubAdapter.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        component: flame-hub-adapter
        app.kubernetes.io/name: flame-hub-adapter
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: flame-node
        app.kubernetes.io/version: {{ .Chart.AppVersion }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.hubAdapter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.hubAdapter.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.hubAdapter.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-keycloak
          image: curlimages/curl:8.20.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until curl -sf {{ include "keycloak.svc.route" . }}:9000{{ (include "keycloak.relativePath.normalized" .) }}/health/ready; do
                echo "Waiting for Keycloak..."
                sleep 5
              done
      containers:
        - name: hub-adapter
          securityContext:
            {{- toYaml .Values.hubAdapter.securityContext | nindent 12 }}
          image: "{{ .Values.hubAdapter.image.repository }}:{{ .Values.hubAdapter.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.hubAdapter.image.pullPolicy }}
          ports:
            - containerPort: 5000
              name: healthcp
          env:
            - name: TZ
              value: {{ .Values.timezone | default "Europe/Berlin" }}
            - name: API_ROOT_PATH
              value: {{ ( include "adapter.root.path" . ) | default "" }}
            - name: API_CLIENT_ID
              value: hub-adapter
            - name: API_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-keycloak-client-secrets
                  key: hubAdapterClientSecret
            - name: IDP_URL
              value: {{ include "adapter.userIdp.endpoint" . }}
            {{- if .Values.victorialogs.enabled }}
            - name: VICTORIA_LOGS_URL
              value: {{ printf "http://%s-victorialogs-server.%s.svc.cluster.local:9428" .Release.Name .Release.Namespace }}
            {{- end }}
            - name: NODE_SVC_OIDC_URL
              value: {{ include "keycloak.service.endpoint" . }}
            - name: OVERRIDE_JWKS
              value: {{ include "adapter.jwks.endpoint" . }}
            - name: HTTP_PROXY
              {{- if .Values.proxy.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.existingSecret }}
                  key: httpProxy
              {{- else }}
              value: {{ .Values.proxy.httpProxy | default "" | quote }}
              {{- end }}
            - name: HTTPS_PROXY
              {{- if .Values.proxy.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.existingSecret }}
                  key: httpsProxy
              {{- else }}
              value: {{ .Values.proxy.httpsProxy | default "" | quote }}
              {{- end }}
            - name: NO_PROXY
              value: {{ .Values.proxy.noProxy | default "" | quote }}
            - name: STORAGE_SERVICE_URL
              value: {{ printf "http://%s-storage-service.%s.svc.cluster.local:8080" .Release.Name .Release.Namespace }}
            - name: PODORC_SERVICE_URL
              value: {{ printf "http://%s-po-service.%s.svc.cluster.local:8000" .Release.Name .Release.Namespace }}
            - name: KONG_ADMIN_SERVICE_URL
              value: {{ printf "http://%s-kong-admin.%s.svc.cluster.local:80" .Release.Name .Release.Namespace }}
            - name: KONG_PROXY_SERVICE_URL
              value: {{ printf "http://%s-kong-proxy.%s.svc.cluster.local:80" .Release.Name .Release.Namespace }}
            - name: HUB_SERVICE_URL
              value: {{ .Values.hub.endpoints.core | default "https://core.privateaim.dev" | quote }}
            - name: HUB_AUTH_SERVICE_URL
              value: {{ .Values.hub.endpoints.auth | default "https://auth.privateaim.dev" | quote }}
            - name: AUTOSTART__ENABLED
              value: {{ .Values.autostart.enabled | default "false" | quote }}
            - name: AUTOSTART__INTERVAL
              value: {{ .Values.autostart.interval | default "60" | quote }}
            - name: ROLE_CLAIM_NAME
              value: {{ .Values.rbac.roleClaimName | default "" | quote }}
            - name: ADMIN_ROLE
              value: {{ .Values.rbac.adminRole | default "" | quote }}
            - name: STEWARD_ROLE
              value: {{ .Values.rbac.stewardRole | default "" | quote }}
            - name: RESEARCHER_ROLE
              value: {{ .Values.rbac.researcherRole | default "" | quote }}
            - name: POSTGRES_EVENT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.user.secretName" . }}
                  key: DB_USER
            - name: POSTGRES_EVENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.user.secretName" . }}
                  key: DB_PASSWORD
            - name: POSTGRES_EVENT_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.user.secretName" . }}
                  key: DB_DATABASE
            - name: POSTGRES_EVENT_HOST
              value: {{ include "postgresql.endpoint" . }}
            - name: POSTGRES_EVENT_PORT
              value: {{ .Values.postgresql.service.port | default "5432" | quote }}
            {{- if $hasCerts }}
            - name: EXTRA_CA_CERTS
              value: "/mnt/certs/certs.pem"
            {{- end }}
            - name: HUB_NODE_CLIENT_ID
              value: {{ required "A client ID for the Hub is required." .Values.hub.auth.clientId | quote }}
            - name: HUB_NODE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.secretName" . }}
                  key: clientSecret
            {{- with .Values.hubAdapter.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.hubAdapter.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.hubAdapter.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.hubAdapter.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.hubAdapter.resources | nindent 12 }}
          volumeMounts:
            {{- if $hasCerts }}
            - mountPath: "/mnt/certs/certs.pem"
              name: additional-certs
              subPath: "certs.pem"
              readOnly: true
            {{- end }}
            {{- with .Values.hubAdapter.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if $hasCerts }}
        - name: additional-certs
          configMap:
            name: {{ include "tls.configMapName" . }}
        {{- end }}
        {{- with .Values.hubAdapter.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hubAdapter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hubAdapter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hubAdapter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
