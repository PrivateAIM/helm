apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keycloak-client-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  hubAdapterClientSecret: {{ include "adapter.keycloak.clientSecret" . }}
  nodeUiClientSecret: {{ include "ui.keycloak.clientSecret" . }}
  podOrcClientSecret: {{ include "po.keycloak.clientSecret" . }}

---

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  superPassword: YWRtaW4=  # base64
  DB_USER: ZmxhbWVfdXNlcg==  # base64
  DB_PASSWORD: ZmxhbWVfcGFzc3dvcmQ=  # base64
  DB_DATABASE: cG9zdGdyZXNfZGI=  # base64

---

apiVersion: v1
kind: Secret
metadata:
  name: postgres-kong-credentials-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  superPassword: YWRtaW4=  # base64
  kongDbUser: ZmxhbWVfa29uZ191c2Vy  # base64
  kongDbPassword: ZmxhbWVfa29uZ19wd2Q=  # base64
  kongDbName: a29uZw==

---

apiVersion: v1
kind: Secret
metadata:
  name: postgres-keycloak-credentials-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  superPassword: a2V5Y2xvYWtmbGFtZW5vZGVwYXNzd29yZA==  # base64
  keycloakDbUser: a2V5Y2xvYWtwZ3VzZXI=  # base64
  keycloakDbPassword: ZXh0cmFzZWNyZXRrZXljb2FrcGFzc3dvcmQ=  # base64
  keycloakDbName: a2V5Y2xvYWs=

---

apiVersion: v1
kind: Secret
metadata:
  name: flame-keycloak-credentials-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  KC_BOOTSTRAP_ADMIN_USERNAME: YWRtaW4=  # base64
  KC_BOOTSTRAP_ADMIN_PASSWORD: YWRtaW4=

---

{{- if not .Values.hub.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-hub-robot-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  clientSecret: {{ required "A client secret for the Hub is required." ( .Values.hub.auth.clientSecret | default "" | b64enc ) }}
{{- end }}

---

{{- if (not .Values.hub.crypto.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ecdh-private-key-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: key
type: Opaque
data:
  private_key.pem: {{ required
  "If no existing secret is provided with a private key, then the contents must be provided in .Values.hub.crypto.privateKey"
  (.Values.hub.crypto.privateKey | default "" | b64enc) }}
{{- end }}

---

{{- if (include "broker.proxy.hasAuth" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-proxy-credentials-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: key
type: Opaque
data:
  proxyPassword: {{ include "broker.proxy.password" . | default "" | b64enc }}
{{- end }}
