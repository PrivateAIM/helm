{{- if .Values.keycloakClientSecrets.create -}}
{{- $ccSecretName := printf "%s-keycloak-client-secrets" .Release.Name -}}
{{- $ccExisting := lookup "v1" "Secret" .Release.Namespace $ccSecretName -}}
{{- $ccData := ($ccExisting).data | default dict -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ccSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/resource-policy: keep
type: Opaque
data:
  hubAdapterClientSecret: {{ .Values.keycloakClientSecrets.hubAdapter | b64enc | default (index $ccData "hubAdapterClientSecret" | default (randAlphaNum 32 | b64enc)) }}
  nodeUiClientSecret: {{ .Values.ui.idp.clientSecret | default .Values.keycloakClientSecrets.nodeUi | b64enc | default (index $ccData "nodeUiClientSecret" | default (randAlphaNum 32 | b64enc)) }}
  podOrcClientSecret: {{ .Values.keycloakClientSecrets.podOrc | b64enc | default (index $ccData "podOrcClientSecret" | default (randAlphaNum 32 | b64enc)) }}
{{- end }}

{{- $pgDefaultSecretName := "postgres-credentials-secret" -}}
{{- if eq .Values.postgresql.settings.existingSecret $pgDefaultSecretName -}}
{{- $pgExisting := lookup "v1" "Secret" .Release.Namespace $pgDefaultSecretName -}}
{{- $pgData := ($pgExisting).data | default dict -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgDefaultSecretName }}
  namespace: {{ .Release.Namespace }}
  {{- if ne .Values.postgresql.settings.keepCredentialSecret false }}
  annotations:
    ## Keep the credential secret if the release is uninstalled so the generated
    ## password stays in sync with the retained PostgreSQL data PVC on reinstall.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  superPassword: {{ .Values.postgresql.auth.superPassword | b64enc | default (index $pgData "superPassword" | default (randAlphaNum 20 | b64enc)) }}
  DB_USER: {{ .Values.postgresql.auth.user | b64enc | default (index $pgData "DB_USER" | default ("flame_user" | b64enc)) }}
  DB_PASSWORD: {{ .Values.postgresql.auth.password | b64enc | default (index $pgData "DB_PASSWORD" | default (randAlphaNum 20 | b64enc)) }}
  DB_DATABASE: {{ .Values.postgresql.auth.database | b64enc | default (index $pgData "DB_DATABASE" | default ("postgres_db" | b64enc)) }}
{{- end }}

{{- $kongPg := index .Values "kong-postgresql" -}}
{{- $kongDefaultSecretName := "postgres-kong-credentials-secret" -}}
{{- if eq $kongPg.settings.existingSecret $kongDefaultSecretName -}}
{{- $kongExisting := lookup "v1" "Secret" .Release.Namespace $kongDefaultSecretName -}}
{{- $kongData := ($kongExisting).data | default dict -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $kongDefaultSecretName }}
  namespace: {{ .Release.Namespace }}
  {{- if ne $kongPg.settings.keepCredentialSecret false }}
  annotations:
    ## Keep the credential secret if the release is uninstalled so the generated
    ## password stays in sync with the retained PostgreSQL data PVC on reinstall.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  superPassword: {{ $kongPg.auth.superPassword | b64enc | default (index $kongData "superPassword" | default (randAlphaNum 20 | b64enc)) }}
  kongDbUser: {{ $kongPg.auth.user | b64enc | default (index $kongData "kongDbUser" | default ("flame_kong_user" | b64enc)) }}
  kongDbPassword: {{ $kongPg.auth.password | b64enc | default (index $kongData "kongDbPassword" | default (randAlphaNum 20 | b64enc)) }}
  kongDbName: {{ $kongPg.auth.database | b64enc | default (index $kongData "kongDbName" | default ("kong" | b64enc)) }}
{{- end }}

{{- $kcPg := index .Values "keycloak-postgresql" -}}
{{- $kcDefaultSecretName := "postgres-keycloak-credentials-secret" -}}
{{- if eq $kcPg.settings.existingSecret $kcDefaultSecretName -}}
{{- $kcExisting := lookup "v1" "Secret" .Release.Namespace $kcDefaultSecretName -}}
{{- $kcData := ($kcExisting).data | default dict -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $kcDefaultSecretName }}
  namespace: {{ .Release.Namespace }}
  {{- if ne $kcPg.settings.keepCredentialSecret false }}
  annotations:
    ## Keep the credential secret if the release is uninstalled so the generated
    ## password stays in sync with the retained PostgreSQL data PVC on reinstall.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  superPassword: {{ $kcPg.auth.superPassword | b64enc | default (index $kcData "superPassword" | default (randAlphaNum 20 | b64enc)) }}
  keycloakDbUser: {{ $kcPg.auth.user | b64enc | default (index $kcData "keycloakDbUser" | default ("keycloakpguser" | b64enc)) }}
  keycloakDbPassword: {{ $kcPg.auth.password | b64enc | default (index $kcData "keycloakDbPassword" | default (randAlphaNum 20 | b64enc)) }}
  keycloakDbName: {{ $kcPg.auth.database | b64enc | default (index $kcData "keycloakDbName" | default ("keycloak" | b64enc)) }}
{{- end }}

{{- if not .Values.keycloakx.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: flame-keycloak-credentials-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloakx.auth.adminUsername | b64enc }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "keycloakx.auth.adminPassword is required when keycloakx.auth.existingSecret is not set" .Values.keycloakx.auth.adminPassword | b64enc }}
{{- end }}

{{- $uiSecretName := printf "%s-node-ui-secret" .Release.Name -}}
{{- if not .Values.ui.nuxtAuthExistingSecret -}}
{{- $uiExisting := lookup "v1" "Secret" .Release.Namespace $uiSecretName -}}
{{- $uiData := ($uiExisting).data | default dict -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $uiSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  nuxtAuthSecret: {{ .Values.ui.nuxtAuthSecret | b64enc | default (index $uiData "nuxtAuthSecret" | default (randAlphaNum 32 | b64enc)) }}
{{- end }}

{{- if not .Values.hub.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-hub-robot-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  clientSecret: {{ required "A client secret for the Hub is required." ( .Values.hub.auth.clientSecret | default "" | b64enc ) }}
{{- end }}

{{- if (not .Values.hub.crypto.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ecdh-private-key-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: key
type: Opaque
data:
  private_key.pem: {{ required
  "If no existing secret is provided with a private key, then the contents must be provided in .Values.hub.crypto.privateKey"
  (.Values.hub.crypto.privateKey | default "" | b64enc) }}
{{- end }}

