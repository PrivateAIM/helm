{{- if eq .Values.expose.type "gateway" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-node-ui-route
  labels:
    component: flame-ui
    app.kubernetes.io/name: flame-ui
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
  {{- include "flame-node.gateway.parentRefs" . | nindent 2 }}
  hostnames:
  - {{ include "flame-node.gateway.routeHostname" . | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Release.Name }}-node-ui-service
      port: 3000
{{- end }}