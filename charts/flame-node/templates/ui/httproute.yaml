{{- if or .Values.gateway.enabled .Values.global.node.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-node-ui-route
spec:
  parentRefs:
  - name: {{ .Release.Name }}-node-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Release.Name }}-node-ui-service
      port: 3000
{{- end }}