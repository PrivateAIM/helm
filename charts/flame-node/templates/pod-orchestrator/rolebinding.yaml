kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-po-sa-binding
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-po-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-po-role
  apiGroup: rbac.authorization.k8s.io
