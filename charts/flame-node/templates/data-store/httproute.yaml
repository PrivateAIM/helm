{{- if and (eq .Values.expose.type "gateway") .Values.dataStore.enabled .Values.dataStore.seaweedfs.admin.enabled .Values.dataStore.seaweedfs.admin.gateway.enabled -}}
{{- $sharedHost := include "flame-node.gateway.routeHostname" . -}}
{{- $adminHost := include "flame-node.dataStore.seaweedfs.admin.routeHostname" . -}}
{{- $dedicated := false -}}
{{- if and $adminHost (ne $adminHost $sharedHost) -}}{{- $dedicated = true -}}{{- end -}}
{{- $prefix := .Values.dataStore.seaweedfs.admin.urlPrefix | trimSuffix "/" -}}
{{- if and (not $dedicated) (not $prefix) -}}
{{- fail "dataStore.seaweedfs.admin.urlPrefix must be set (e.g. /seaweedfs) when exposing the admin panel on the shared node hostname: the seaweedfs admin serves its UI and post-login redirects from this prefix, and the HTTPRoute matches the same path. Otherwise set dataStore.seaweedfs.admin.gateway.hostname to a dedicated hostname (served at root)." -}}
{{- end -}}
{{- if and $prefix (not (hasPrefix "/" $prefix)) -}}
{{- fail (printf "dataStore.seaweedfs.admin.urlPrefix must start with a leading slash (got %q), e.g. /seaweedfs: the HTTPRoute PathPrefix match requires an absolute path." .Values.dataStore.seaweedfs.admin.urlPrefix) -}}
{{- end -}}
{{- $path := ternary (default "/" $prefix) $prefix $dedicated -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-seaweedfs-admin-route
  labels:
    component: seaweedfs-admin
    app.kubernetes.io/name: seaweedfs-admin
    app.kubernetes.io/component: data-store
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
  {{- include "flame-node.gateway.parentRefs" . | nindent 2 }}
  hostnames:
  - {{ if $dedicated }}{{ $adminHost | quote }}{{ else }}{{ $sharedHost | quote }}{{ end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ $path | quote }}
    backendRefs:
    - name: node-datastore-seaweedfs-admin
      port: 23646
{{- /* The NGINX Gateway Fabric upload size limit is raised on this route only, the one taking uploads (as with the Ingresses).
A route policy also works on an external Gateway, which the chart does not own. */}}
{{- if .Values.expose.gateway.nginxGatewayFabric.enabled }}
---
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: {{ .Release.Name }}-seaweedfs-admin-route-client-settings
  labels:
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Release.Name }}-seaweedfs-admin-route
  body:
    maxSize: {{ .Values.expose.gateway.nginxGatewayFabric.maxBodySize | quote }}
{{- end }}
{{- /* Upstream timeouts for large uploads through the admin panel. */}}
{{- if and .Values.expose.gateway.nginxGatewayFabric.enabled .Values.expose.gateway.nginxGatewayFabric.proxySettings }}
---
apiVersion: gateway.nginx.org/v1alpha1
kind: ProxySettingsPolicy
metadata:
  name: {{ .Release.Name }}-seaweedfs-admin-route-proxy-settings
  labels:
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Release.Name }}-seaweedfs-admin-route
  timeout:
    send: 900s
    read: 900s
{{- end }}
{{- end }}
