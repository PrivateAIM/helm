{{- if and (eq .Values.expose.type "gateway") (not .Values.expose.gateway.external) -}}
{{- $_ := required "expose.hostname is required when expose.type=gateway" .Values.expose.hostname -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-node-gateway
  labels:
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  gatewayClassName: {{ .Values.expose.gateway.gatewayClassName }}
  listeners:
  - protocol: HTTP
    port: 80
    name: node-http
    hostname: {{ include "flame-node.gateway.routeHostname" . | quote }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- if and .Values.dataStore.enabled .Values.dataStore.seaweedfs.admin.enabled .Values.dataStore.seaweedfs.admin.gateway.enabled }}
  {{- $adminHost := include "flame-node.dataStore.seaweedfs.admin.routeHostname" . }}
  {{- if and $adminHost (ne $adminHost (include "flame-node.gateway.routeHostname" .)) }}
  - protocol: HTTP
    port: 80
    name: seaweedfs-admin-http
    hostname: {{ $adminHost | quote }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  {{- end }}
{{- if and .Values.expose.gateway.nginxGatewayFabric.enabled .Values.expose.gateway.nginxGatewayFabric.snippets }}
---
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsPolicy
metadata:
  name: {{ .Release.Name }}-node-gateway-ngf-snippets
  labels:
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Release.Name }}-node-gateway
  snippets:
  - context: http
    value: |
      large_client_header_buffers 8 32k;
{{- end }}
{{- end }}