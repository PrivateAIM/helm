{{- if or .Values.gateway.enabled .Values.global.node.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-node-gateway
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
  - protocol: HTTP
    port: 80
    name: node-http
    hostname: {{ regexReplaceAll "^https?://(.*)" .Values.gateway.hostname "${1}" }}
    allowedRoutes:
      namespaces:
        from: Same
{{- end }}