{{- if and (eq .Values.expose.type "gateway") .Values.eventLogging.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-victoria-logs-route
  labels:
    component: victoria-logs
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
  - name: {{ .Release.Name }}-node-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /events
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: {{ .Release.Name }}-victoria-logs-server
      port: 9428
{{- end }}
