apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-storage-service
  labels:
    component: flame-storage-service
    app.kubernetes.io/name: flame-storage-service
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    component: flame-storage-service
    app.kubernetes.io/name: flame-storage-service
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: 8080
      targetPort: api
  type: ClusterIP
