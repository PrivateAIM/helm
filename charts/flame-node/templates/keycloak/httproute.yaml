{{- $kcPath := include "keycloak.relativePath.normalized" . -}}
{{- if and (eq .Values.expose.type "gateway") $kcPath -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-keycloak-route
  labels:
    component: flame-keycloak
    app.kubernetes.io/name: flame-keycloak
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: flame-node
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
  {{- include "flame-node.gateway.parentRefs" . | nindent 2 }}
  hostnames:
  - {{ include "flame-node.gateway.routeHostname" . | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ $kcPath }}
    backendRefs:
    - name: {{ .Release.Name }}-keycloak-http
      port: 80
{{- end }}
