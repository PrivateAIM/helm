global:
    imagePullPolicy: "IfNotPresent"

    flameHub:
        publicHttps: true # used for constructing URLs used in your browser
        # enable this ingress for path based routing
        # alternatively you can enable ingress for each Hub service individually (subdomain-based routing)
        # enabling this ingress will expose all Hub services on the same domain at different paths (e.g. /core/, /messenger/, /storage/, /telemetry/)
        ingress:
            enabled: true
            hostname: "localhost"
            className: "" # ingress class you want to use (optional)
            # Default annotations for ingress nginx
            # Replace or remove if you use a different ingress controller
            annotations:
                # Example annotations for ingress nginx
                nginx.ingress.kubernetes.io/rewrite-target: /$2 # for path based routing
                nginx.ingress.kubernetes.io/proxy-buffer-size: "16k" # for large auth token
                nginx.ingress.kubernetes.io/proxy-body-size: "0" # for large file uploads
                nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
                nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        # Gateway API configuration.
        # Set enabled: true to enable all service routes at once (using the default paths below).
        # Alternatively, enable routing per service (clientUI.gatewayApi.enabled, serverCore.gatewayApi.enabled, etc.).
        # For path-based routing, keep the default paths and use one shared hostname.
        # For domain-based routing, set a unique hostname per service and override path to "/".
        # Note: Harbor cannot use path-based routing because it always needs its own hostname
        gatewayApi:
            enabled: false # enable gatewayApi for all services
            hostname: "localhost"
            tls:
                enabled: false
                mode: "Terminate"
                certificateRef: ""
                certificateRefNamespace: "" # optional namespace for certificateRef
            gateway:
                ## @param global.flameHub.gatewayApi.gateway.gatewayClassName GatewayClass name (only applies when external is false)
                gatewayClassName: ""
                ## @param global.flameHub.gatewayApi.gateway.external When true, the chart does not create a Gateway resource and instead attaches HTTPRoutes to an existing external Gateway
                external: false
                ## @param global.flameHub.gatewayApi.gateway.parentRef Reference to the external Gateway for HTTPRoutes (only used when external is true)
                parentRef:
                    ## @param global.flameHub.gatewayApi.gateway.parentRef.name Name of the external Gateway resource (required when external is true)
                    name: ""
                    ## @param global.flameHub.gatewayApi.gateway.parentRef.namespace Namespace of the external Gateway (omit for same-namespace)
                    namespace: ""
                    ## @param global.flameHub.gatewayApi.gateway.parentRef.sectionName Listener name on the external Gateway to attach to (optional)
                    sectionName: ""
                annotations: {}
            # Set to true to use SnippetsFilter-based proxy timeouts (see harbor/server-storage httproutes).
            # Requires snippets to be enabled in your NGINX Gateway Fabric install.
            # (NGINX Gateway Fabric does not support annotations.)
            nginxGatewayFabric:
                snippets: false

        # PostgreSQL service and secret, kept under global so subcharts (authup) can read
        # them: Helm shares only `global` into a subchart's values.
        postgresql:
            # Service host. Not release-scoped (goharbor cannot derive the release name).
            # keep in sync with harbor.database.external.host
            host: "postgresql"
            # Name of the chart-managed Secret (created when existingSecret is empty).
            # Override per-release only for multiple installs in one namespace.
            secretName: "flame-hub-pg"
            # Bring your own Secret instead: set this to its name and the chart will not
            # create one, it only reads yours (must contain both "username" and "password"
            # keys; goharbor hardcodes "password"). Everything that reads the Secret — hub
            # workloads and the authup subchart follow this automatically.
            # Keep in sync with harbor.database.external.existingSecret
            existingSecret: ""

        # Consumed via the flameHub.redis.host / flameHub.redis.port helpers, which also name the chart-managed Redis Service.
        redis:
            # Name of the chart-managed Redis Service. Leave empty for the release-scoped
            # default "<release>-redis". This is NOT an external-Redis switch.
            host: ""
            port: 6379

image:
    registry: ghcr.io
    repository: privateaim/hub
    tag: 0.13.2
    pullPolicy: Always

# internal services
clientUI:
    replicaCount: 3
    publicHttps: false # global.flameHub.publicHttps also enables this
    cookieDomain: ""
    # service specific ingress configuration. If you use this, you will need a separate domain for each service
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        className: ""
        annotations: {}
    # Per-service gateway API route. Set hostname to override the global default.
    # For path-based routing, use the default paths below. For domain-based, set hostname and path: "/".
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/"

serverCore:
    publicHttps: false # global.flameHub.publicHttps also enables this
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        className: ""
        annotations: {}
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/core"
    env:
        masterImagesBranch: ""

serverMessenger:
    publicHttps: false # global.flameHub.publicHttps also enables this
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        className: ""
        annotations: {}
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/messenger"

serverStorage:
    publicHttps: false # global.flameHub.publicHttps also enables this
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        # Default annotations for ingress nginx (e.g. for large file uploads)
        # Replace or remove if you use a different ingress controller
        annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/storage"

serverTelemetry:
    publicHttps: false # global.flameHub.publicHttps also enables this
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        # Default annotations for ingress nginx
        # Replace or remove if you use a different ingress controller
        annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
        # Annotations for the grafana sub-path ingress (rewrite-target)
        subPathAnnotations:
            nginx.ingress.kubernetes.io/rewrite-target: /$2
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/telemetry"
        grafanaPath: "/grafana"

serverCoreWorker:
    enabled: true
    # Use a docker-in-docker sidecar container instead of mounting the docker socket from the host
    useSidecarDinD: true
    persistence:
        size: "100Gi"
        # See /charts/third-party/openebs for details
        # storageClass: "mayastor-replicated"

# Credentials configuration
auth:
    # Name of the secret containing all credentials
    # IMPORTANT: If you change this value, you must also update the subchart configurations to match.
    # This is because subcharts have their own existingSecret fields that cannot be templated, unfortunately.
    secretName: "flame-hub-auth"

    # Advanced: Use your own secret instead of auto-generated one, takes precedence over secretName
    # IMPORTANT:If you set this, you must also update the subchart configurations below to point to your secret!
    existingSecret: ""

    # Seed values for the two authup credentials this chart writes into the secret
    # above. They live here rather than under `authup.auth`, because the authup
    # subchart refuses to render when an existing secret is referenced alongside
    # inline credentials.
    # Default Password for the FLAME Hub Admin User
    authupAdminPassword: "" # Leave empty for auto-generation
    # Default secret for the FLAME Hub System Client
    authupClientSecret: "" # Leave empty for auto-generation

## Dependencies / Subcharts

# Authentication provider. Upstream chart: https://github.com/authup/helm
# Its values schema is strict (additionalProperties: false), so only keys the
# subchart itself declares may appear here - including the routing, which uses the
# chart's own server.ingress / server.route rather than Hub-specific keys.
# The image is no longer pinned here: the chart's appVersion tracks the authup
# release, so bumping authup means bumping the dependency version in Chart.yaml.
authup:
    # The Hub brings its own PostgreSQL and Redis; the chart's bundled PostgreSQL and
    # Valkey stay off (valkey is off by default).
    postgresql:
        enabled: false
    # Rendered via tpl in the authup subchart context, so these follow the global
    # postgres values. no need to edit them alongside the pg values.
    externalDatabase:
        host: '{{ include "flameHub.postgresql.host" . }}'
        database: "auth"
        existingSecret: '{{ include "flameHub.postgresql.secretName" . }}'
        existingSecretPasswordKey: "password"
        # user is deliberately left at the chart default: it is a plain env value and
        # is shadowed below by a secretKeyRef onto the pg Secret's "username" key, so
        # bringing your own pg Secret with a different user needs no change here.
    # The connection string is pre-built in the credentials Secret under the key the
    # chart already expects (externalRedis.existingSecretKey: redis-connection-string).
    externalRedis:
        existingSecret: "flame-hub-auth"
    auth:
        # IMPORTANT: keep in sync with auth.secretName / auth.existingSecret below.
        existingSecret: "flame-hub-auth"
        # The key names this chart writes; the subchart's own defaults differ
        # (admin-password / system-client-secret), so they are mapped rather than
        # rotating the credentials of existing installations.
        secretKeys:
            adminPasswordKey: "authup-admin-password"
            systemClientSecretKey: "authup-client-secret"
        # The system client is the identity the Hub services authenticate as
        # (CLIENT_ID=system + authup-client-secret).
        systemClientEnabled: true
        # Re-assert both credentials on every boot, so rotating them in the Secret
        # actually takes effect (what the previous chart did unconditionally).
        adminPasswordReset: true
        systemClientSecretReset: true
    server:
        # Public URL / OIDC issuer origin, and the single source of truth for
        # authup's public address - this chart reads it back for the Hub UI.
        # Defaults to the shared Hub hostname + /auth. With per-service routing
        # there is no shared hostname, so set it explicitly (together with
        # server.route.enabled and server.route.hostnames below).
        publicUrl: '{{ include "flameHub.authup.defaultPublicURL" . }}'
        # Trusted first-party application origins (redirect allowlist for authup's built-in
        # system clients; not CORS). The Hub UI logs in through the admin-console client, so
        # its public origin must be covered here.
        # Bare hosts expand to both their http and https origin. Each entry is rendered as a
        # Helm template inside the authup subchart context.
        # Defaults to the public domain of the Hub UI, derived from the global
        # ingress/gatewayApi hostname. With per-service routing (both global modes off) there
        # is no such hostname and clientUI.* is not visible here, so replace this entry with
        # the UI origin - the render says so rather than leaving the list empty, because an
        # unlisted origin cannot complete a login and only fails at the first login attempt.
        trustedOrigins:
            - '{{ include "flameHub.uiDomain" . }}'
        # Read the DB user from the same Secret as the password. externalDatabase.user
        # is a plain value, but an env entry outranks the chart's env ConfigMap, so this
        # avoids duplicating postgresql.auth.username as a second source of truth.
        extraEnvVars:
            -   name: DB_USERNAME
                valueFrom:
                    secretKeyRef:
                        name: '{{ include "flameHub.postgresql.secretName" . }}'
                        key: username
        # Wait for the backing services, like every other Hub workload (tpl-rendered
        # in the authup subchart context).
        initContainers:
            -   name: wait-for-db
                image: busybox
                command: ['sh', '-c', 'until nc -z -v -w30 {{ include "flameHub.postgresql.host" . }} 5432; do echo "Waiting for db..."; sleep 5; done']
            -   name: wait-for-redis
                image: busybox
                command: ['sh', '-c', 'until nc -z -v -w30 {{ include "flameHub.redis.host" . }} {{ include "flameHub.redis.port" . }}; do echo "Waiting for redis..."; sleep 5; done']
        # Declaratively provision the FLAME permission taxonomy and the analyst/diz global
        # roles into authup at boot. The content is rendered by
        # templates/authup/provisioning-configmap.yaml and mounted by the authup subchart.
        provisioning:
            enabled: true
            existingConfigMap: '{{ .Release.Name }}-authup-provisioning'
        # Brand the consoles authup serves itself (auth/login + the account console
        # at /account) with the FLAME Hub design, so leaving the Hub UI for a login
        # or a profile change does not change appearance mid-flow. The theme content
        # is rendered by templates/authup/theme-configmap.yaml and mounted by the
        # authup subchart.
        # The subchart's native theme.tokens/logo values are not used: the logo is read
        # from this chart's files/, which a subchart's .Files cannot reach.
        theme:
            enabled: true
            existingConfigMap: '{{ .Release.Name }}-authup-theme'
            # A ConfigMap key cannot contain "/", so the on-disk layout authup expects
            # is restored here: the manifest at the theme root, servable assets under
            # assets/. Must stay exhaustive - a key missing here is not mounted at all.
            existingConfigMapItems:
                -   key: "theme.json"
                    path: "theme.json"
                -   key: "logo.svg"
                    path: "assets/logo.svg"
        # service specific ingress configuration. If you use this, you will need a
        # separate domain for each service.
        ingress:
            enabled: false
            hostname: ""
            ingressClassName: ""
            annotations:
                nginx.ingress.kubernetes.io/proxy-buffer-size: "256k"
                nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
                nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "512k"
        # Gateway API route, rendered by the authup subchart itself.
        # `enabled` follows global.flameHub.gatewayApi.enabled like every other service.
        # The subchart renders it through its strict "authup.flag" helper: a template
        # yielding "true" enables the route, "false"/"" disable it, anything else fails.
        # Set a plain true/false here to opt authup in or out on its own.
        # `enabled` and `hostnames` are rendered by this chart as well (see
        # "flameHub.authup.routeEnabled" and templates/gateway.yaml), so they may only
        # reference global.* - a subchart-scoped path fails in that context.
        # The remaining entries are tpl-rendered in subchart context only, so they may
        # reference global.* and the subchart's own values.
        route:
            enabled: '{{ .Values.global.flameHub.gatewayApi.enabled }}'
            hostnames:
                - '{{ include "flameHub.authup.defaultHost" . }}'
            # The Gateway this chart renders. With an external Gateway
            # (global.flameHub.gatewayApi.gateway.external) override this with that
            # Gateway's name/namespace/sectionName - a values list cannot drop the
            # namespace and sectionName keys conditionally.
            parentRefs:
                - name: '{{ .Release.Name }}-flame-hub-gateway'
            matches:
                -   path:
                        type: "PathPrefix"
                        value: "/auth"
            # Strips the /auth prefix before it reaches authup. With a dedicated
            # authup hostname, set matches to "/" and drop this filter.
            # NGINX Gateway Fabric users additionally append the SnippetsFilter this
            # chart renders (see templates/authup/snippetsfilter-timeouts.yaml):
            #   -   type: "ExtensionRef"
            #       extensionRef:
            #           group: "gateway.nginx.org"
            #           kind: "SnippetsFilter"
            #           name: '{{ .Release.Name }}-authup-ngf-snippets'
            filters:
                -   type: "URLRewrite"
                    urlRewrite:
                        path:
                            type: "ReplacePrefixMatch"
                            replacePrefixMatch: "/"
    # The Hub ships its own UI; authup's bundled admin console is not deployed.
    adminConsole:
        enabled: false

rabbitmq:
    # Single-node RabbitMQ. The client Service is "<release>-rabbitmq:5672".
    image:
        repository: "rabbitmq"
        tag: "4.1.3"
        pullPolicy: "IfNotPresent"
    auth:
        username: "root"
        # Password override; leave empty for auto-generation into flame-hub-auth (key rabbitmq-password).
        password: ""
    persistence:
        enabled: true
        size: 8Gi
        # See /charts/third-party/openebs for details
        # storageClass: "mayastor-replicated"
    podSecurityContext:
        fsGroup: 999
    resources: {}
# Single-node Redis (no replication). Rendered from templates/redis.
# The password lives in the shared flame-hub-auth Secret under
# redis-password/redis-connection-string.
redis:
    # Service host/port are configured under global.flameHub.redis (they must be readable
    # by the authup subchart). The settings below configure the chart-managed Redis pod.
    image:
        repository: "redis"
        tag: "8.2.1"
        pullPolicy: "IfNotPresent"
    auth:
        # Password override; leave empty for auto-generation into flame-hub-auth.
        # The Secret name / bring-your-own option is auth.secretName / auth.existingSecret.
        password: ""
    persistence:
        enabled: true
        size: 4Gi
        # See /charts/third-party/openebs for details
        # storageClass: "mayastor-replicated"
    # Extra flags appended to the redis-server command (after --requirepass).
    extraArgs: []
    podSecurityContext:
        fsGroup: 999
    resources: {}

# seaweedfs is the S3 object store used by server-storage.
# S3 admin credentials are auto-generated into the "<release>-seaweedfs-s3-secret" Secret
# and preserved across upgrades.
seaweedfs:
    global:
        seaweedfs:
            # The ServiceAccount is the subchart's only resource whose name is not derived
            # from the release name. When running multiple flame-hub instances in the same
            # namespace, set a unique name per instance.
            serviceAccountName: "seaweedfs"
            createClusterRole: false
            # when writing to a new bucket, create only 1 volume instead of 7
            extraEnvironmentVars:
                WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
                WEED_MASTER_VOLUME_GROWTH_COPY_OTHER: "1"
    # Run everything in a single pod and disable the standalone components.
    master:
        enabled: false
        volumeSizeLimitMB: 2000
    volume:
        enabled: false
        # allInOne sources its -volume.max flag from the FIRST dataDir's maxVolumes. Each S3
        # bucket becomes its own SeaweedFS collection needing >=1 volume
        # Only maxVolumes is consumed here (the allInOne data PVC lives under allInOne.data)
        # The default SeaweedFS Chart values have a similar default "data1"-item
        dataDirs:
            - name: data1
              type: "custom"      # allInOne only reads maxVolumes below; this provisions no storage
              maxVolumes: 5000
    filer:
        enabled: false
    s3:
        # The all-in-one pod serves S3 itself; keep the standalone S3 gateway disabled.
        enabled: false
        # Required so the subchart generates the S3 credentials Secret.
        enableAuth: true
        # Name of an existing Secret with the S3 credentials to use instead of the generated one.
        # It must contain the keys admin_access_key_id and admin_secret_access_key (URL-safe
        # values, they are embedded in a connection string) and seaweedfs_s3_config.
        existingConfigSecret: ""
    allInOne:
        enabled: true
        # The subchart defaults to hard pod anti-affinity (at most one all-in-one pod per
        # node). With a single replica the rule has no effect.
        affinity: ""
        s3:
            enabled: true
            enableAuth: true
        data:
            type: persistentVolumeClaim
            size: 10Gi
            # See /charts/third-party/openebs for details
            # storageClass: "mayastor-replicated"

postgresql:
    image:
        repository: "postgres"
        tag: "17.6"
        pullPolicy: "IfNotPresent"
    auth:
        # Superuser the services authenticate as
        username: "postgres"
        postgresPassword: "" # Leave empty for auto-generation
        # The Secret name and the bring-your-own option live under
        # global.flameHub.postgresql; only the password override is here.
    # Application databases created on first initialisation only (empty data dir).
    # registry is consumed by Harbor; core/storage/telemetry/auth by the FLAME services.
    databases:
        - core
        - storage
        - telemetry
        - auth
        - registry
    service:
        # Host and Secret name are under global.flameHub.postgresql. Only the port is here.
        port: 5432
    persistence:
        size: 16Gi
        # See /charts/third-party/openebs for details
        # storageClass: "mayastor-replicated"
    # Extra flags passed to the postgres server process (mirrors the previous
    # max_connections tuning).
    extraArgs:
        - "-c"
        - "max_connections=1024"
    podSecurityContext:
        fsGroup: 999
    resources: {}

grafana:
    image:
        repository: grafana/grafana
    admin:
        password: "" # Leave empty for auto-generation into flame-hub-auth
        existingSecret: "flame-hub-auth"
        userKey: "grafana-admin-user"
        passwordKey: "grafana-admin-password"
    persistence:
        enabled: true
    grafana.ini:
        server:
            # served behind the /grafana ingress path (rewrite strips the prefix to /)
            root_url: "%(protocol)s://%(domain)s/grafana"
            serve_from_sub_path: false
        plugins:
            # the VictoriaLogs datasource plugin is unsigned; grafana refuses to load it otherwise
            allow_loading_unsigned_plugins: victoriametrics-logs-datasource

    plugins:
        - "https://github.com/VictoriaMetrics/victorialogs-datasource/releases/download/v0.27.1/victoriametrics-logs-datasource-v0.27.1.zip;victoriametrics-logs-datasource"

    datasources:
        datasources.yaml:
            apiVersion: 1
            datasources:
                - name: Prometheus
                  type: prometheus
                  access: proxy
                  url: http://{{ .Release.Name }}-prometheus-server:9090
                  jsonData:
                      httpMethod: POST
                      manageAlerts: true
                      prometheusType: Prometheus
                      prometheusVersion: 2.44.0
                      cacheLevel: 'High'
                      disableRecordingRules: false
                      incrementalQueryOverlapWindow: 10m
                - name: VL
                  type: victoriametrics-logs-datasource
                  url: http://{{ .Release.Name }}-victoria-logs-vlselect:9471

    # See /charts/third-party/openebs for details
    # persistence:
    #     storageClass: "mayastor-replicated"

victoria-logs-cluster:
    nameOverride: "victoria-logs"
    vlstorage:
        retentionPeriod: "100y"
        retentionDiskSpaceUsage: "50GiB"

prometheus:
    nameOverride: "prometheus"
    alertmanager:
        image:
            #repository: "tada5hi/alertmanager"
            repository: "bitnamilegacy/alertmanager"
            tag: "0.28.1-debian-12-r15"
        service:
            type: ClusterIP
    server:
        replicaCount: 2
        service:
            type: ClusterIP
            ports:
                http: 9090
        image:
            #repository: "tada5hi/prometheus"
            repository: "bitnamilegacy/prometheus"
            tag: "3.5.0-debian-12-r3"
        configuration: |
            scrape_configs:
              - job_name: flame-hub-server-core
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-core:3000"]
              - job_name: flame-hub-server-messenger
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-messenger:3000"]
              - job_name: flame-hub-server-storage
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-storage:3000"]
              - job_name: flame-hub-server-telemetry
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-telemetry:3000"]
              - job_name: authup-server
                static_configs:
                  - targets: ["{{ .Release.Name }}-authup-server:3000"]


# IMPORTANT: the goharbor subchart does NOT evaluate Helm templates in its values, so the
# few names that need to reference the release must be set as literal strings, and
# overridden per-release when the release name is not "flame-hub" (e.g. "hub" on hub-dev):
#   - harbor.expose.clusterIP.name          -> the in-cluster Harbor service (harbor.internalHost reads it)
#   - harbor.database.external.host         -> must equal global.flameHub.postgresql.host ("postgresql")
#   - harbor.database.external.existingSecret -> must equal the effective global.flameHub.postgresql
#                                                secret (existingSecret or secretName, e.g. "flame-hub-pg")
#   - harbor.existingSecretAdminPassword      -> must equal the effective harbor secret (existingSecret
#   - harbor.existingSecretSecretKey             or secretName below, e.g. "flame-hub-harbor")
harbor:
    enabled: true
    adminUsername: "admin"
    # Harbor's own credentials Secret (admin password, core secretKey, connection string),
    # created by templates/harbor/secret.yaml.
    secretName: "flame-hub-harbor"
    # Bring your own Secret instead: set this and the chart won't create one, it only reads
    # yours (keys: harbor-admin-password, secretKey, harbor-connection-string). If set, update
    # the two existingSecret* literals below to match.
    existingSecret: ""
    # Seeds harbor-admin-password in the harbor secret
    adminPassword: ""
    # Optional: pin the 16-char core secretKey (empty -> generate-and-keep, or carry over an
    # existing value on upgrade). Prefer leaving empty and pre-seeding the Secret.
    secretKey: ""
    # goharbor's own admin-password key; unused because existingSecretAdminPassword is set,
    # but kept empty so goharbor does not mint a second, different password.
    harborAdminPassword: ""
    existingSecretAdminPassword: "flame-hub-harbor"
    existingSecretAdminPasswordKey: "harbor-admin-password"
    # goharbor mounts this Secret's "secretKey" key as the core encryption key. Must equal the
    # effective harbor secret name.
    existingSecretSecretKey: "flame-hub-harbor"
    externalURL: "" # Required by Harbor, e.g. https://harbor.hub.local
    ingress:
        enabled: true # Harbor always needs its own hostname/domain, even when global path-based ingress is enabled
        className: ""
        # Default annotations for ingress nginx
        # Replace or remove if you use a different ingress controller
        annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
            nginx.ingress.kubernetes.io/upstream-vhost: '{{ include "harbor.host" . }}'
    gatewayApi:
        # hostname is taken from externalURL
        # no option to set path, as harbor does not support it
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        tls:
            enabled: false
            mode: "Terminate"
            certificateRef: ""
            certificateRefNamespace: "" # optional override; defaults to global.flameHub.gatewayApi.tls.certificateRefNamespace
    # --- goharbor subchart values ---
    # Expose Harbor as an in-cluster ClusterIP service with its own self-signed TLS.
    # External access is handled by the flame-hub ingress / gatewayApi blocks above.
    expose:
        type: clusterIP
        tls:
            enabled: true
            certSource: auto
            auto:
                commonName: harbor.local
        clusterIP:
            # Literal service name (the subchart cannot template this).
            # Override to "<release>-harbor" per release.
            name: "harbor"
            ports:
                httpsPort: 443
    updateStrategy:
        type: Recreate
    persistence:
        enabled: true
        resourcePolicy: keep
        persistentVolumeClaim:
            registry:
                existingClaim: ""
                size: 5Gi
                # See /charts/third-party/openebs for details
                # storageClass: "mayastor-replicated"
            jobservice:
                jobLog:
                    existingClaim: ""
                    size: 1Gi
            trivy:
                existingClaim: ""
                size: 5Gi
    registry:
        relativeurls: true # Needed for server-core-worker because of TCP forwarding (see https://github.com/distribution/distribution/issues/970#issuecomment-284227065)
    # Use the shared cluster PostgreSQL, not Harbor's bundled database.
    database:
        type: external
        external:
            # Literal service name (goharbor cannot template this). Must equal
            # global.flameHub.postgresql.host; override per-release if that changes.
            host: "postgresql"
            port: "5432"
            username: "postgres"
            coreDatabase: "registry"
            # goharbor requires the key in this secret to be literally "password".
            # The self-hosted postgres chart (templates/postgresql/secret.yaml) already
            # stores the credential under that key, so Harbor reads it directly — no
            # mirror secret needed. Must equal the effective global.flameHub.postgresql
            # secret (existingSecret or secretName).
            existingSecret: "flame-hub-pg"
            sslmode: "disable"
    # Harbor's own bundled Redis (the app-level redis subchart is separate).
    redis:
        type: internal

# In-cluster Harbor access proxy — LOCAL DEV ONLY.
#
# The server-core and server-core-worker pods must reach Harbor at the hostname on its TLS
# certificate (harbor.externalURL). In real deployments Harbor is published at that hostname
# over public DNS + valid HTTPS, so the pods talk to it directly — leave this disabled.
#
# On a local cluster (e.g. k3s with values_local) Harbor has no public DNS and only a
# self-signed cert, so the hostname is unreachable from inside the pod. Enabling this adds,
# to both server-core and server-core-worker:
#   - a hostAlias mapping harbor.host -> 127.0.0.1,
#   - a socat sidecar that forwards 127.0.0.1:443 to the in-cluster Harbor service, and
#   - the --insecure-registry flag on the core-worker's docker-in-docker daemon.
# It has no effect when externalHarbor.enabled is true (that Harbor is already external).
harborProxy:
    enabled: false

externalHarbor:
    enabled: false
    URL: ""
