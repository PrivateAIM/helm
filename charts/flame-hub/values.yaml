global:
    imagePullPolicy: "IfNotPresent"

    flameHub:
        ingress:
            enabled: true
            ssl: false
            hostname: "localhost"

image:
    registry: ghcr.io
    repository: privateaim/hub
    tag: latest
    pullPolicy: Always

# internal services
clientUI:
    cookieDomain: ""
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"

serverCore:
    ingress:
        ssl: false
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
    env:
        masterImagesBranch: ""

serverMessenger:
    ingress:
        ssl: false
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"

serverStorage:
    ingress:
        ssl: false
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"

serverTelemetry:
    ingress:
        ssl: false
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"

serverCoreWorker:
    enabled: true
    # Use a docker-in-docker sidecar container instead of mounting the docker socket from the host
    useSidecarDinD: true

# Credentials configuration
auth:
    # Name of the secret containing all credentials
    # IMPORTANT: If you change this value, you must also update the subchart configurations to match.
    # This is because subcharts have their own existingSecret fields that cannot be templated, unfortunately.
    secretName: "flame-hub-auth"

    # Advanced: Use your own secret instead of auto-generated one, takes precedence over secretName
    # IMPORTANT:If you set this, you must also update the subchart configurations below to point to your secret!
    existingSecret: ""

## Dependencies / Subcharts

# Authentication Provider
authup:
    auth:
        existingSecret: "flame-hub-auth"
        # Default Password for the FLAME Hub Admin User
        defaultAdminPassword: "" # Leave empty for auto-generation
    ingress:
        enabled: false
        hostname: ""
        ssl: false

vault:
    server:
        enabled: true
        dev:
            enabled: true
            # needs to be set. No option for passing a secret here.
            devRootToken: "start123"
rabbitmq:
    nameOverride: "rabbitmq"
    auth:
        username: "root"
        password: "" # Leave empty for auto-generation
        existingPasswordSecret: "flame-hub-auth"
        existingSecretPasswordKey: "rabbitmq-password"
    image:
        #repository: "tada5hi/rabbitmq"
        repository: "bitnamilegacy/rabbitmq"
        tag: "4.1.3-debian-12-r1"
    # See /charts/third-party/openebs for details
    # persistence:
    #     storageClass: "mayastor-replicated"
redis:
    nameOverride: "redis"
    startupProbe:
        failureThreshold: 15
    readinessProbe:
        failureThreshold: 10
    auth:
        enabled: true
        password: "" # Leave empty for auto-generation
        existingSecret: "flame-hub-auth"
        existingSecretPasswordKey: "redis-password"
    image:
        #repository: "tada5hi/redis"
        repository: "bitnamilegacy/redis"
        tag: "8.2.1-debian-12-r0"

minio:
    nameOverride: "minio"
    image:
        #repository: "tada5hi/minio"
        repository: "bitnamilegacy/minio"
        tag: "2025.7.23-debian-12-r3"
    auth:
        rootUser: "admin"
        rootPassword: "" # Leave empty for auto-generation
        existingSecret: "flame-hub-auth"
        rootPasswordKey: "minio-root-password"
    console:
        image:
            #repository: "tada5hi/minio-object-browser"
            repository: "bitnamilegacy/minio-object-browser"
            tag: "2.0.2-debian-12-r3"
    # See /charts/third-party/openebs for details
    # persistence:
    #     storageClass: "mayastor-replicated"

postgresql:
    nameOverride: "postgresql"
    image:
        repository: "bitnamilegacy/postgresql"
        tag: "17.6.0-debian-12-r4"
    auth:
        postgresPassword: "start123"
        replicationPassword: "start123"
    primary:
        startupProbe:
            failureThreshold: 30
        readinessProbe:
            failureThreshold: 20
        persistence:
            enabled: true
            size: 16Gi
    readReplicas:
        replicaCount: 0
        persistence:
            enabled: true
            size: 16Gi
        startupProbe:
            failureThreshold: 30
        readinessProbe:
            failureThreshold: 20
    architecture: "replication"

grafana:
    nameOverride: "grafana"
    image:
        #repository: "tada5hi/grafana"
        repository: "bitnamilegacy/grafana"
        tag: "12.1.1-debian-12-r1"
    admin:
        password: "" # Leave empty for auto-generation
        existingSecret: "flame-hub-auth"
        existingSecretPasswordKey: "grafana-admin-password"
    dashboardsProvider:
        enabled: true
    datasources:
        secretName: grafana-datasources
    config:
        useGrafanaIniFile: true
        grafanaIniConfigMap: grafana
    plugins:
        - https://github.com/VictoriaMetrics/victorialogs-datasource/releases/download/v0.23.2/victoriametrics-logs-datasource-v0.23.2.zip;victoriametrics-logs-datasource
    # See /charts/third-party/openebs for details
    # persistence:
    #     storageClass: "mayastor-replicated"

victoria-logs-cluster:
    nameOverride: "victoria-logs"
    vlstorage:
        retentionPeriod: "100y"
        retentionDiskSpaceUsage: "50GiB"

grafana-loki:
    nameOverride: "loki"
    loki:
        image:
            #repository: "tada5hi/grafana-loki"
            repository: "bitnamilegacy/grafana-loki"
            tag: "3.5.3-debian-12-r2"
        overrideConfiguration:
            limits_config:
                deletion_mode: "filter-and-delete"
    gateway:
        image:
            #repository: "tada5hi/nginx"
            repository: "bitnamilegacy/nginx"
            tag: "1.29.1-debian-12-r0"
    memcachedfrontend:
        image:
            repository: "bitnamilegacy/memcached"
            tag: "1.6.39-debian-12-r0"
    memcachedchunks:
        image:
            repository: "bitnamilegacy/memcached"
            tag: "1.6.39-debian-12-r0"
    grafanaalloy:
        alloy:
            image:
                repository: "bitnamilegacy/grafana-alloy"
                tag: "1.10.1-debian-12-r1"
        configReloader:
            image:
                repository: "bitnamilegacy/configmap-reload"
                tag: "0.15.0-debian-12-r12"

prometheus:
    nameOverride: "prometheus"
    alertmanager:
        image:
            #repository: "tada5hi/alertmanager"
            repository: "bitnamilegacy/alertmanager"
            tag: "0.28.1-debian-12-r15"
        service:
            type: ClusterIP
    server:
        replicaCount: 2
        service:
            type: ClusterIP
            ports:
                http: 9090
        image:
            #repository: "tada5hi/prometheus"
            repository: "bitnamilegacy/prometheus"
            tag: "3.5.0-debian-12-r3"
        configuration: |
            scrape_configs:
              - job_name: flame-hub-server-core
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-core:3000"]
              - job_name: flame-hub-server-messenger
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-messenger:3000"]
              - job_name: flame-hub-server-storage
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-storage:3000"]
              - job_name: flame-hub-server-telemetry
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-telemetry:3000"]
              - job_name: authup-server-core
                static_configs:
                  - targets: ["{{ .Release.Name }}-authup-server-core:3000"]

harbor:
    enabled: true
    nameOverride: "harbor"
    adminUsername: "admin"
    adminPassword: "" # Leave empty for auto-generation
    existingSecret: "flame-hub-auth"
    existingSecretAdminPasswordKey: "harbor-admin-password"
    exposureType: "proxy"
    externalURL: "" # Required by Harbor, e.g. https://harbor.hub.local
    ingress:
        enabled: true # Harbor always needs its own hostname, this is independent of global path-based ingress
    migration:
        enabled: true
    # persistence:
    #     persistentVolumeClaim:
    #         registry:
    #             storageClass: "mayastor-replicated"
    nginx:
        behindReverseProxy: true
        tls:
            enabled: true
        image:
            repository: "bitnamilegacy/nginx"
            tag: "1.29.1-debian-12-r0"
    portal:
        # defining explicit secrets for the following fields is not required if a chart installation is triggered by helm
        image:
            #repository: "tada5hi/harbor-portal"
            repository: "bitnamilegacy/harbor-portal"
            tag: "2.13.2-debian-12-r1"
    core:
        image:
            #repository: "tada5hi/harbor-core"
            repository: "bitnamilegacy/harbor-core"
            tag: "2.13.2-debian-12-r3"
    jobservice:
        image:
            #repository: "tada5hi/harbor-jobservice"
            repository: "bitnamilegacy/harbor-jobservice"
            tag: "2.13.2-debian-12-r3"
    registry:
        relativeurls: true # Needed for server-core-worker because of TCP forwarding (see https://github.com/distribution/distribution/issues/970#issuecomment-284227065)
        server:
            image:
                #repository: "tada5hi/harbor-registry"
                repository: "bitnamilegacy/harbor-registry"
                tag: "2.13.2-debian-12-r2"
        controller:
            image:
                #repository: "tada5hi/harbor-registryctl"
                repository: "bitnamilegacy/harbor-registryctl"
                tag: "2.13.2-debian-12-r3"
    trivy:
        image:
            #repository: "tada5hi/harbor-adapter-trivy"
            repository: "bitnamilegacy/harbor-adapter-trivy"
            tag: "2.13.2-debian-12-r2"
    postgresql:
        nameOverride: "harbor-postgresql"
        image:
            repository: "bitnamilegacy/postgresql"
            # TODO: Update to a recent version (recent versions need different pvc permissions)
            # See https://github.com/bitnami/containers/issues/2680#issue-1334211988
            tag: "13.7.0-debian-11-r9"
    redis:
        enabled: true
        nameOverride: "harbor-redis"
        image:
            repository: "bitnamilegacy/redis"
            tag: "8.2.1-debian-12-r0"

externalHarbor:
    enabled: false
    URL: ""
