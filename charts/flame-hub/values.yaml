serverMessenger:
    hostname: ""
    ssl: false
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"

serverStorage:
    hostname: ""
    ssl: false
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"

serverTelemetry:
    hostname: ""
    ssl: false
    ingress:
