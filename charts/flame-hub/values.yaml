global:
    imagePullPolicy: "IfNotPresent"

    flameHub:
        publicHttps: true # used for constructing URLs used in your browser
        # enable this ingress for path based routing
        # alternatively you can enable ingress for each Hub service individually (subdomain-based routing)
        # enabling this ingress will expose all Hub services on the same domain at different paths (e.g. /core/, /messenger/, /storage/, /telemetry/)
        ingress:
            enabled: true
            hostname: "localhost"
            className: "" # ingress class you want to use (optional)
            # Default annotations for ingress nginx
            # Replace or remove if you use a different ingress controller
            annotations:
                # Example annotations for ingress nginx
                nginx.ingress.kubernetes.io/rewrite-target: /$2 # for path based routing
                nginx.ingress.kubernetes.io/proxy-buffer-size: "16k" # for large auth token
                nginx.ingress.kubernetes.io/proxy-body-size: "0" # for large file uploads
                nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
                nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        # Gateway API configuration.
        # Set enabled: true to enable all service routes at once (using the default paths below).
        # Alternatively, enable routing per service (clientUI.gatewayApi.enabled, serverCore.gatewayApi.enabled, etc.).
        # For path-based routing, keep the default paths and use one shared hostname.
        # For domain-based routing, set a unique hostname per service and override path to "/".
        # Note: Harbor cannot use path-based routing because it always needs its own hostname
        gatewayApi:
            enabled: false # enable gatewayApi for all services
            hostname: "localhost"
            tls:
                enabled: false
                mode: "Terminate"
                certificateRef: ""
                certificateRefNamespace: "" # optional namespace for certificateRef
            gateway:
                ## @param global.flameHub.gatewayApi.gateway.gatewayClassName GatewayClass name (only applies when external is false)
                gatewayClassName: ""
                ## @param global.flameHub.gatewayApi.gateway.external When true, the chart does not create a Gateway resource and instead attaches HTTPRoutes to an existing external Gateway
                external: false
                ## @param global.flameHub.gatewayApi.gateway.parentRef Reference to the external Gateway for HTTPRoutes (only used when external is true)
                parentRef:
                    ## @param global.flameHub.gatewayApi.gateway.parentRef.name Name of the external Gateway resource (required when external is true)
                    name: ""
                    ## @param global.flameHub.gatewayApi.gateway.parentRef.namespace Namespace of the external Gateway (omit for same-namespace)
                    namespace: ""
                    ## @param global.flameHub.gatewayApi.gateway.parentRef.sectionName Listener name on the external Gateway to attach to (optional)
                    sectionName: ""
                annotations: {}
            # Set to true to use SnippetsFilter-based proxy timeouts (see harbor/server-storage httproutes).
            # Requires snippets to be enabled in your NGINX Gateway Fabric install.
            # (NGINX Gateway Fabric does not support annotations.)
            nginxGatewayFabric:
                snippets: false

        # PostgreSQL service and secret, kept under global so subcharts (authup) can read
        # them: Helm shares only `global` into a subchart's values.
        postgresql:
            # Service host. Not release-scoped (goharbor cannot derive the release name).
            # keep in sync with harbor.database.external.host
            host: "postgresql"
            # Name of the chart-managed Secret (created when existingSecret is empty).
            # Override per-release only for multiple installs in one namespace.
            secretName: "flame-hub-pg"
            # Bring your own Secret instead: set this to its name and the chart will not
            # create one, it only reads yours (must contain both "username" and "password"
            # keys; goharbor hardcodes "password"). Everything that reads the Secret — hub
            # workloads and the authup subchart follow this automatically.
            # Keep in sync with harbor.database.external.existingSecret
            existingSecret: ""

image:
    registry: ghcr.io
    repository: privateaim/hub
    tag: 0.13.1
    pullPolicy: Always

# internal services
clientUI:
    replicaCount: 3
    publicHttps: false # global.flameHub.publicHttps also enables this
    cookieDomain: ""
    # service specific ingress configuration. If you use this, you will need a separate domain for each service
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        className: ""
        annotations: {}
    # Per-service gateway API route. Set hostname to override the global default.
    # For path-based routing, use the default paths below. For domain-based, set hostname and path: "/".
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/"

serverCore:
    publicHttps: false # global.flameHub.publicHttps also enables this
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        className: ""
        annotations: {}
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/core"
    env:
        masterImagesBranch: ""

serverMessenger:
    publicHttps: false # global.flameHub.publicHttps also enables this
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        className: ""
        annotations: {}
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/messenger"

serverStorage:
    publicHttps: false # global.flameHub.publicHttps also enables this
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        # Default annotations for ingress nginx (e.g. for large file uploads)
        # Replace or remove if you use a different ingress controller
        annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/storage"

serverTelemetry:
    publicHttps: false # global.flameHub.publicHttps also enables this
    ingress:
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
        # Default annotations for ingress nginx
        # Replace or remove if you use a different ingress controller
        annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
        # Annotations for the grafana sub-path ingress (rewrite-target)
        subPathAnnotations:
            nginx.ingress.kubernetes.io/rewrite-target: /$2
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/telemetry"
        grafanaPath: "/grafana"

serverCoreWorker:
    enabled: true
    # Use a docker-in-docker sidecar container instead of mounting the docker socket from the host
    useSidecarDinD: true
    persistence:
        size: "100Gi"
        # See /charts/third-party/openebs for details
        # storageClass: "mayastor-replicated"

# Credentials configuration
auth:
    # Name of the secret containing all credentials
    # IMPORTANT: If you change this value, you must also update the subchart configurations to match.
    # This is because subcharts have their own existingSecret fields that cannot be templated, unfortunately.
    secretName: "flame-hub-auth"

    # Advanced: Use your own secret instead of auto-generated one, takes precedence over secretName
    # IMPORTANT:If you set this, you must also update the subchart configurations below to point to your secret!
    existingSecret: ""

## Dependencies / Subcharts

# Authentication Provider
authup:
    publicHttps: false # global.flameHub.publicHttps also enables this
    # Rendered via tpl in the authup subchart context, so these follow the global.
    # no need to edit them alongside the pg values.
    database:
        host: '{{ include "flameHub.postgresql.host" . }}'
        existingSecret: '{{ include "flameHub.postgresql.secretName" . }}'
    # Trusted first-party application origins (redirect allowlist for the web client; not CORS).
    # Accepts a comma-separated string or list; bare hosts expand to both http and https origins.
    # The value is rendered as a Helm template inside the authup subchart context.
    # Defaults to the public domain of the Hub UI (derived from the global ingress/gatewayApi hostname).
    # If the client UI uses its own hostname (per-service routing), set this explicitly.
    trustedOrigins: '{{- if or .Values.global.flameHub.ingress.enabled .Values.global.flameHub.gatewayApi.enabled }}{{ include "flameHub.uiDomain" . }}{{- end }}'
    image:
        repository: "authup/authup"
        tag: "1.0.0-beta.59"
        pullPolicy: "Always"
    # Declaratively provision the FLAME permission taxonomy and the analyst/diz global
    # roles into authup at boot. The content is rendered by
    # templates/authup/provisioning-configmap.yaml and mounted by the authup subchart.
    provisioning:
        enabled: true
        existingConfigMap: '{{ .Release.Name }}-authup-provisioning'
    auth:
        existingSecret: "flame-hub-auth"

        # Default Password for the FLAME Hub Admin User
        adminPassword: "" # Leave empty for auto-generation

        # Default secret for the FLAME Hub System Client
        clientSecret: "" # Leave empty for auto-generation
    ingress:
        enabled: false
        hostname: ""
        className: ""
        annotations:
            nginx.ingress.kubernetes.io/proxy-buffer-size: "256k"
            nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
            nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "512k"
    gatewayApi:
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        hostname: "" # empty = global.flameHub.gatewayApi.hostname
        path: "/auth"

rabbitmq:
    nameOverride: "rabbitmq"
    auth:
        username: "root"
        password: "" # Leave empty for auto-generation
        existingPasswordSecret: "flame-hub-auth"
        existingSecretPasswordKey: "rabbitmq-password"
    image:
        #repository: "tada5hi/rabbitmq"
        repository: "bitnamilegacy/rabbitmq"
        tag: "4.1.3-debian-12-r1"
    # See /charts/third-party/openebs for details
    # persistence:
    #     storageClass: "mayastor-replicated"
redis:
    nameOverride: "redis"
    startupProbe:
        failureThreshold: 15
    readinessProbe:
        failureThreshold: 10
    auth:
        enabled: true
        password: "" # Leave empty for auto-generation
        existingSecret: "flame-hub-auth"
        existingSecretPasswordKey: "redis-password"
    image:
        #repository: "tada5hi/redis"
        repository: "bitnamilegacy/redis"
        tag: "8.2.1-debian-12-r0"
    # See /charts/third-party/openebs for details
    # master:
    #     persistence:
    #         storageClass: "mayastor-replicated"

# seaweedfs is the S3 object store used by server-storage.
# S3 admin credentials are auto-generated into the "<release>-seaweedfs-s3-secret" Secret
# and preserved across upgrades.
seaweedfs:
    global:
        seaweedfs:
            # The ServiceAccount is the subchart's only resource whose name is not derived
            # from the release name. When running multiple flame-hub instances in the same
            # namespace, set a unique name per instance.
            serviceAccountName: "seaweedfs"
            createClusterRole: false
    # Run everything in a single pod and disable the standalone components.
    master:
        enabled: false
        volumeSizeLimitMB: 2000
    volume:
        enabled: false
        # allInOne sources its -volume.max flag from the FIRST dataDir's maxVolumes. Each S3
        # bucket becomes its own SeaweedFS collection needing >=1 volume
        # Only maxVolumes is consumed here (the allInOne data PVC lives under allInOne.data)
        # The default SeaweedFS Chart values have a similar default "data1"-item
        dataDirs:
            - name: data1
              type: "custom"      # allInOne only reads maxVolumes below; this provisions no storage
              maxVolumes: 5000
    filer:
        enabled: false
    s3:
        # The all-in-one pod serves S3 itself; keep the standalone S3 gateway disabled.
        enabled: false
        # Required so the subchart generates the S3 credentials Secret.
        enableAuth: true
        # Name of an existing Secret with the S3 credentials to use instead of the generated one.
        # It must contain the keys admin_access_key_id and admin_secret_access_key (URL-safe
        # values, they are embedded in a connection string) and seaweedfs_s3_config.
        existingConfigSecret: ""
    allInOne:
        enabled: true
        # The subchart defaults to hard pod anti-affinity (at most one all-in-one pod per
        # node). With a single replica the rule has no effect.
        affinity: ""
        s3:
            enabled: true
            enableAuth: true
        data:
            type: persistentVolumeClaim
            size: 10Gi
            # See /charts/third-party/openebs for details
            # storageClass: "mayastor-replicated"

postgresql:
    image:
        repository: "postgres"
        tag: "17.6"
        pullPolicy: "IfNotPresent"
    auth:
        # Superuser the services authenticate as
        username: "postgres"
        postgresPassword: "" # Leave empty for auto-generation
        # The Secret name and the bring-your-own option live under
        # global.flameHub.postgresql; only the password override is here.
    # Application databases created on first initialisation only (empty data dir).
    # registry is consumed by Harbor; core/storage/telemetry/auth by the FLAME services.
    databases:
        - core
        - storage
        - telemetry
        - auth
        - registry
    service:
        # Host and Secret name are under global.flameHub.postgresql. Only the port is here.
        port: 5432
    persistence:
        size: 16Gi
        # See /charts/third-party/openebs for details
        # storageClass: "mayastor-replicated"
    # Extra flags passed to the postgres server process (mirrors the previous
    # max_connections tuning).
    extraArgs:
        - "-c"
        - "max_connections=1024"
    podSecurityContext:
        fsGroup: 999
    resources: {}

grafana:
    nameOverride: "grafana"
    image:
        #repository: "tada5hi/grafana"
        repository: "bitnamilegacy/grafana"
        tag: "12.1.1-debian-12-r1"
    admin:
        password: "" # Leave empty for auto-generation
        existingSecret: "flame-hub-auth"
        existingSecretPasswordKey: "grafana-admin-password"
    dashboardsProvider:
        enabled: true
    datasources:
        secretName: grafana-datasources
    config:
        useGrafanaIniFile: true
        grafanaIniConfigMap: grafana
    grafana:
        updateStrategy:
            type: Recreate
        extraEnvVars:
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: "victoriametrics-logs-datasource@0.27.1@https://github.com/VictoriaMetrics/victorialogs-datasource/releases/download/v0.27.1/victoriametrics-logs-datasource-v0.27.1.zip"
    # See /charts/third-party/openebs for details
    # persistence:
    #     storageClass: "mayastor-replicated"

victoria-logs-cluster:
    nameOverride: "victoria-logs"
    vlstorage:
        retentionPeriod: "100y"
        retentionDiskSpaceUsage: "50GiB"

prometheus:
    nameOverride: "prometheus"
    alertmanager:
        image:
            #repository: "tada5hi/alertmanager"
            repository: "bitnamilegacy/alertmanager"
            tag: "0.28.1-debian-12-r15"
        service:
            type: ClusterIP
    server:
        replicaCount: 2
        service:
            type: ClusterIP
            ports:
                http: 9090
        image:
            #repository: "tada5hi/prometheus"
            repository: "bitnamilegacy/prometheus"
            tag: "3.5.0-debian-12-r3"
        configuration: |
            scrape_configs:
              - job_name: flame-hub-server-core
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-core:3000"]
              - job_name: flame-hub-server-messenger
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-messenger:3000"]
              - job_name: flame-hub-server-storage
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-storage:3000"]
              - job_name: flame-hub-server-telemetry
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-telemetry:3000"]
              - job_name: authup-server-core
                static_configs:
                  - targets: ["{{ .Release.Name }}-authup-server-core:3000"]


# IMPORTANT: the goharbor subchart does NOT evaluate Helm templates in its values, so the
# few names that need to reference the release must be set as literal strings, and
# overridden per-release when the release name is not "flame-hub" (e.g. "hub" on hub-dev):
#   - harbor.expose.clusterIP.name          -> the in-cluster Harbor service (harbor.internalHost reads it)
#   - harbor.database.external.host         -> must equal global.flameHub.postgresql.host ("postgresql")
#   - harbor.database.external.existingSecret -> must equal the effective global.flameHub.postgresql
#                                                secret (existingSecret or secretName, e.g. "flame-hub-pg")
#   - harbor.existingSecretAdminPassword      -> must equal the effective harbor secret (existingSecret
#   - harbor.existingSecretSecretKey             or secretName below, e.g. "flame-hub-harbor")
harbor:
    enabled: true
    adminUsername: "admin"
    # Harbor's own credentials Secret (admin password, core secretKey, connection string),
    # created by templates/harbor/secret.yaml.
    secretName: "flame-hub-harbor"
    # Bring your own Secret instead: set this and the chart won't create one, it only reads
    # yours (keys: harbor-admin-password, secretKey, harbor-connection-string). If set, update
    # the two existingSecret* literals below to match.
    existingSecret: ""
    # Seeds harbor-admin-password in the harbor secret
    adminPassword: ""
    # Optional: pin the 16-char core secretKey (empty -> generate-and-keep, or carry over an
    # existing value on upgrade). Prefer leaving empty and pre-seeding the Secret.
    secretKey: ""
    # goharbor's own admin-password key; unused because existingSecretAdminPassword is set,
    # but kept empty so goharbor does not mint a second, different password.
    harborAdminPassword: ""
    existingSecretAdminPassword: "flame-hub-harbor"
    existingSecretAdminPasswordKey: "harbor-admin-password"
    # goharbor mounts this Secret's "secretKey" key as the core encryption key. Must equal the
    # effective harbor secret name.
    existingSecretSecretKey: "flame-hub-harbor"
    externalURL: "" # Required by Harbor, e.g. https://harbor.hub.local
    ingress:
        enabled: true # Harbor always needs its own hostname/domain, even when global path-based ingress is enabled
        className: ""
        # Default annotations for ingress nginx
        # Replace or remove if you use a different ingress controller
        annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
            nginx.ingress.kubernetes.io/upstream-vhost: '{{ include "harbor.host" . }}'
    gatewayApi:
        # hostname is taken from externalURL
        # no option to set path, as harbor does not support it
        enabled: false # global.flameHub.gatewayApi.enabled also enables this
        tls:
            enabled: false
            mode: "Terminate"
            certificateRef: ""
            certificateRefNamespace: "" # optional override; defaults to global.flameHub.gatewayApi.tls.certificateRefNamespace
    # --- goharbor subchart values ---
    # Expose Harbor as an in-cluster ClusterIP service with its own self-signed TLS.
    # External access is handled by the flame-hub ingress / gatewayApi blocks above.
    expose:
        type: clusterIP
        tls:
            enabled: true
            certSource: auto
            auto:
                commonName: harbor.local
        clusterIP:
            # Literal service name (the subchart cannot template this).
            # Override to "<release>-harbor" per release.
            name: "harbor"
            ports:
                httpsPort: 443
    updateStrategy:
        type: Recreate
    persistence:
        enabled: true
        resourcePolicy: keep
        persistentVolumeClaim:
            registry:
                existingClaim: ""
                size: 5Gi
                # See /charts/third-party/openebs for details
                # storageClass: "mayastor-replicated"
            jobservice:
                jobLog:
                    existingClaim: ""
                    size: 1Gi
            trivy:
                existingClaim: ""
                size: 5Gi
    registry:
        relativeurls: true # Needed for server-core-worker because of TCP forwarding (see https://github.com/distribution/distribution/issues/970#issuecomment-284227065)
    # Use the shared cluster PostgreSQL, not Harbor's bundled database.
    database:
        type: external
        external:
            # Literal service name (goharbor cannot template this). Must equal
            # global.flameHub.postgresql.host; override per-release if that changes.
            host: "postgresql"
            port: "5432"
            username: "postgres"
            coreDatabase: "registry"
            # goharbor requires the key in this secret to be literally "password".
            # The self-hosted postgres chart (templates/postgresql/secret.yaml) already
            # stores the credential under that key, so Harbor reads it directly — no
            # mirror secret needed. Must equal the effective global.flameHub.postgresql
            # secret (existingSecret or secretName).
            existingSecret: "flame-hub-pg"
            sslmode: "disable"
    # Harbor's own bundled Redis (the app-level redis subchart is separate).
    redis:
        type: internal

# In-cluster Harbor access proxy — LOCAL DEV ONLY.
#
# The server-core and server-core-worker pods must reach Harbor at the hostname on its TLS
# certificate (harbor.externalURL). In real deployments Harbor is published at that hostname
# over public DNS + valid HTTPS, so the pods talk to it directly — leave this disabled.
#
# On a local cluster (e.g. k3s with values_local) Harbor has no public DNS and only a
# self-signed cert, so the hostname is unreachable from inside the pod. Enabling this adds,
# to both server-core and server-core-worker:
#   - a hostAlias mapping harbor.host -> 127.0.0.1,
#   - a socat sidecar that forwards 127.0.0.1:443 to the in-cluster Harbor service, and
#   - the --insecure-registry flag on the core-worker's docker-in-docker daemon.
# It has no effect when externalHarbor.enabled is true (that Harbor is already external).
harborProxy:
    enabled: false

externalHarbor:
    enabled: false
    URL: ""
