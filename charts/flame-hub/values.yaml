global:
    imagePullPolicy: "IfNotPresent"

    redis:
        password: "start123"

    flameHub:
        ingress:
            enabled: true
            ssl: false
            hostname: "hub.local"

image:
    registry: ghcr.io
    repository: privateaim/hub
    tag: latest
    pullPolicy: Always

# internal services
clientUI:
    cookieDomain: ""
    ingress:
        enabled: false
        hostname: "hub.local"
        path: "/"
        pathType: "Prefix"

authup:
    ingress:
        enabled: false
        hostname: ""
        ssl: false

serverCore:
    ingress:
        ssl: false
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"
    env:
        masterImagesBranch: ""

serverMessenger:
    ingress:
        ssl: false
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"

serverStorage:
    ingress:
        ssl: false
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"

serverTelemetry:
    ingress:
        ssl: false
        enabled: false
        hostname: ""
        path: "/"
        pathType: "Prefix"

## services
vault:
    server:
        enabled: true
        dev:
            enabled: true
            devRootToken: start123
rabbitmq:
    nameOverride: "rabbitmq"
    auth:
        username: "root"
        password: "start123"
    image:
        #repository: "tada5hi/rabbitmq"
        repository: "bitnamilegacy/rabbitmq"
        tag: "4.1.3-debian-12-r1"
redis:
    nameOverride: "redis"
    auth:
        enabled: true
    image:
        #repository: "tada5hi/redis"
        repository: "bitnamilegacy/redis"
        tag: "8.2.1-debian-12-r0"

minio:
    nameOverride: "minio"
    image:
        #repository: "tada5hi/minio"
        repository: "bitnamilegacy/minio"
        tag: "2025.7.23-debian-12-r3"
    auth:
        rootUser: "admin"
        rootPassword: "start123"
    console:
        image:
            #repository: "tada5hi/minio-object-browser"
            repository: "bitnamilegacy/minio-object-browser"
            tag: "2.0.2-debian-12-r3"
mysql:
    nameOverride: "mysql"
    image:
        #repository: "tada5hi/mysql"
        repository: "bitnamilegacy/mysql"
        tag: "9.4.0-debian-12-r1"
    auth:
        rootPassword: "start123"
        replicationPassword: "start123"
    secondary:
        persistence:
            enabled: true
            size: 16Gi
        replicaCount: 2
    primary:
        persistence:
            enabled: true
            size: 16Gi
    architecture: "replication"

grafana:
    nameOverride: "grafana"
    image:
        #repository: "tada5hi/grafana"
        repository: "bitnamilegacy/grafana"
        tag: "12.1.1-debian-12-r1"
    admin:
        password: "start123"
    dashboardsProvider:
        enabled: true
    datasources:
        secretName: grafana-datasources
    config:
        useGrafanaIniFile: true
        grafanaIniConfigMap: grafana

grafana-loki:
    nameOverride: "loki"
    loki:
        image:
            #repository: "tada5hi/grafana-loki"
            repository: "bitnamilegacy/grafana-loki"
            tag: "3.5.3-debian-12-r2"
        overrideConfiguration:
            limits_config:
                deletion_mode: "filter-and-delete"
    gateway:
        image:
            #repository: "tada5hi/nginx"
            repository: "bitnamilegacy/nginx"
            tag: "1.29.1-debian-12-r0"
    memcachedfrontend:
        image:
            repository: "bitnamilegacy/memcached"
            tag: "1.6.39-debian-12-r0"
    memcachedchunks:
        image:
            repository: "bitnamilegacy/memcached"
            tag: "1.6.39-debian-12-r0"
    grafanaalloy:
        alloy:
            image:
                repository: "bitnamilegacy/grafana-alloy"
                tag: "1.10.1-debian-12-r1"
        configReloader:
            image:
                repository: "bitnamilegacy/configmap-reload"
                tag: "0.15.0-debian-12-r12"

prometheus:
    nameOverride: "prometheus"
    alertmanager:
        image:
            #repository: "tada5hi/alertmanager"
            repository: "bitnamilegacy/alertmanager"
            tag: "0.28.1-debian-12-r15"
        service:
            type: ClusterIP
    server:
        replicaCount: 2
        service:
            type: ClusterIP
            ports:
                http: 9090
        image:
            #repository: "tada5hi/prometheus"
            repository: "bitnamilegacy/prometheus"
            tag: "3.5.0-debian-12-r3"
        configuration: |
            scrape_configs:
              - job_name: flame-hub-server-core
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-core:3000"]
              - job_name: flame-hub-server-messenger
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-messenger:3000"]
              - job_name: flame-hub-server-storage
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-storage:3000"]
              - job_name: flame-hub-server-telemetry
                static_configs:
                  - targets: ["{{ .Release.Name }}-flame-hub-server-telemetry:3000"]
              - job_name: authup-server-core
                static_configs:
                  - targets: ["{{ .Release.Name }}-authup-server-core:3000"]

harbor:
    enabled: true
    nameOverride: "harbor"
    adminPassword: "start123"
    exposureType: "none"
    externalURL: http://hub.local/harbor
    migration:
        enabled: false
    nginx:
        enabled: false
    portal:
        secret: "start123"
        image:
            #repository: "tada5hi/harbor-portal"
            repository: "bitnamilegacy/harbor-portal"
            tag: "2.13.2-debian-12-r1"
    core:
        secret: "start123"
        xsrfKey: "start123"
        csrfKey: "start123"
        secretKey: "start123"
        image:
            #repository: "tada5hi/harbor-core"
            repository: "bitnamilegacy/harbor-core"
            tag: "2.13.2-debian-12-r3"
    jobservice:
        secret: "start123"
        image:
            #repository: "tada5hi/harbor-jobservice"
            repository: "bitnamilegacy/harbor-jobservice"
            tag: "2.13.2-debian-12-r3"
    registry:
        secret: "start123"
        server:
            image:
                #repository: "tada5hi/harbor-registry"
                repository: "bitnamilegacy/harbor-registry"
                tag: "2.13.2-debian-12-r2"
        controller:
            image:
                #repository: "tada5hi/harbor-registryctl"
                repository: "bitnamilegacy/harbor-registryctl"
                tag: "2.13.2-debian-12-r3"
    trivy:
        image:
            #repository: "tada5hi/harbor-adapter-trivy"
            repository: "bitnamilegacy/harbor-adapter-trivy"
            tag: "2.13.2-debian-12-r2"
    postgresql:
        image:
            repository: "bitnamilegacy/postgresql"
            tag: "13.7.0-debian-11-r9"
    redis:
        enabled: false
    externalRedis:
        host: "hub-redis-master.default.svc.cluster.local"
        port: 6379
        password: "start123"
        coreDatabaseIndex: "0"
        jobserviceDatabaseIndex: "1"
        registryDatabaseIndex: "2"
        trivyAdapterDatabaseIndex: "5"
