{{- if or .Values.global.flameHub.gatewayApi.enabled .Values.serverMessenger.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ .Release.Name }}-flame-hub-server-messenger
spec:
    parentRefs:
{{- include "flame-hub.gateway.parentRefs" . | nindent 8 }}
    hostnames:
        - {{ .Values.serverMessenger.gatewayApi.hostname | default .Values.global.flameHub.gatewayApi.hostname | quote }}
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: {{ .Values.serverMessenger.gatewayApi.path }}
          {{- if ne .Values.serverMessenger.gatewayApi.path "/" }}
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
          {{- end }}
          backendRefs:
            - name: {{ .Release.Name }}-flame-hub-server-messenger
              port: 3000
{{- end }}
