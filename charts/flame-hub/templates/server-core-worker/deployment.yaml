apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-flame-hub-server-core-worker"
  labels:
    app: "{{ .Release.Name }}-flame-hub-server-core-worker"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-flame-hub-server-core-worker"
  template:
    metadata:
      name: "{{ .Release.Name }}-flame-hub-server-core-worker"
      labels:
        app: "{{ .Release.Name }}-flame-hub-server-core-worker"
        appGroup: "{{ .Release.Name }}-flame-hub"
    spec:
      restartPolicy: Always
      {{- $ingressIP := include "flameHub.ingressControllerIP" . }}
      {{- if and $ingressIP (include "harbor.host" .) }}
      hostAliases:
        - ip: {{ $ingressIP | quote }}
          hostnames:
            - {{ include "harbor.host" . | quote }}
      {{- end }}
      initContainers:
          -   name: wait-for-rabbitmq
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-rabbitmq 5672; do echo "Waiting for rabbitmq..."; sleep 5; done'
              ]
          -   name: wait-for-vault
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-vault 8200; do echo "Waiting for vault..."; sleep 5; done'
              ]
          -   name: wait-for-authup
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-authup-server-core 3000; do echo "Waiting for authup..."; sleep 5; done'
              ]
          -   name: wait-for-harbor
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until wget --no-check-certificate -qO- {{ include "harbor.baseURL" . }}/api/v2.0/ping; do echo "Waiting for harbor..."; sleep 5; done'
              ]
      containers:
        - name: "{{ .Release.Name }}-flame-hub-server-core-worker"
          image: {{ include "flameHub.image" . | trim | quote }}
          args: ['core-worker', 'start']
          imagePullPolicy: {{ .Values.image.pullPolicy | trim | quote }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
              -   name: REDIS_CONNECTION_STRING
                  value: "redis://default:{{ .Values.global.redis.password }}@{{ .Release.Name }}-redis-master"
              -   name: VAULT_CONNECTION_STRING
                  value: "start123@http://{{ .Release.Name }}-vault:8200/v1/"
              -   name: RABBITMQ_CONNECTION_STRING
                  value: "amqp://root:start123@{{ .Release.Name }}-rabbitmq"
              -   name: AUTHUP_URL
                  value: "http://{{ .Release.Name }}-authup-server-core:3000/"
              -   name: CORE_URL
                  value: "http://{{ .Release.Name }}-flame-hub-server-core:3000/"
              -   name: STORAGE_URL
                  value: "http://{{ .Release.Name }}-flame-hub-server-storage:3000/"
          {{- if .Values.serverCoreWorker.useSidecarDinD }}
          volumeMounts:
              -   name: "{{ .Release.Name }}-docker-sidecar-socket"
                  mountPath: /var/run
          {{- else }}
          volumeMounts:
              -   mountPath: "/var/run/docker.sock"
                  name: "{{ .Release.Name }}-flame-hub-server-core-worker-docker-volume"
          securityContext:
              privileged: true
          {{- end }}
          readinessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              initialDelaySeconds: 60
              periodSeconds: 5
              timeoutSeconds: 10
          livenessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 10
              timeoutSeconds: 10
        {{- if .Values.serverCoreWorker.useSidecarDinD }}
        - name: "{{ .Release.Name }}-docker-sidecar-dind"
          image: "docker:28-dind"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: "{{ .Release.Name }}-docker-sidecar-graph-storage"
              mountPath: /var/lib/docker
            - name: "{{ .Release.Name }}-harbor-ca"
              mountPath: /etc/docker/certs.d/{{ include "harbor.host" . }}/ca.crt
              subPath: ca.crt
            - name: "{{ .Release.Name }}-docker-sidecar-socket"
              mountPath: /var/run
        {{- else }}
          volumeMounts:
            - name: "{{ .Release.Name }}-docker-sidecar-graph-storage"
              mountPath: /var/lib/docker
            - name: "{{ .Release.Name }}-docker-sidecar-socket"
              mountPath: /var/run
        {{- end }}
      volumes:
          {{- if .Values.serverCoreWorker.useSidecarDinD }}
          - name: "{{ .Release.Name }}-docker-sidecar-graph-storage"
            emptyDir: {}
          - name: "{{ .Release.Name }}-docker-sidecar-socket"
            emptyDir: {}
          {{- if .Values.serverCoreWorker.caCrtSecretName }}
          - name: "{{ .Release.Name }}-harbor-ca"
            secret:
              secretName: {{ .Values.serverCoreWorker.caCrtSecretName | quote }}
              items:
                - key: ca.crt
                  path: ca.crt
          {{- end }}
          {{- else }}
          -   name: "{{ .Release.Name }}-flame-hub-server-core-worker-docker-volume"
              hostPath:
                  path: "/var/run/docker.sock"
                  type: "Socket"
          {{- end }}

      


