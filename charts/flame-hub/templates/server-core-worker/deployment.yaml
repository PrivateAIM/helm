apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-flame-hub-server-core-worker"
  labels:
    app: "{{ .Release.Name }}-flame-hub-server-core-worker"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-flame-hub-server-core-worker"
  template:
    metadata:
      name: "{{ .Release.Name }}-flame-hub-server-core-worker"
      labels:
        app: "{{ .Release.Name }}-flame-hub-server-core-worker"
        appGroup: "{{ .Release.Name }}-flame-hub"
    spec:
      restartPolicy: Always
      {{- with .Values.serverCoreWorker.harbor }}
      {{- if and .hostAliases .hostAliases.enabled }}
      hostAliases:
        - ip: {{ .hostAliases.ip | quote }}
          hostnames:
          {{- range $h := .hostAliases.hostnames }}
            - {{ $h | quote }}
          {{- end }}
      {{- end }}
      {{- end }}
      initContainers:
          -   name: wait-for-rabbitmq
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-rabbitmq 5672; do echo "Waiting for rabbitmq..."; sleep 5; done'
              ]
          -   name: wait-for-vault
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-vault 8200; do echo "Waiting for vault..."; sleep 5; done'
              ]
          -   name: wait-for-authup
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-authup-server-core 3000; do echo "Waiting for authup..."; sleep 5; done'
              ]
      containers:
        - name: "{{ .Release.Name }}-flame-hub-server-core-worker"
          image: {{ include "flameHub.image" . | trim | quote }}
          args: ['core-worker', 'start']
          imagePullPolicy: {{ .Values.image.pullPolicy | trim | quote }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
              -   name: REDIS_CONNECTION_STRING
                  value: "redis://default:{{ .Values.global.redis.password }}@{{ .Release.Name }}-redis-master"
              -   name: VAULT_CONNECTION_STRING
                  value: "start123@http://{{ .Release.Name }}-vault:8200/v1/"
              -   name: RABBITMQ_CONNECTION_STRING
                  value: "amqp://root:start123@{{ .Release.Name }}-rabbitmq"
              -   name: AUTHUP_URL
                  value: "http://{{ .Release.Name }}-authup-server-core:3000/"
              -   name: CORE_URL
                  value: "http://{{ .Release.Name }}-flame-hub-server-core:3000/"
              -   name: STORAGE_URL
                  value: "http://{{ .Release.Name }}-flame-hub-server-storage:3000/"
          {{- if and .Values.serverCoreWorker.harbor .Values.serverCoreWorker.harbor.useSidecarDinD }}
              -   name: DOCKER_HOST
                  value: "unix:///var/run/docker.sock"
          {{- end }}
          {{- if and .Values.serverCoreWorker.harbor .Values.serverCoreWorker.harbor.useSidecarDinD }}
          volumeMounts:
              -   name: docker-socket
                  mountPath: /var/run
          {{- else }}
          volumeMounts:
              -   mountPath: "/var/run/docker.sock"
                  name: "{{ .Release.Name }}-flame-hub-server-core-worker-docker-volume"
          securityContext:
              privileged: true
          {{- end }}
          readinessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              initialDelaySeconds: 60
              periodSeconds: 5
              timeoutSeconds: 10
          livenessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 10
              timeoutSeconds: 10
        {{- if and .Values.serverCoreWorker.harbor .Values.serverCoreWorker.harbor.useSidecarDinD }}
        # Docker-in-Docker sidecar to allow Harbor TLS trust via mounted CA
        - name: docker-dind
          image: "docker:27.3-dind"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          {{- with .Values.serverCoreWorker.harbor }}
          {{- if .caCrtSecretName }}
          command: ["/bin/sh","-c"]
          args:
            - >-
              update-ca-certificates || true;
              exec /usr/local/bin/dockerd-entrypoint.sh;
          volumeMounts:
            - name: docker-graph-storage
              mountPath: /var/lib/docker
            - name: harbor-ca
              mountPath: /usr/local/share/ca-certificates/harbor-ca.crt
              subPath: ca.crt
            - name: docker-socket
              mountPath: /var/run
          {{- else }}
          volumeMounts:
            - name: docker-graph-storage
              mountPath: /var/lib/docker
            - name: docker-socket
              mountPath: /var/run
          {{- end }}
          {{- end }}
        {{- end }}
      volumes:
          {{- if and .Values.serverCoreWorker.harbor .Values.serverCoreWorker.harbor.useSidecarDinD }}
          - name: docker-graph-storage
            emptyDir: {}
          - name: docker-socket
            emptyDir: {}
          {{- with .Values.serverCoreWorker.harbor }}
          {{- if .caCrtSecretName }}
          - name: harbor-ca
            secret:
              secretName: {{ .caCrtSecretName | quote }}
              items:
                - key: ca.crt
                  path: ca.crt
          {{- end }}
          {{- end }}
          {{- else }}
          -   name: "{{ .Release.Name }}-flame-hub-server-core-worker-docker-volume"
              hostPath:
                  path: "/var/run/docker.sock"
                  type: "Socket"
          {{- end }}

      


