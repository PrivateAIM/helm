apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-flame-hub-server-core-worker"
  labels:
    app: "{{ .Release.Name }}-flame-hub-server-core-worker"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-flame-hub-server-core-worker"
  template:
    metadata:
      name: "{{ .Release.Name }}-flame-hub-server-core-worker"
      labels:
        app: "{{ .Release.Name }}-flame-hub-server-core-worker"
        appGroup: "{{ .Release.Name }}-flame-hub"
    spec:
      restartPolicy: Always
      {{- if and (include "flameHub.harborProxy.enabled" .) (include "harbor.host" .) }}
      # Local-dev only (harborProxy.enabled): route Harbor's public hostname to the socat sidecar.
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - {{ include "harbor.host" . | quote }}
      {{- end }}
      initContainers:
          -   name: wait-for-rabbitmq
              image: busybox:1.38
              imagePullPolicy: IfNotPresent
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-rabbitmq 5672; do echo "Waiting for rabbitmq..."; sleep 5; done'
              ]
          -   name: wait-for-authup
              image: busybox:1.38
              imagePullPolicy: IfNotPresent
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-authup-server 3000; do echo "Waiting for authup..."; sleep 5; done'
              ]
          {{- if include "harbor.internalHost" . }}
          -   name: wait-for-harbor
              image: busybox:1.38
              imagePullPolicy: IfNotPresent
              command: [
                  'sh',
                  '-c',
                  'until wget --no-check-certificate -qO- https://{{ include "harbor.internalHost" . }}/api/v2.0/ping; do echo "Waiting for harbor..."; sleep 5; done'
              ]
        {{- end }}
      containers:
        - name: "{{ .Release.Name }}-flame-hub-server-core-worker"
          image: {{ include "flameHub.image" . | trim | quote }}
          args: ['core-worker', 'start']
          imagePullPolicy: {{ .Values.image.pullPolicy | trim | quote }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "flameHub.effectiveSecretName" .  }}
                  key: redis-connection-string
            - name: RABBITMQ_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "flameHub.effectiveSecretName" .  }}
                  key: rabbitmq-connection-string
            - name: AUTHUP_URL
              value: "http://{{ .Release.Name }}-authup-server:3000/"
            - name: CORE_URL
              value: "http://{{ .Release.Name }}-flame-hub-server-core:3000/"
            - name: STORAGE_URL
              value: "http://{{ .Release.Name }}-flame-hub-server-storage:3000/"
            - name: CLIENT_ID
              value: "system"
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "flameHub.effectiveSecretName" .  }}
                  key: authup-client-secret
            - name: REALM
              value: "master"
          {{- if .Values.serverCoreWorker.useSidecarDinD }}
          volumeMounts:
              -   name: "{{ .Release.Name }}-docker-sidecar-socket"
                  mountPath: /var/run
              -   name: "{{ .Release.Name }}-flame-hub-server-core-worker"
                  mountPath: /usr/src/project/apps/server-core-worker/writable
                  subPath: project
          {{- else }}
          volumeMounts:
              -   mountPath: "/var/run/docker.sock"
                  name: "{{ .Release.Name }}-flame-hub-server-core-worker-docker-volume"
              -   name: "{{ .Release.Name }}-flame-hub-server-core-worker"
                  mountPath: /usr/src/project/apps/server-core-worker/writable
                  subPath: project
          securityContext:
              privileged: true
          {{- end }}
          startupProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 5
              failureThreshold: 60
          readinessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 5
              timeoutSeconds: 10
          livenessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 10
              timeoutSeconds: 10
        {{ if include "flameHub.harborProxy.enabled" . -}}
        # Local-dev only (harborProxy.enabled): forward the aliased Harbor hostname to the
        # in-cluster Harbor service. Real deployments reach Harbor at its public URL directly.
        - name: harbor-proxy-sidecar
          image: alpine/socat
          args: ["TCP-LISTEN:443,fork,bind=127.0.0.1", "TCP:{{ include "harbor.internalHost" . }}:443"]
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
        {{- end }}
        {{- if .Values.serverCoreWorker.useSidecarDinD }}
        - name: "{{ .Release.Name }}-docker-sidecar-dind"
          image: "docker:28-dind"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          # Microk8s Calico CNI defaults to 1400 MTU, but dind defaults to 1500.
          # This might be different on other k8s providers. If you get mysterious connection errors, check your MTU.
          {{- if and (include "flameHub.harborProxy.enabled" .) (include "harbor.host" .) }}
          # Local-dev only: the local Harbor serves a self-signed cert via the in-cluster
          # proxy, so the docker daemon must treat it as an insecure registry. Real
          # deployments use Harbor's public URL with valid HTTPS and need no exception.
          args: ["--insecure-registry", "{{ include "harbor.host" . }}:443", "--mtu", "1350"]
          {{- else }}
          args: ["--mtu", "1350"]
          {{- end }}
          volumeMounts:
            - name: "{{ .Release.Name }}-flame-hub-server-core-worker"
              mountPath: /var/lib/docker
              subPath: dind
            - name: "{{ .Release.Name }}-docker-sidecar-socket"
              mountPath: /var/run
        {{- end }}
      volumes:
          - name: "{{ .Release.Name }}-flame-hub-server-core-worker"
            persistentVolumeClaim:
              claimName: "{{ .Release.Name }}-flame-hub-server-core-worker"
          {{- if .Values.serverCoreWorker.useSidecarDinD }}
          - name: "{{ .Release.Name }}-docker-sidecar-socket"
            emptyDir: {}
          {{- else }}
          -   name: "{{ .Release.Name }}-flame-hub-server-core-worker-docker-volume"
              hostPath:
                  path: "/var/run/docker.sock"
                  type: "Socket"
          {{- end }}
