apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flameHub.postgresql.bootstrapSecretName" . }}
  labels:
    {{- include "flame-hub.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: {{ include "flameHub.postgresql.postgresPassword" . | quote }}
