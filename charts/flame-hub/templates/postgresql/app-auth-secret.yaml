{{- $secretName := .Values.postgresql.auth.appAuthSecretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.postgresql.auth.postgresPassword | default "" -}}
{{- if and (not $password) $existing $existing.data (hasKey $existing.data "password") -}}
  {{- $password = index $existing.data "password" | b64dec -}}
{{- end -}}
{{- if not $password -}}
  {{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "flame-hub.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
  annotations:
    "helm.sh/resource-policy": keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.auth.appUsername | quote }}
  password: {{ $password | quote }}
