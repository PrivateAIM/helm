{{- if .Values.global.flameHub.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-flame-hub-gateway
  {{- if .Values.global.flameHub.gatewayApi.gateway.annotations }}
  annotations:
    {{- range $key, $value := .Values.global.flameHub.gatewayApi.gateway.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  gatewayClassName: {{ required "global.flameHub.gatewayApi.gateway.className is required when global.flameHub.gatewayApi.enabled=true" .Values.global.flameHub.gatewayApi.gateway.className }}
  listeners:
    - name: http
      hostname: {{ .Values.global.flameHub.gatewayApi.hostname | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.global.flameHub.gatewayApi.tls.enabled }}
    - name: https
      hostname: {{ .Values.global.flameHub.gatewayApi.hostname | quote }}
      protocol: HTTPS
      port: 443
      tls:
        mode: {{ .Values.global.flameHub.gatewayApi.tls.mode | default "Terminate" }}
        certificateRefs:
          - name: {{ required "global.flameHub.gatewayApi.tls.certificateRef is required when global.flameHub.gatewayApi.tls.enabled=true" .Values.global.flameHub.gatewayApi.tls.certificateRef }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
