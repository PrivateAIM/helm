{{- if .Values.authup.provisioning.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-authup-provisioning"
  labels:
    app: "{{ .Release.Name }}-authup-server-core"
data:
  flame-roles.yaml: |
    # Authup provisioning — FLAME Hub permission taxonomy + global roles (analyst, diz).
    #
    # Permission taxonomy mirrors PermissionName in @privateaim/kit (30 values), which
    # PrivateAIM/hub currently creates at runtime via REST (apps/server-core AuthupModule).
    # Provisioning them here lets authup own them declaratively at boot; the one value
    # that is already an authup built-in (event_read) is intentionally NOT redeclared.
    # Role -> permission bindings extracted from https://auth.staging.privateaim.net
    # (master realm) on 2026-07-15. All entities are global (realm_id: null).
    #
    # Loaded by authup server-core FileProvisioningSource from <WRITABLE_DIRECTORY_PATH>/provisioning/.
    # Default strategy is createOnly (non-destructive): entities are created if absent,
    # and role permission bindings are re-ensured on every boot. Realm reach = own.

    permissions:
      - attributes:
          name: event_create
      - attributes:
          name: event_delete
      - attributes:
          name: bucket_create
      - attributes:
          name: bucket_update
      - attributes:
          name: bucket_delete
      - attributes:
          name: log_create
      - attributes:
          name: log_delete
      - attributes:
          name: log_read
      - attributes:
          name: project_create
      - attributes:
          name: project_delete
      - attributes:
          name: project_update
      - attributes:
          name: project_approve
      - attributes:
          name: registry_manage
      - attributes:
          name: registry_project_manage
      - attributes:
          name: node_create
      - attributes:
          name: node_delete
      - attributes:
          name: node_update
      - attributes:
          name: analysis_approve
      - attributes:
          name: analysis_update
      - attributes:
          name: analysis_create
      - attributes:
          name: analysis_execution_start
      - attributes:
          name: analysis_execution_stop
      - attributes:
          name: analysis_delete
      - attributes:
          name: analysis_result_read
      - attributes:
          name: analysis_self_message_broker_use
      - attributes:
          name: analysis_self_storage_use
      - attributes:
          name: master_image_manage
      - attributes:
          name: master_image_group_manage
      - attributes:
          name: service_manage

    roles:
      - attributes:
          name: analyst
        relations:
          globalPermissionsRealmScope: own
          globalPermissions:
            - analysis_approve
            - analysis_create
            - analysis_delete
            - analysis_execution_start
            - analysis_execution_stop
            - analysis_result_read
            - analysis_self_message_broker_use
            - analysis_self_storage_use
            - analysis_update
            - bucket_update
            - project_approve
            - project_create
            - project_delete
            - project_update
            - user_self_manage
      - attributes:
          name: diz
        relations:
          globalPermissionsRealmScope: own
          globalPermissions:
            - client_read
            - client_update
            - node_create
            - node_delete
            - node_update
{{- end }}
