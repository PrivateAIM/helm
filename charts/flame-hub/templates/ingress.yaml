{{- if .Values.global.flameHub.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ .Release.Name }}-flame-hub-sub-paths
    annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
    rules:
        - host: {{ .Values.global.flameHub.ingress.hostname }}
          http:
              paths:
                  - path: /grafana(/|$)(.*)
                    pathType: "ImplementationSpecific"
                    backend:
                      service:
                        name: {{ .Release.Name }}-grafana
                        port:
                          number: 3000
                  - path: /core(/|$)(.*)
                    pathType: "ImplementationSpecific"
                    backend:
                        service:
                            name: {{ .Release.Name }}-flame-hub-server-core
                            port:
                                number: 3000
                  - path: /messenger(/|$)(.*)
                    pathType: "ImplementationSpecific"
                    backend:
                        service:
                            name: {{ .Release.Name }}-flame-hub-server-messenger
                            port:
                                number: 3000
                  - path: /storage(/|$)(.*)
                    pathType: "ImplementationSpecific"
                    backend:
                        service:
                            name: {{ .Release.Name }}-flame-hub-server-storage
                            port:
                                number: 3000
                  - path: /telemetry(/|$)(.*)
                    pathType: "ImplementationSpecific"
                    backend:
                      service:
                        name: {{ .Release.Name }}-flame-hub-server-telemetry
                        port:
                          number: 3000
                  - path: /auth(/|$)(.*)
                    pathType: "ImplementationSpecific"
                    backend:
                        service:
                            name: {{ .Release.Name }}-authup-server-core
                            port:
                                number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ .Release.Name }}-flame-hub-root-path
spec:
    rules:
        - host: {{ .Values.global.flameHub.ingress.hostname }}
          http:
              paths:
                  - path: /
                    pathType: "Prefix"
                    backend:
                        service:
                            name: {{ .Release.Name }}-flame-hub-client-ui
                            port:
                                number: 3000
                  - path: /v2
                    pathType: "ImplementationSpecific"
                    backend: {{- include "common.ingress.backend" (dict "serviceName" (include "harbor.core" .) "servicePort" "http" "context" $) | nindent 14 }}
{{- end }}
