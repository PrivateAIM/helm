apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: "{{ .Release.Name }}-redis"
    labels:
        app: "{{ .Release.Name }}-redis"
spec:
    serviceName: {{ include "flameHub.redis.host" . | quote }}
    replicas: 1
    selector:
        matchLabels:
            app: "{{ .Release.Name }}-redis"
    template:
        metadata:
            labels:
                app: "{{ .Release.Name }}-redis"
        spec:
            {{- with .Values.redis.podSecurityContext }}
            securityContext: {{- toYaml . | nindent 16 }}
            {{- end }}
            containers:
                -   name: redis
                    image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
                    imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
                    command:
                        - "redis-server"
                        - "--requirepass"
                        - "$(REDIS_PASSWORD)"
                        {{- with .Values.redis.extraArgs }}
                        {{- toYaml . | nindent 24 }}
                        {{- end }}
                    env:
                        -   name: REDIS_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: {{ include "flameHub.effectiveSecretName" . }}
                                    key: redis-password
                        # redis-cli picks this up automatically, so the probes need no -a flag.
                        -   name: REDISCLI_AUTH
                            valueFrom:
                                secretKeyRef:
                                    name: {{ include "flameHub.effectiveSecretName" . }}
                                    key: redis-password
                    ports:
                        -   name: redis
                            containerPort: 6379
                    readinessProbe:
                        exec:
                            command: ["redis-cli", "ping"]
                        initialDelaySeconds: 5
                        periodSeconds: 10
                        timeoutSeconds: 5
                        failureThreshold: 20
                    livenessProbe:
                        exec:
                            command: ["redis-cli", "ping"]
                        initialDelaySeconds: 15
                        periodSeconds: 10
                        timeoutSeconds: 5
                        failureThreshold: 6
                    {{- with .Values.redis.resources }}
                    resources: {{- toYaml . | nindent 24 }}
                    {{- end }}
                    volumeMounts:
                        -   name: data
                            mountPath: /data
            {{- if not .Values.redis.persistence.enabled }}
            volumes:
                -   name: data
                    emptyDir: {}
            {{- end }}
    {{- if .Values.redis.persistence.enabled }}
    volumeClaimTemplates:
        -   metadata:
                name: data
            spec:
                accessModes: ["ReadWriteOnce"]
                {{- with .Values.redis.persistence.storageClass }}
                storageClassName: {{ . | quote }}
                {{- end }}
                resources:
                    requests:
                        storage: {{ .Values.redis.persistence.size }}
    {{- end }}
