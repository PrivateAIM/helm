{{- if not .Values.auth.existingSecret }}
{{- $secretName := .Values.auth.secretName }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app: {{ .Release.Name }}-flame-hub
type: Opaque
stringData:

  # Get overrides from values
  {{- $mysqlRootPassword := .Values.mysql.auth.rootPassword | default "" }}
  {{- $mysqlReplicationPassword := .Values.mysql.auth.replicationPassword | default "" }}
  {{- $mysqlPassword := .Values.mysql.auth.password | default "" }}
  {{- $rabbitmqPassword := .Values.rabbitmq.auth.password | default "" }}
  {{- $redisPassword := .Values.redis.auth.password | default "" }}
  {{- $vaultToken := .Values.vault.server.dev.devRootToken | default "" }}
  {{- $minioRootPassword := .Values.minio.auth.rootPassword | default "" }}
  {{- $harborAdminPassword := .Values.harbor.adminPassword | default "" }}
  {{- $grafanaAdminPassword := .Values.grafana.admin.password | default "" }}
  {{- $authupDefaultAdminPassword := .Values.auth.defaultAdminPassword | default "" }}

  # Fill empty values with existing secret values if available
  {{- if and $existingSecret $existingSecret.data }}
    {{- if and (not $mysqlRootPassword) (hasKey $existingSecret.data "mysql-root-password") }}
      {{- $mysqlRootPassword = index $existingSecret.data "mysql-root-password" | b64dec }}
    {{- end }}
    {{- if and (not $mysqlReplicationPassword) (hasKey $existingSecret.data "mysql-replication-password") }}
      {{- $mysqlReplicationPassword = index $existingSecret.data "mysql-replication-password" | b64dec }}
    {{- end }}
    {{- if and (not $mysqlPassword) (hasKey $existingSecret.data "mysql-password") }}
      {{- $mysqlPassword = index $existingSecret.data "mysql-password" | b64dec }}
    {{- end }}
    {{- if and (not $rabbitmqPassword) (hasKey $existingSecret.data "rabbitmq-password") }}
      {{- $rabbitmqPassword = index $existingSecret.data "rabbitmq-password" | b64dec }}
    {{- end }}
    {{- if and (not $redisPassword) (hasKey $existingSecret.data "redis-password") }}
      {{- $redisPassword = index $existingSecret.data "redis-password" | b64dec }}
    {{- end }}
    {{- if and (not $vaultToken) (hasKey $existingSecret.data "vault-dev-root-token") }}
      {{- $vaultToken = index $existingSecret.data "vault-dev-root-token" | b64dec }}
    {{- end }}
    {{- if and (not $minioRootPassword) (hasKey $existingSecret.data "minio-root-password") }}
      {{- $minioRootPassword = index $existingSecret.data "minio-root-password" | b64dec }}
    {{- end }}
    {{- if and (not $harborAdminPassword) (hasKey $existingSecret.data "harbor-admin-password") }}
      {{- $harborAdminPassword = index $existingSecret.data "harbor-admin-password" | b64dec }}
    {{- end }}
    {{- if and (not $grafanaAdminPassword) (hasKey $existingSecret.data "grafana-admin-password") }}
      {{- $grafanaAdminPassword = index $existingSecret.data "grafana-admin-password" | b64dec }}
    {{- end }}
    {{- if and (not $authupDefaultAdminPassword) (hasKey $existingSecret.data "authup-default-admin-password") }}
      {{- $authupDefaultAdminPassword = index $existingSecret.data "authup-default-admin-password" | b64dec }}
    {{- end }}
  {{- end }}

  # Generate any missing values
  {{- if not $mysqlRootPassword }}{{ $mysqlRootPassword = randAlphaNum 32 }}{{- end }}
  {{- if not $mysqlReplicationPassword }}{{ $mysqlReplicationPassword = randAlphaNum 32 }}{{- end }}
  {{- if not $mysqlPassword }}{{ $mysqlPassword = randAlphaNum 32 }}{{- end }}
  {{- if not $rabbitmqPassword }}{{ $rabbitmqPassword = randAlphaNum 32 }}{{- end }}
  {{- if not $redisPassword }}{{ $redisPassword = randAlphaNum 32 }}{{- end }}
  {{- if not $vaultToken }}{{ $vaultToken = randAlphaNum 32 }}{{- end }}
  {{- if not $minioRootPassword }}{{ $minioRootPassword = randAlphaNum 32 }}{{- end }}
  {{- if not $harborAdminPassword }}{{ $harborAdminPassword = randAlphaNum 32 }}{{- end }}
  {{- if not $grafanaAdminPassword }}{{ $grafanaAdminPassword = randAlphaNum 32 }}{{- end }}
  {{- if not $authupDefaultAdminPassword }}{{ $authupDefaultAdminPassword = randAlphaNum 32 }}{{- end }}

  # Actual values in the secret
  mysql-root-password: {{ $mysqlRootPassword | quote }}
  mysql-replication-password: {{ $mysqlReplicationPassword | quote }}
  mysql-password: {{ $mysqlPassword | quote }}
  rabbitmq-password: {{ $rabbitmqPassword | quote }}
  redis-password: {{ $redisPassword | quote }}
  vault-dev-root-token: {{ $vaultToken | quote }}
  minio-root-password: {{ $minioRootPassword | quote }}
  harbor-admin-password: {{ $harborAdminPassword | quote }}
  grafana-admin-password: {{ $grafanaAdminPassword | quote }}
  authup-default-admin-password: {{ $authupDefaultAdminPassword | quote }}
  
  # Connection strings (pre-built with passwords)
  redis-connection-string: {{ printf "redis://default:%s@%s-redis-master:6379" $redisPassword .Release.Name | quote }}
  rabbitmq-connection-string: {{ printf "amqp://%s:%s@%s-rabbitmq:5672" .Values.rabbitmq.auth.username $rabbitmqPassword .Release.Name | quote }}
  vault-connection-string: {{ printf "%s@http://%s-vault:8200/v1/" $vaultToken .Release.Name | quote }}
  minio-connection-string: {{ printf "http://%s:%s@%s-minio:9000" .Values.minio.auth.rootUser $minioRootPassword .Release.Name | quote }}
  {{- if include "harbor.host" . }}
  harbor-connection-string: {{ printf "%s:%s@%s" .Values.harbor.adminUsername $harborAdminPassword (include "harbor.host" .) | quote }}
  {{- end }}

{{- end }}