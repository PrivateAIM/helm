{{/*
Harbor's own credentials, split out of the shared flame-hub-auth Secret so Harbor owns a
single, cohesive Secret:
  - harbor-admin-password    the admin password seed (Harbor's DB wins once initialized),
  - secretKey                the 16-char core key that encrypts DB fields (robot-account
                             tokens, replication creds). It MUST survive upgrades — a fresh
                             key makes those columns undecryptable.
  - harbor-connection-string admin URL credential consumed by server-core.

Skipped when the user brings their own (harbor.existingSecret). Created whenever a Harbor
host resolves — the in-cluster goharbor subchart or an externalHarbor.
*/}}
{{- if and (include "harbor.host" .) (not .Values.harbor.existingSecret) }}
{{- $secretName := .Values.harbor.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}

{{/* --- admin password --- */}}
{{- $adminPassword := .Values.harbor.adminPassword | default "" }}
{{/* 1. Steady state: this Secret is its own source of truth across upgrades. */}}
{{- if and (not $adminPassword) $existing $existing.data (hasKey $existing.data "harbor-admin-password") }}
  {{- $adminPassword = index $existing.data "harbor-admin-password" | b64dec }}
{{- end }}
{{/* 2. Fresh install: generate. */}}
{{- if not $adminPassword }}{{- $adminPassword = randAlphaNum 32 }}{{- end }}

{{/* --- core secretKey (must be exactly 16 chars; goharbor requires the key "secretKey") --- */}}
{{- $secretKey := .Values.harbor.secretKey | default "" }}
{{/* 1. Steady state / migration seed: reuse whatever is already stored. For a Bitnami ->
       goharbor migration, pre-create this Secret */}}
{{- if and (not $secretKey) $existing $existing.data (hasKey $existing.data "secretKey") }}
  {{- $secretKey = index $existing.data "secretKey" | b64dec }}
{{- end }}
{{/* 2. Fresh install: generate a 16-char key. */}}
{{- if not $secretKey }}{{- $secretKey = randAlphaNum 16 }}{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    app: {{ .Release.Name }}-flame-hub
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  harbor-admin-password: {{ $adminPassword | quote }}
  secretKey: {{ $secretKey | quote }}
  harbor-connection-string: {{ printf "%s:%s@%s" (.Values.harbor.adminUsername | urlquery) ($adminPassword | urlquery) (include "harbor.host" .) | quote }}
{{- end }}
