{{/* Harbor route is independent since it always needs its own hostname. */}}
{{- if and .Values.harbor.enabled (not .Values.externalHarbor.enabled) .Values.harbor.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ .Release.Name }}-harbor
spec:
    parentRefs:
        - name: {{ .Release.Name }}-harbor-gateway
    hostnames:
        - {{ include "harbor.host" . | quote }}
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: {{ .Release.Name }}-harbor
              port: 443
{{- end }}
