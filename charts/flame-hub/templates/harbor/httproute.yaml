{{/* Harbor route is independent since it always needs its own hostname. */}}
{{- if and .Values.harbor.enabled (not .Values.externalHarbor.enabled) .Values.harbor.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ .Release.Name }}-harbor
spec:
    parentRefs:
        - name: {{ .Release.Name }}-flame-hub-gateway
    hostnames:
        - {{ include "harbor.host" . | quote }}
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api/
            - path:
                type: PathPrefix
                value: /service/
            - path:
                type: PathPrefix
                value: /v2
            - path:
                type: PathPrefix
                value: /chartrepo/
            - path:
                type: PathPrefix
                value: /c/
          backendRefs:
            - name: {{ .Release.Name }}-harbor-core
              port: 80
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: {{ .Release.Name }}-harbor-portal
              port: 80
{{- end }}
