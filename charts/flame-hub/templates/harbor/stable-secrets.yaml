{{/*
Material the goharbor subchart would otherwise regenerate on every render: the token-signing
CA (genCA), the nginx self-signed cert (genCA) and the registry htpasswd (bcrypt, random
salt). Each new value changes a checksum annotation, so every upgrade - and every Flux retry
of a failed one - restarted harbor-core, jobservice, nginx and registry, including in the
middle of a schema migration. Generated once here, then read back from the cluster.
*/}}
{{- if and .Values.harbor.enabled (not .Values.externalHarbor.enabled) }}

{{- with .Values.harbor.core.secretName }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace . }}
{{- $data := dict }}
{{- if and $existing $existing.data (hasKey $existing.data "tls.key") (hasKey $existing.data "tls.crt") }}
  {{- $data = pick $existing.data "tls.key" "tls.crt" }}
{{- else }}
  {{- $ca := genCA "harbor-token-ca" 3650 }}
  {{- $data = dict "tls.key" ($ca.Key | b64enc) "tls.crt" ($ca.Cert | b64enc) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ . }}
  labels:
    app: {{ $.Release.Name }}-harbor
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}

{{- $tls := .Values.harbor.expose.tls }}
{{- if and $tls.enabled (eq $tls.certSource "secret") $tls.secret.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $tls.secret.secretName }}
{{- $data := dict }}
{{- if and $existing $existing.data (hasKey $existing.data "tls.key") (hasKey $existing.data "tls.crt") (hasKey $existing.data "ca.crt") }}
  {{- $data = pick $existing.data "tls.key" "tls.crt" "ca.crt" }}
{{- else }}
  {{- $cn := required "harbor.expose.tls.auto.commonName is required" $tls.auto.commonName }}
  {{- $ca := genCA "harbor-ca" 3650 }}
  {{- $cert := genSignedCert $cn nil (list $cn) 3650 $ca }}
  {{- $data = dict "tls.key" ($cert.Key | b64enc) "tls.crt" ($cert.Cert | b64enc) "ca.crt" ($ca.Cert | b64enc) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tls.secret.secretName }}
  labels:
    app: {{ .Release.Name }}-harbor
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}

{{- $creds := .Values.harbor.registry.credentials }}
{{- with $creds.existingSecret }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace . }}
{{- $data := dict }}
{{- if and $existing $existing.data (hasKey $existing.data "REGISTRY_PASSWD") (hasKey $existing.data "REGISTRY_HTPASSWD") }}
  {{- $data = pick $existing.data "REGISTRY_PASSWD" "REGISTRY_HTPASSWD" }}
{{- else }}
  {{- $password := randAlphaNum 32 }}
  {{- $username := $creds.username | default "harbor_registry_user" }}
  {{- $data = dict "REGISTRY_PASSWD" ($password | b64enc) "REGISTRY_HTPASSWD" (htpasswd $username $password | b64enc) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ . }}
  labels:
    app: {{ $.Release.Name }}-harbor
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}

{{- end }}
