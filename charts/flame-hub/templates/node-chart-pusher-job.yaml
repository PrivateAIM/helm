{{- if .Values.flameNode.provideChartForNode }}
{{- if or .Values.harbor.enabled .Values.externalHarbor.enabled }}
{{- $harborHost := include "harbor.internalHost" . -}}
{{- $secretName := include "flameHub.effectiveSecretName" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flame-hub.fullname" . }}-node-chart-pusher
  labels:
    {{- include "flame-hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-chart-pusher
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      volumes:
        - name: workspace
          emptyDir: {}
      {{- if not .Values.externalHarbor.enabled }}
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - {{ include "harbor.host" . | quote }}
      {{- end }}
      initContainers:
        {{- if not .Values.externalHarbor.enabled }}
        - name: harbor-proxy-sidecar-https
          image: alpine/socat
          restartPolicy: Always
          args: ["TCP-LISTEN:443,fork,bind=127.0.0.1", "TCP:{{ include "harbor.internalHost" . }}:443"]
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
        {{- end }}
        - name: chart-fetcher
          image: alpine/git
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          env:
            - name: CHART_VERSION
              value: {{ .Values.flameNode.chartVersion | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.flameNode.githubRepo | quote }}
          command:
            - /bin/sh
            - -ce
            - |
              CHART_FILE="flame-node-${CHART_VERSION}.tgz"
              DOWNLOAD_URL="https://github.com/${GITHUB_REPO}/releases/download/flame-node-${CHART_VERSION}/${CHART_FILE}"

              echo "Trying to download pre-built chart from ${DOWNLOAD_URL} ..."
              if wget -q -O "/workspace/${CHART_FILE}" "${DOWNLOAD_URL}"; then
                echo "Downloaded pre-built chart successfully."
              else
                rm -f "/workspace/${CHART_FILE}"
                echo "Pre-built chart not found. Cloning repo at ref ${CHART_VERSION} ..."
                git clone --depth 1 --branch "${CHART_VERSION}" \
                  "https://github.com/${GITHUB_REPO}.git" /workspace/helm-repo
                echo "Repository cloned."
              fi
      containers:
        - name: push-chart
          image: alpine/helm:3.17
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          env:
            - name: HARBOR_HOST
              value: {{ include "harbor.host" . | quote }}
            - name: HARBOR_INSECURE
              value: {{ .Values.harbor.enabled | quote }}
            - name: HARBOR_USERNAME
              value: {{ .Values.harbor.adminUsername | quote }}
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: harbor-admin-password
            - name: CHART_VERSION
              value: {{ .Values.flameNode.chartVersion | quote }}
            - name: HARBOR_PROJECT
              value: {{ .Values.flameNode.harborProject | quote }}
          command:
            - /bin/sh
            - -ce
            - |
              INSECURE_LOGIN_FLAG=""
              INSECURE_PUSH_FLAG=""
              INSECURE_WGET_FLAG=""

              if [ "${HARBOR_INSECURE}" = "true" ]; then
                echo "Using insecure connection to internal harbor."
                INSECURE_LOGIN_FLAG="--insecure"
                INSECURE_PUSH_FLAG="--insecure-skip-tls-verify"
                INSECURE_WGET_FLAG="--no-check-certificate"
              fi

              echo "Waiting for Harbor to become ready..."
              until wget ${INSECURE_WGET_FLAG} -qO- https://${HARBOR_HOST}/api/v2.0/ping 2>/dev/null; do
                echo "Waiting for harbor..."
                sleep 5
              done
              echo "Reached Harbor."

              CHART_FILE="/workspace/flame-node-${CHART_VERSION}.tgz"

              if [ -f "${CHART_FILE}" ]; then
                echo "Using pre-built chart from release."
              else
                echo "Building chart from cloned source..."
                helm dependency build /workspace/helm-repo/charts/flame-node
                helm package /workspace/helm-repo/charts/flame-node --destination /workspace
                CHART_FILE=$(ls /workspace/flame-node-*.tgz)
                echo "Chart built: ${CHART_FILE}"
              fi

              echo "Logging in to Harbor at ${HARBOR_HOST} ..."
              echo "${HARBOR_PASSWORD}" | helm registry login "${HARBOR_HOST}" \
                --username "${HARBOR_USERNAME}" \
                --password-stdin \
                ${INSECURE_LOGIN_FLAG}

              echo "Pushing chart to oci://${HARBOR_HOST}/${HARBOR_PROJECT} ..."
              helm push "${CHART_FILE}" "oci://${HARBOR_HOST}/${HARBOR_PROJECT}" \
                ${INSECURE_PUSH_FLAG}

              echo "Done."
{{- end }}
{{- end }}