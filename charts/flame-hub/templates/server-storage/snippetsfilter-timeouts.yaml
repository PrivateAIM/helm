{{- if and .Values.global.flameHub.gatewayApi.nginxGatewayFabric.snippets (or .Values.global.flameHub.gatewayApi.enabled .Values.serverStorage.gatewayApi.enabled) -}}
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
    name: {{ .Release.Name }}-flame-hub-server-storage-ngf-snippets
    namespace: {{ .Release.Namespace }}
spec:
    snippets:
        - context: http.server.location
          value: |
            proxy_connect_timeout 60s;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            proxy_busy_buffers_size 16k;
            client_max_body_size 0;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
{{- end }}
