{{- if or .Values.global.flameHub.gatewayApi.enabled .Values.serverStorage.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ .Release.Name }}-flame-hub-server-storage
spec:
    parentRefs:
        - name: {{ .Release.Name }}-flame-hub-gateway
    hostnames:
        - {{ .Values.serverStorage.gatewayApi.hostname | default .Values.global.flameHub.gatewayApi.hostname | quote }}
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: {{ .Values.serverStorage.gatewayApi.path }}
          {{- $rewrite := ne .Values.serverStorage.gatewayApi.path "/" }}
          {{- $ngfSnip := eq (include "flameHub.gatewayApi.nginxSnippetsTimeouts" .) "true" }}
          {{- if or $rewrite $ngfSnip }}
          filters:
          {{- if $rewrite }}
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
          {{- end }}
          {{- if $ngfSnip }}
            - type: ExtensionRef
              extensionRef:
                group: gateway.nginx.org
                kind: SnippetsFilter
                name: {{ .Release.Name }}-flame-hub-server-storage-ngf-timeouts
          {{- end }}
          {{- end }}
          {{- if not $ngfSnip }}
          timeouts:
              request: 300s
              backendRequest: 300s
          {{- end }}
          backendRefs:
            - name: {{ .Release.Name }}-flame-hub-server-storage
              port: 3000
{{- end }}
