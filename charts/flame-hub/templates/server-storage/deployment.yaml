apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ .Release.Name }}-flame-hub-server-storage
    labels:
        app: {{ .Release.Name }}-flame-hub-server-storage
spec:
    replicas: 1
    selector:
        matchLabels:
            app: {{ .Release.Name }}-flame-hub-server-storage
    template:
        metadata:
            name: {{ .Release.Name }}-flame-hub-server-storage
            labels:
                app: {{ .Release.Name }}-flame-hub-server-storage
                appGroup: "{{ .Release.Name }}-flame-hub"
        spec:
            restartPolicy: Always
            initContainers:
                -   name: wait-for-db
                    image: busybox
                    command: [
                        'sh',
                        '-c',
                        'until nc -z -v -w30 {{ include "flameHub.postgresql.host" . }} 5432; do echo "Waiting for db..."; sleep 5; done'
                    ]
                -   name: wait-for-redis
                    image: busybox
                    command: [
                        'sh',
                        '-c',
                        'until nc -z -v -w30 {{ include "flameHub.redis.host" . }} {{ include "flameHub.redis.port" . }}; do echo "Waiting for redis..."; sleep 5; done'
                    ]
                -   name: wait-for-rabbitmq
                    image: busybox
                    command: [
                        'sh',
                        '-c',
                        'until nc -z -v -w30 {{ .Release.Name }}-rabbitmq 5672; do echo "Waiting for rabbitmq..."; sleep 5; done'
                    ]
                -   name: wait-for-seaweedfs
                    image: busybox
                    command: [
                        'sh',
                        '-c',
                        'until nc -z -v -w30 {{ include "flameHub.seaweedfs.s3Host" . }} 8333; do echo "Waiting for seaweedfs..."; sleep 5; done'
                    ]
                -   name: wait-for-authup
                    image: busybox
                    command: [
                        'sh',
                        '-c',
                        'until nc -z -v -w30 {{ .Release.Name }}-authup-server-core 3000; do echo "Waiting for authup..."; sleep 5; done'
                    ]
            containers:
                -   name: "{{ .Release.Name }}-flame-hub-server-storage"
                    image: {{ include "flameHub.image" . | trim | quote }}
                    args: ["storage", "cli", "start"]
                    imagePullPolicy: {{ .Values.image.pullPolicy | trim | quote }}
                    ports:
                        -   containerPort: 3000
                            protocol: TCP
                    env:
                        -   name: REDIS_CONNECTION_STRING
                            valueFrom:
                                secretKeyRef:
                                    name: {{ include "flameHub.effectiveSecretName" .  }}
                                    key: redis-connection-string
                        -   name: RABBITMQ_CONNECTION_STRING
                            valueFrom:
                                secretKeyRef:
                                    name: {{ include "flameHub.effectiveSecretName" .  }}
                                    key: rabbitmq-connection-string
                        -   name: S3_ACCESS_KEY
                            valueFrom:
                                secretKeyRef:
                                    name: {{ include "flameHub.seaweedfs.s3SecretName" . }}
                                    key: admin_access_key_id
                        -   name: S3_SECRET_KEY
                            valueFrom:
                                secretKeyRef:
                                    name: {{ include "flameHub.seaweedfs.s3SecretName" . }}
                                    key: admin_secret_access_key
                        # The app still expects its S3 config under the MINIO_* name
                        -   name: MINIO_CONNECTION_STRING
                            value: "http://$(S3_ACCESS_KEY):$(S3_SECRET_KEY)@{{ include "flameHub.seaweedfs.s3Host" . }}:8333"
                        -   name: AUTHUP_URL
                            value: "http://{{ .Release.Name }}-authup-server-core:3000/"
                        -   name: DB_TYPE
                            value: "postgres"
                        -   name: DB_HOST
                            value: {{ include "flameHub.postgresql.host" . | quote }}
                        -   name: DB_USERNAME
                            valueFrom:
                                secretKeyRef:
                                    name: {{ include "flameHub.postgresql.secretName" . }}
                                    key: username
                        -   name: DB_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: {{ include "flameHub.postgresql.secretName" . }}
                                    key: password
                        -   name: DB_DATABASE
                            value: "storage"
                        -   name: CLIENT_ID
                            value: "system"
                        -   name: CLIENT_SECRET
                            valueFrom:
                                secretKeyRef:
                                    name: {{ include "flameHub.effectiveSecretName" .  }}
                                    key: authup-client-secret
                        -   name: REALM
                            value: "master"
                    resources:
                        requests:
                            memory: "512Mi"
                        limits:
                            memory: "2048Mi"
                    startupProbe:
                        httpGet:
                            path: "/"
                            port: 3000
                        periodSeconds: 5
                        failureThreshold: 60
                    readinessProbe:
                        httpGet:
                            path: "/"
                            port: 3000
                        periodSeconds: 5
                        timeoutSeconds: 10
                    livenessProbe:
                        httpGet:
                            path: "/"
                            port: 3000
                        failureThreshold: 3
                        periodSeconds: 15
