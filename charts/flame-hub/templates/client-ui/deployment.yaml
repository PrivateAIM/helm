{{- include "flameHub.validateCookieDomain" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-flame-hub-client-ui"
  labels:
    app: "{{ .Release.Name }}-flame-hub-client-ui"
spec:
  replicas: {{ .Values.clientUI.replicaCount }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-flame-hub-client-ui"
  template:
    metadata:
      name: "{{ .Release.Name }}-flame-hub-client-ui"
      labels:
        app: "{{ .Release.Name }}-flame-hub-client-ui"
        appGroup: "{{ .Release.Name }}-flame-hub"
    spec:
      restartPolicy: Always
      containers:
        - name: "{{ .Release.Name }}-flame-hub-client-ui"
          image: {{ include "flameHub.image" . | trim | quote }}
          args: ["ui", "start"]
          imagePullPolicy: {{ .Values.image.pullPolicy | trim | quote }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
              # Empty unless the operator opts in - see clientUI.cookieDomain in
              # values.yaml. Always emitted, so an empty value overrides whatever
              # the image baked at build time rather than leaving it in place.
              -   name: NUXT_PUBLIC_COOKIE_DOMAIN
                  value: {{ .Values.clientUI.cookieDomain | default "" | trim | quote }}
              -   name: NUXT_CORE_URL
                  value: "http://{{ .Release.Name }}-flame-hub-server-core:3000/"
              -   name: NUXT_PUBLIC_CORE_URL
                  value: {{ include "serverCore.publicURL" . | trim | quote }}
              -   name: NUXT_STORAGE_URL
                  value: "http://{{ .Release.Name }}-flame-hub-server-storage:3000/"
              -   name: NUXT_PUBLIC_STORAGE_URL
                  value: {{ include "serverStorage.publicURL" . | trim | quote }}
              -   name: NUXT_TELEMETRY_URL
                  value: "http://{{ .Release.Name }}-flame-hub-server-telemetry:3000/"
              -   name: NUXT_PUBLIC_TELEMETRY_URL
                  value: {{ include "serverTelemetry.publicURL" . | trim | quote }}
              -   name: NUXT_AUTHUP_URL
                  value: "http://{{ .Release.Name }}-authup-server:3000/"
              -   name: NUXT_PUBLIC_AUTHUP_URL
                  value: {{ include "flameHub.authup.publicURL" . | trim | quote }}
          resources:
              requests:
                  memory: "512Mi"
              limits:
                  memory: "2048Mi"
          startupProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 5
              failureThreshold: 60
          readinessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 5
              timeoutSeconds: 10
          livenessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 10
              timeoutSeconds: 10


