{{- if or .Values.global.flameHub.gatewayApi.enabled .Values.clientUI.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ .Release.Name }}-flame-hub-client-ui
spec:
    parentRefs:
        - name: {{ .Release.Name }}-flame-hub-gateway
    hostnames:
        - {{ .Values.clientUI.gatewayApi.hostname | default .Values.global.flameHub.gatewayApi.hostname | quote }}
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: {{ .Values.clientUI.gatewayApi.path }}
          {{- if ne .Values.clientUI.gatewayApi.path "/" }}
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
          {{- end }}
          backendRefs:
            - name: {{ .Release.Name }}-flame-hub-client-ui
              port: 3000
{{- end }}
