global:
  flameHub:
    ingress:
      # enable this ingress for path based routing
      # alternatively you can enable ingress for each Hub service individually (subdomain-based routing)
      # see the values.yaml for more details and examples
      enabled: true
      hostname: "hub.local"

auth:
  # Specify a default FLAME admin password for local testing
  authupAdminPassword: "" # Leave empty for auto-generation
  # See README.md for more details on how to access auto-generated credentials

harbor:
  enabled: true
  # Specify a default Harbor admin password for local testing
  adminPassword: "" # Leave empty for auto-generation
  externalURL: "https://harbor.hub.local/" # don't forget https://
