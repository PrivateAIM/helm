apiVersion: v2
name: flame-hub
description: A Helm chart for Kubernetes
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: "0.1.0"

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "0.1.0"

dependencies:
    -   name: mysql
        version: 12.3.3
        repository: https://charts.bitnami.com/bitnami

    -   name: redis
        version: 20.11.5
        repository: https://charts.bitnami.com/bitnami

    -   name: rabbitmq
        version: 15.5.3
        repository: https://charts.bitnami.com/bitnami

    -   name: minio
        version: 16.0.8
        repository: https://charts.bitnami.com/bitnami

    -   name: vault
        version: 0.28.1
        repository: https://helm.releases.hashicorp.com

    -   name: grafana
        version: 12.0.9
        repository: https://charts.bitnami.com/bitnami
    -   name: grafana-loki
        version: 5.0.4
        repository: https://charts.bitnami.com/bitnami

    -   name: prometheus
        version: 2.1.10
        repository: https://charts.bitnami.com/bitnami

    -   name: authup
        repository: file://../third-party/authup
        version: 0.1.0

    -   name: flame-hub-client-ui
        repository: file://../flame-hub-client-ui
        version: 0.1.0

    -   name: flame-hub-server-core
        repository: file://../flame-hub-server-core
        version: 0.1.0

    -   name: flame-hub-server-messenger
        repository: file://../flame-hub-server-messenger
        version: 0.1.0

    -   name: flame-hub-server-storage
        repository: file://../flame-hub-server-storage
        version: 0.1.0

    -   name: flame-hub-server-telemetry
        repository: file://../flame-hub-server-telemetry
        version: 0.1.0

    -   name: flame-hub-server-analysis-manager
        repository: file://../flame-hub-server-analysis-manager
        version: 0.1.0
