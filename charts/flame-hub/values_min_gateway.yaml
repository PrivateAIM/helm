global:
  flameHub:
    gatewayApi:
      # enable gateway API for all services
      enabled: true
      hostname: "hub.local"
      gateway:
        className: "nginx" # Must match your GatewayClass name
      # enable snippets for timeout/body-size configuration (requires NGINX Gateway Fabric)
      nginxGatewayFabric:
        snippets: true

authup:
  publicURL: "https://hub.local"
  auth:
    # Specify a default FLAME admin password for local testing
    adminPassword: "" # Leave empty for auto-generation
    # See README.md for more details on how to access auto-generated credentials

grafana:
  # disable plugins until plugin issues are fixed
  plugins:

harbor:
  enabled: true
  # Harbor requires its own hostname with Gateway API
  gatewayApi:
    enabled: true
  # Specify a default Harbor admin password for local testing
  adminPassword: "" # Leave empty for auto-generation
  externalURL: "https://harbor.hub.local/" # don't forget https://
