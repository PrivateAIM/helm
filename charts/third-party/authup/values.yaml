ingress:
    enabled: false
    className: ""
    annotations: {}
    hostname: ""
    path: "/"
    pathType: "Prefix"

image:
    repository: "authup/authup"
    tag: "latest"
    pullPolicy: "Always"

auth:
    # Use an existing secret with keys: client-secret, redis-connection-string, postgresql-password
    existingSecret: ""

    # or provide credentials in values (used when existingSecret is not set)
    redisPassword: "start123"
    postgresPassword: "start123"
    adminPassword: "start123"
    clientSecret: "start123"

cookieDomain: ""
publicURL: ""
# Additional domains for which authorization is permitted.
# Accepts a comma-separated string or a list of domains.
# When deployed as part of the flame-hub chart, this defaults to the public domain of the Hub UI.
additionalDomains: ""
