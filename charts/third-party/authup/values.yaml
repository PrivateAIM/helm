ingress:
    enabled: false
    className: ""
    annotations: {}
    hostname: ""
    path: "/"
    pathType: "Prefix"

image:
    repository: "authup/authup"
    tag: "latest"
    pullPolicy: "Always"

auth:
    existingSecret: ""

    # or provide credentials in values (used when existingSecret is not set)
    redisPassword: "start123"
    postgresPassword: "start123"
    adminPassword: "start123"
    clientSecret: "start123"

# Declarative provisioning of authup entities (permissions, roles, policies, ...).
# When enabled, a directory of provisioning files is mounted read-only into
# <WRITABLE_DIRECTORY_PATH>/provisioning; authup's FileProvisioningSource loads and
# synchronizes them on every boot (default strategy createOnly, i.e. non-destructive).
# See https://authup.org (server-core provisioning).
provisioning:
    enabled: false
    # Directory authup scans for provisioning files. Must sit under the container's
    # WRITABLE_DIRECTORY_PATH (default /usr/src/app/writable in the official image).
    mountPath: "/usr/src/app/writable/provisioning"
    # Name of an existing ConfigMap holding the provisioning files. Rendered with tpl,
    # so a parent chart may pass e.g. '{{ .Release.Name }}-authup-provisioning'.
    # When empty, a ConfigMap is rendered from `files` below.
    existingConfigMap: ""
    # Map of filename -> file content, used only when existingConfigMap is empty.
    # Each key becomes a file in the provisioning directory (json/yaml/yml/ts/js).
    files: {}


database:
    host: ""
    # Secret holding the DB password. When empty, auth.postgresPassword is used inline
    # instead, which is only appropriate for standalone/dev installs.
    existingSecret: ""
    passwordKey: "password"

cookieDomain: ""
publicURL: ""
# Trusted first-party application origins (redirect allowlist for the web client; not CORS).
# Accepts a comma-separated string or a list. Each entry is either a bare host[:port]
# (e.g. "hub.local", which expands to both its http and https origin) or an explicit-scheme
# origin (e.g. "https://hub.local", which contributes exactly that origin). Only http/https.
# The value is rendered as a Helm template (tpl), so a parent chart may inject
# its own helpers, e.g. '{{ include "flameHub.uiDomain" . }}'.
trustedOrigins: ""
