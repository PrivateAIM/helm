apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-authup-server-core"
  labels:
    app: "{{ .Release.Name }}-authup-server-core"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-authup-server-core"
  template:
    metadata:
      name: "{{ .Release.Name }}-authup-server-core"
      labels:
        app: "{{ .Release.Name }}-authup-server-core"
    spec:
      restartPolicy: Always
      initContainers:
          -   name: wait-for-db
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ tpl (required "database.host is required (set authup.database.host in the parent chart)" .Values.database.host) $ }} 5432; do echo "Waiting for db..."; sleep 5; done'
              ]
          -   name: wait-for-redis
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-redis-master 6379; do echo "Waiting for redis..."; sleep 5; done'
              ]
      containers:
        - name: "{{ .Release.Name }}-authup-server-core"
          image: "{{ .Values.image.repository | default "authup/authup" }}:{{ .Values.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            {{- with .Values.cookieDomain }}
              -   name: COOKIE_DOMAIN
                  value: "{{- toString . | trim }}"
            {{- end }}
            {{- with .Values.publicURL }}
              -   name: PUBLIC_URL
                  value: "{{- toString . | trim }}"
            {{- end }}
            {{- $trustedOrigins := .Values.trustedOrigins }}
            {{- if kindIs "slice" $trustedOrigins }}
              {{- $trustedOrigins = join "," $trustedOrigins }}
            {{- end }}
            {{- with tpl (toString ($trustedOrigins | default "")) $ | trim }}
              -   name: TRUSTED_ORIGINS
                  value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.existingSecret }}
              -   name: REDIS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.auth.existingSecret }}
                      key: redis-connection-string
              -   name: USER_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.auth.existingSecret }}
                      key: authup-admin-password
              -   name: USER_ADMIN_PASSWORD_RESET
                  value: "true"
              -   name: CLIENT_SYSTEM_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.auth.existingSecret }}
                      key: authup-client-secret
            {{- else }}
              -   name: REDIS
                  value: "redis://default:{{ .Values.auth.redisPassword }}@{{ .Release.Name }}-redis-master:6379"
              -   name: USER_ADMIN_PASSWORD
                  value: {{ .Values.auth.adminPassword | quote }}
              -   name: CLIENT_SYSTEM_SECRET
                  value: {{ .Values.auth.clientSecret | quote }}
            {{- end }}
              -   name: CLIENT_SYSTEM_ENABLED
                  value: "true"
              -   name: CLIENT_SYSTEM_SECRET_RESET
                  value: "true"
              -   name: ROBOT_ADMIN_ENABLED
                  value: "true"
              -   name: DB_TYPE
                  value: "postgres"
              -   name: DB_HOST
                  value: {{ tpl (required "database.host is required (set authup.database.host in the parent chart)" .Values.database.host) $ | quote }}
              -   name: DB_USERNAME
                  {{- $dbUserSecret := tpl (.Values.database.existingSecret | default "") $ }}
                  {{- if $dbUserSecret }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $dbUserSecret }}
                      key: {{ .Values.database.usernameKey | quote }}
                  {{- else }}
                  value: {{ .Values.database.username | quote }}
                  {{- end }}
              -   name: DB_DATABASE
                  value: "auth"
              {{/* Sits outside the auth.existingSecret branch above: the database
                   credential has its own Secret, independent of the shared auth one. */}}
              -   name: DB_PASSWORD
                  {{- $dbSecret := tpl (.Values.database.existingSecret | default "") $ }}
                  {{- if $dbSecret }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $dbSecret }}
                      key: {{ .Values.database.passwordKey | quote }}
                  {{- else }}
                  value: {{ .Values.database.password | quote }}
                  {{- end }}
          resources:
              requests:
                  memory: "512Mi"
              limits:
                  memory: "2048Mi"
          startupProbe:
              httpGet:
                  path: "/"
                  port: 3000
              failureThreshold: 60
              periodSeconds: 5 # Allows up to 5 minutes (60 * 5s) for initial startup/migration
          readinessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 5
              timeoutSeconds: 10
          livenessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              failureThreshold: 3
              periodSeconds: 60
        {{- if .Values.provisioning.enabled }}
          volumeMounts:
              -   name: provisioning
                  mountPath: {{ .Values.provisioning.mountPath | quote }}
                  readOnly: true
        {{- end }}
      {{- if .Values.provisioning.enabled }}
      volumes:
          -   name: provisioning
              configMap:
                  name: {{ tpl (.Values.provisioning.existingConfigMap | default (printf "%s-authup-provisioning" .Release.Name)) . | quote }}
      {{- end }}


