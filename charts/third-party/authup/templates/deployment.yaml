apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-authup-server-core"
  labels:
    app: "{{ .Release.Name }}-authup-server-core"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-authup-server-core"
  template:
    metadata:
      name: "{{ .Release.Name }}-authup-server-core"
      labels:
        app: "{{ .Release.Name }}-authup-server-core"
    spec:
      restartPolicy: Always
      initContainers:
          -   name: wait-for-db
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-postgresql-primary 5432; do echo "Waiting for db..."; sleep 5; done'
              ]
          -   name: wait-for-redis
              image: busybox
              command: [
                  'sh',
                  '-c',
                  'until nc -z -v -w30 {{ .Release.Name }}-redis-master 6379; do echo "Waiting for redis..."; sleep 5; done'
              ]
      containers:
        - name: "{{ .Release.Name }}-authup-server-core"
          image: "authup/authup:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            {{- with .Values.cookieDomain }}
              -   name: COOKIE_DOMAIN
                  value: "{{- toString . | trim }}"
            {{- end }}
            {{- with .Values.publicURL }}
              -   name: PUBLIC_URL
                  value: "{{- toString . | trim }}"
            {{- end }}
              -   name: REDIS
                  value: "redis://default:{{ .Values.global.redis.password }}@{{ .Release.Name }}-redis-master"
              -   name: CLIENT_SYSTEM_ENABLED
                  value: "true"
              -   name: CLIENT_SYSTEM_SECRET
                  value: "start123"
              -   name: CLIENT_SYSTEM_SECRET_RESET
                  value: "true"
              -   name: ROBOT_ADMIN_ENABLED
                  value: "true"
              -   name: DB_TYPE
                  value: "postgres"
              -   name: DB_HOST
                  value: "{{ .Release.Name }}-postgresql-primary"
              -   name: DB_USERNAME
                  value: "postgres"
              -   name: DB_PASSWORD
                  value: "start123"
              -   name: DB_DATABASE
                  value: "auth"
          resources:
              requests:
                  memory: "512Mi"
              limits:
                  memory: "2048Mi"
          startupProbe:
              httpGet:
                  path: "/"
                  port: 3000
              failureThreshold: 90
              periodSeconds: 10 # Allows up to 15 minutes (90 * 10s) for initial startup/migration
          readinessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              periodSeconds: 5
              timeoutSeconds: 10
          livenessProbe:
              httpGet:
                  path: "/"
                  port: 3000
              failureThreshold: 3
              periodSeconds: 60


