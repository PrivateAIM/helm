openebs:
  engines:
    local:
      hostpath:
        enabled: false
      lvm:
        enabled: false
      zfs:
        enabled: false
    replicated:
      mayastor:
        enabled: true
  mayastor:
    agents:
      core:
        rebuild:
          partial:
            waitPeriod: "20m"
    csi:
      node:
        nvme:
          # nvme controller loss timeout (see https://github.com/PrivateAIM/hub-deployment/issues/5)
          # Use this to prevent Mayastor from trying to connect to a dead NVMe controller
          # (when rebooting a node that uses network-attached storage)
          ctrl_loss_tmo: "30" # leave empty for default 1980, recommended 30-90

        # You may need to set the kubeletDir (default is /var/lib/kubelet)
        # For MicroK8s, the kubeletDir is /var/snap/microk8s/common/var/lib/kubelet
        # kubeletDir: /var/snap/microk8s/common/var/lib/kubelet # no trailing slash !!

  loki:
    enabled: false
  alloy:
    enabled: false
  obs:
    callhome:
      enabled: false

  # Mayastor configuration (only used when mayastor.enabled is true)
  mayastorConfig:
    # StorageClasses to create
    storageClasses:
      - name: mayastor-replicated
        replicationFactor: 3
        protocol: nvmf
        allowVolumeExpansion: true

    # DiskPools to create - one per node with dedicated block device
    # Example:
    # diskPools:
    #     - name: pool-on-node-1
    #       node: worker-node-1
    #       disks:
    #           - "aio:///dev/disk/by-partuuid/<partuuid>"
